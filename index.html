  </div>`;

  h += `<h2 class="sect">Money</h2><div class="card" style="margin:0">
    ${kv(`Freight ${Math.round(e.qty).toLocaleString()} mt × $${e.rate.toFixed(2)}`, money0(e.gross))}
    ${kv(T("addcomm","Commissions"), cost0(e.comm), "neg")}
    ${kv("Net freight", money0(e.net))}
    ${e.advance>0?kv(`  of which ${pc(CFG.FREIGHT_ON_BL)} advanced on loading`, money0(e.advance), "mut"):""}
    ${Object.entries(e.bunkerMt).filter(([g,mt])=>mt>0.5).map(([g,mt])=>
       kv(T(g,CFG.FUEL[g].name)+" "+Math.round(mt)+" mt", "", "mut")).join("")}
    ${kv(T("bunkers","Bunkers")+" total", cost0(e.bunkerCost), "neg")}
    ${e.emergency>0.5?`<div class="xs haz" style="margin:-2px 0 6px">${Math.round(e.emergency)} mt lifted at sea prices plus ${pc(CFG.EMERGENCY_LIFT_PREMIUM)} — she ran short. Bunker before sailing next time.</div>`:""}
    ${kv(T("da","Port disbursements"), cost0(e.portDA), "neg")}
    ${e.carbon>1 ? kv(T("ets","Carbon")+` — ${Math.round(e.etsCo2)} t CO₂`, cost0(e.carbon), "neg") : ""}
    ${Math.abs(e.demurrage)>100 ? kv(
        e.overrun>0 ? T("demurrage","Demurrage")+" "+days1(e.overrun) : T("despatch","Despatch")+" "+days1(-e.overrun),
        (e.demurrage>0?"+":"−")+money0(Math.abs(e.demurrage)), e.demurrage>0?"pos":"neg") : ""}
    ${kvt("Gross voyage profit", money0(e.gvp), cls_pn(e.gvp))}
    ${kv(T("opex","OPEX")+" "+days1(e.days), cost0(e.opex), "neg")}
    ${kvt("Net contribution", money0(e.netCash), cls_pn(e.netCash))}
  </div>`;

  if(e.carbon>1){
    h += `<h2 class="sect">Carbon detail</h2><div class="card" style="margin:0">
      ${kv("CO₂ emitted", Math.round(e.etsCo2).toLocaleString()+" t")}
      ${kv("EU scope", pc(e.euScope)+(e.euScope===1?" — intra-EU":e.euScope===0.5?" — one leg in the EU":""))}
      ${kv(T("ets","EU ETS"), cost0(e.etsCost), "neg")}
      ${kv(T("fueleu","FuelEU"), cost0(e.feuCost), "neg")}
    </div>`;
  }
  return h;
}

function sheetEstimate(shipId){

/* --- bunkering ----------------------------------------------------------- */
function sheetBunker(shipId){
  const sh = S.ships.find(s=>s.id===shipId); if(!sh) return;
  renderBunker(sh, null);
}
let bunkerLift = {};
function renderBunker(sh, grade){
  const cls = shipCls(sh), port = PORTS[sh.port];
  const inEca = port.eca === 1;
  const avail = Object.keys(CFG.FUEL).filter(g =>
    bunkerPrice(port, g, MKT) !== null && (g !== "hsfo" || sh.scrubber));
  if(!avail.length){
    showSheet("Bunkers", esc(port.name),
      `<div class="empty"><div class="big">⛽</div><div class="b">No bunkers available here</div>
       <div class="sm mut2" style="margin-top:6px">${esc(port.name)} is not a bunkering port. Fuel for a fixture is bought at the load port anyway and priced into the estimate — you only need to lift early when it is cheaper here than there.</div></div>`);
    return;
  }
  // Default to the grade she can actually burn where she is. Offering VLSFO to a
  // ship inside an ECA invites the player to spend half their cash on fuel that
  // is illegal to burn on the next leg.
  const g = grade || (inEca && avail.includes("mgo") ? "mgo"
                    : sh.scrubber && avail.includes("hsfo") ? "hsfo"
                    : avail.includes("vlsfo") ? "vlsfo" : avail[0]);
  const px = bunkerPrice(port, g, MKT);
  const space = cls.fuelCap - robTot(sh);
  const key = sh.id+g;

  // Endurance, which is the number that actually matters — not tonnes.
  const ecoSpeed = cls.designSpeed - 1.5;
  const burn = burnAt(cls, ecoSpeed, true);
  const aboard = sh.rob[g] || 0;
  const daysAboard = burn > 0 ? aboard/burn : 0;
  const perDay = Math.max(1, Math.round(burn));
  // Recommend a working stem — about three weeks of steaming — not a full tank.
  const rec = clamp(Math.ceil(burn*21 - aboard), 0, Math.floor(space));
  const lift = clamp(bunkerLift[key] ?? rec, 0, space);
  const cost = lift*px;
  const heavy = cost > S.cash*0.25;

  const others = Object.entries(PORTS)
    .map(([id,p])=>({ id, p, px: bunkerPrice(p, g, MKT) }))
    .filter(x=>x.px !== null && x.id !== sh.port)
    .sort((a,b)=>a.px-b.px).slice(0,4);

  let h = `<div class="seg">${avail.map(x=>
    `<button aria-selected="${x===g}" onclick="renderBunker(S.ships.find(s=>s.id===${sh.id}),'${x}')">${CFG.FUEL[x].name}</button>`).join("")}</div>`;

  h += `<div class="card" style="margin:0 0 12px">
    ${kvs("You do not have to buy anything here",
      `Fuel for a fixture is bought at the load port and already priced into every estimate. Lift early only when it is cheaper here than where she is going.`, "mut")}
  </div>`;

  h += `<h2 class="sect" style="margin-top:0">Endurance</h2><div class="card" style="margin:0">
    ${kv(CFG.FUEL[g].name+" aboard", Math.round(aboard).toLocaleString()+" mt")}
    ${kv("At "+ecoSpeed.toFixed(1)+" kn laden she burns", perDay+" mt/day")}
    ${kv("That is", days1(daysAboard)+" of steaming", daysAboard<8?"neg":daysAboard<15?"haz":"pos")}
    ${inEca?kvs("She is inside an "+T("eca","ECA"), "Only MGO may be burned here and on the next leg out.", "haz"):""}
    ${kv("Tanks", Math.round(robTot(sh)).toLocaleString()+" of "+cls.fuelCap.toLocaleString()+" mt")}
  </div>`;

  h += `<h2 class="sect">Lift</h2><div class="card" style="margin:0">
    <div class="between"><div class="b mono">${Math.round(lift).toLocaleString()} mt</div>
      <div class="b ${cost>S.cash?"neg":heavy?"haz":""}">${money0(cost)}</div></div>
    <input type="range" min="0" max="${Math.max(1,Math.floor(space))}" step="10" value="${Math.floor(lift)}"
      oninput="bunkerLift['${key}']=+this.value;renderBunker(S.ships.find(s=>s.id===${sh.id}),'${g}')">
    <div class="row" style="gap:5px;flex-wrap:wrap;margin-top:2px">
      ${[10,21,35].map(d=>{ const mt=clamp(Math.ceil(burn*d-aboard),0,Math.floor(space));
        return `<button class="btn sm" style="${Math.abs(lift-mt)<5?"border-color:var(--acc)":""}"
          onclick="bunkerLift['${key}']=${mt};renderBunker(S.ships.find(s=>s.id===${sh.id}),'${g}')">${d} days</button>`;}).join("")}
      <button class="btn sm" onclick="bunkerLift['${key}']=${Math.floor(space)};renderBunker(S.ships.find(s=>s.id===${sh.id}),'${g}')">Fill</button>
    </div>
    <div class="xs mut2" style="margin-top:7px">${lift>0
      ? `Takes her to ${days1((aboard+lift)/Math.max(burn,0.01))} of steaming at $${px}/mt.`
      : `Nothing lifted.`}</div>
    ${cost>S.cash?`<div class="xs neg" style="margin-top:6px">More than you have in the bank.</div>`
      : heavy?`<div class="xs haz" style="margin-top:6px">That is ${pc(cost/S.cash)} of your cash tied up in fuel. A working stem is usually enough — the load port sells fuel too.</div>`:""}
  </div>`;

  h += `<h2 class="sect">Cheapest ${CFG.FUEL[g].name} elsewhere</h2><div class="card" style="margin:0">
    ${kv(esc(port.name)+" (here)", "$"+px+"/mt", "b")}
    ${others.map(o=>kv(esc(o.p.name), "$"+o.px+"/mt", o.px<px?"pos":"mut")).join("")}
    <div class="xs mut2" style="margin-top:7px">Lifting where fuel is cheap and running through where it is dear is worth real money over a year. ${T("bunkers","Bunkers")} are the largest voyage cost you actually control.</div>
  </div>`;

  showSheet("Bunkering", `${esc(sh.name)} · ${esc(port.name)}`, h,
    `<button class="btn ${heavy?"":"pri"}" ${cost>S.cash||lift<1?"disabled":""}
      onclick="doBunker(${sh.id},'${g}',${Math.floor(lift)},${px})">
      ${lift<1?"Lift nothing":`Lift ${Math.round(lift).toLocaleString()} mt for ${money(cost)}`}</button>`);
}
function doBunker(shipId, g, mt, px){
  const sh = S.ships.find(s=>s.id===shipId); if(!sh || mt<1) return;
  const cost = mt*px;
  if(cost > S.cash){ toast("Not enough cash.", "bad"); return; }
  // Weighted-average the cost of what is already aboard with the new stem.
  const had = sh.rob[g] || 0, hadPx = sh.robCost[g] || px;
  sh.rob[g] = had + mt;
  sh.robCost[g] = (had*hadPx + mt*px) / (had+mt);
  S.cash -= cost; S.ledger.bunkers += cost;
  hideSheet();
  toast(`Lifted ${mt.toLocaleString()} mt ${CFG.FUEL[g].name} at $${px}/mt`, "good");
  dirty();
}

function indexCard(k){
  const m = INDEX_META[k], v = S.mkt.idx[k], hist = S.mkt.hist[k] || [];
  // Without a month of history there is no month of movement to report. Saying
  // "+0.0 / 30d" on the opening screen states a fact that has not happened yet.
  const has30 = hist.length > 6;
  const chg = has30 ? v - hist[hist.length-7] : 0;
  const band = v<70?"Weak":v<95?"Soft":v<115?"Mid-cycle":v<150?"Firm":"Strong";
  const bcls = v<70?"neg":v<95?"haz":v<115?"":"pos";
  return `<div class="card tap" onclick="sheetIndex('${k}')">
    <div class="between">
      <div><div class="b">${m.name}</div>
        <div class="xs mut2">${band} market</div></div>
      <div style="text-align:right">
        <div class="lg b ${bcls}">${v.toFixed(1)}</div>
        <div class="xs ${has30?cls_pn(chg):"mut2"}">${has30
          ? (chg>=0?"+":"")+chg.toFixed(1)+" / 30d"
          : "no 30-day history yet"}</div>
      </div></div>
    ${sparkline(hist)}
  </div>`;
}

function sparkline(hist){
  hist = (hist||[]).filter(Number.isFinite);
  if(hist.length<3) return "";
  const w=100, hh=38, lo=Math.min(...hist), hi=Math.max(...hist), rg=Math.max(hi-lo,1);
  const pts = hist.map((v,i)=>`${(i/(hist.length-1)*w).toFixed(2)},${(hh-(v-lo)/rg*hh).toFixed(2)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none" style="margin-top:8px">
    <polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

function sheetIndex(k){
  const m = INDEX_META[k], hist = S.mkt.hist[k]||[], v = S.mkt.idx[k];
  const lo = hist.length?Math.min(...hist):v, hi = hist.length?Math.max(...hist):v;
  showSheet(m.name, `Index ${v.toFixed(1)} · ${hist.length*CFG.MKT.histEvery} days of history`,
    `<div class="card" style="margin:0 0 12px">${chart(hist)}</div>
     <div class="card" style="margin:0">
      ${kv("Now", v.toFixed(1))}
      ${kv("Period high", hi.toFixed(1))}
      ${kv("Period low", lo.toFixed(1))}
      ${kv("Mid-cycle", "100.0")}
     </div>
     <div class="card" style="margin-top:12px">
      <div class="sm mut">Freight rates are cyclical, and the cycle is long — roughly four to five years peak to peak. Fixing a ship on a long time charter near the top and staying spot near the bottom is the whole game. Rates on this index feed straight through to every ${m.short} cargo on the board.</div>
     </div>`);
}

function chart(hist){
  hist = (hist||[]).filter(Number.isFinite);
  if(hist.length<3) return `<div class="mut sm">Not enough history yet.</div>`;
  const w=300, h=150, pad=18;
  const lo=Math.min(...hist,60), hi=Math.max(...hist,140), rg=Math.max(hi-lo,1);
  const x=i=>pad+(i/(hist.length-1))*(w-pad-4);
  const y=v=>h-pad-((v-lo)/rg)*(h-pad-8);
  const pts=hist.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  let g="";
  for(const gv of [50,100,150,200]){ if(gv<lo||gv>hi) continue;
    g+=`<line class="gl" x1="${pad}" y1="${y(gv)}" x2="${w-4}" y2="${y(gv)}"/>
        <text class="ax" x="0" y="${y(gv)+3}">${gv}</text>`; }
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${g}
    <line class="gl" x1="${pad}" y1="${y(100)}" x2="${w-4}" y2="${y(100)}" stroke-dasharray="3 3"/>
    <polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

function lockView(icon, title, body, n){
  return `<div class="lock"><div class="big">${icon}</div>
    <div class="t">${title}</div>
    <div class="sm" style="max-width:290px;margin:0 auto">${body}</div>
    <div class="pill" style="margin-top:14px">${S.voyagesDone} / ${n} voyages</div></div>`;
}

/* --- export / import ------------------------------------------------------ */
function doExport(){
  const blob = new Blob([serialise()], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `kription-${dateFull(S.day).replace(/ /g,"-")}.json`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast("Save exported.", "good");
}
function doImport(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try { load(String(r.result)); hideSheet(); save(); dirty();
            toast("Save imported.", "good"); }
      catch(e){ toast("That file is not a Kription save.", "bad"); }
    };
    r.readAsText(f);
  };
  inp.click();
}
function hardReset(){
  try { localStorage.removeItem(CFG.SAVE_KEY); } catch(e){}
  hideSheet(); newGame(); dirty();
}

/* ############################################################################
   §SIM II — the whole running game: new game, the tick, the voyage lifecycle,
   the fixture board across all segments, surveys, port state control, events,
   S&P and newbuilding, debt covenants and restructuring, tax and registry,
   derivatives, and liner services.
   ######################################################################### */

/* One pool for every trade, so the fixture board is a single filter rather than
   a switch statement per segment. */
const ROUTE_POOL = [
  ...ROUTES.map(r=>({ ...r, kind:"dry"  })),
  ...WET_ROUTES.map(r=>({ ...r, kind:"wet", rate:r.flat, ws:true })),
  ...GAS_ROUTES.map(r=>({ ...r, kind:"gas"  })),
  ...PCTC_ROUTES.map(r=>({ ...r, kind:"pctc" })),
  ...REEF_ROUTES.map(r=>({ ...r, kind:"reef" })),
  ...PROJ_ROUTES.map(r=>({ ...r, kind:"proj" })),
].filter(r=>PORTS[r.l] && PORTS[r.d]);

/* Cargo that needs lifting gear rather than a conveyor, grab, hose or ramp. */
const NEEDS_GEAR = new Set(["steel","scrap","forest","proj"]);

/* Can this class lift this trade at all? Size band, gear, ice, cargo grade and
   the physical ability to get alongside. */
function eligible(cls, r){
  if(r.kind === "dry"  && (cls.seg !== "dry" || cls.dwt < r.dwt[0] || cls.dwt > r.dwt[1])) return false;
  if(r.kind === "wet"){
    if(cls.seg !== "tanker" || cls.dwt < r.dwt[0] || cls.dwt > r.dwt[1]) return false;
    const g = CARGOES[r.c].grade;
    if(g && cls.grades && !cls.grades.includes(g)) return false;
  }
  if(r.kind === "gas"  && (cls.seg !== "gas" || (cls.cbm||0) < r.cbm[0] || (cls.cbm||0) > r.cbm[1])) return false;
  if(r.kind === "pctc" && (cls.seg !== "pctc" || (cls.ceu||0) < r.ceu[0] || (cls.ceu||0) > r.ceu[1])) return false;
  if(r.kind === "reef" && cls.seg !== "reefer") return false;
  if(r.kind === "proj" && cls.seg !== "project") return false;
  const lp = PORTS[r.l], dp = PORTS[r.d];
  if(lp.bunkerOnly || dp.bunkerOnly) return false;
  // Ship's gear only matters for cargo that has to be lifted. A crude terminal
  // works through hoses and an ore berth through a shiploader — which is exactly
  // why Capesizes, VLCCs and LNG carriers are all gearless. Requiring cranes at
  // every crane-less port shut those segments out of their own trades entirely.
  if(NEEDS_GEAR.has(CARGOES[r.c].grp)){
    if(!lp.shoreGear && !cls.geared) return false;
    if(!dp.shoreGear && !cls.geared) return false;
  }
  if(r.iceReq && (cls.ice||0) < r.iceReq) return false;
  if(r.ice    && (cls.ice||0) < r.ice) return false;
  // A ship that cannot even part-load at the berth has no business bidding.
  if(Math.min(lp.maxDraft, dp.maxDraft) < cls.draft*0.62) return false;
  return true;
}
function routeIdx(r){
  if(r.kind === "dry") return ROUTES_SEG(r);
  if(r.kind === "wet") return (r.dwt[0]+r.dwt[1])/2 >= 95000 ? "dirty" : "prod";
  return { gas:"gas", pctc:"pctc", reef:"reefer", proj:"offshore" }[r.kind];
}

/* ==========================================================================
   NEW GAME
   ========================================================================= */
function newGame(seed){
  seed = seed || (Math.floor(Math.random()*1e9)>>>0);
  MKT = newMarket(seed);
  for(const k of Object.keys(MKT.idx)) MKT.idx[k].v = CFG.MKT.startIndex;

  const s = {
    v: 2, seed, day: 0, speed: 1, paused: false, tab: "fleet",
    cash: CFG.START_CASH,
    ships: [], fixtures: [], tcOffers: [], coaOffers: [], dayOffers: [],
    fixturesStamp: -99, snpStamp: -99, nextId: 1,
    voyagesDone: 0,
    snp: [], orders: [], coas: [], services: [], ffa: [], swaps: [],
    events: [], eventStamp: 0,
    loans: [], loanSeq: 0, lenderSeq: 0, autoDraft: true, coSub: "accounts",
    ledger: { freight:0, hire:0, bunkers:0, portDA:0, tolls:0, war:0, carbon:0,
              demurrage:0, opex:0, shore:0, interest:0, principal:0, survey:0, psc:0,
              tax:0, snp:0, scrap:0, liner:0, derivatives:0, penalties:0,
              fees:0, lease:0 },
    office: defaultOffice(),
    yearBook: { start:0, profit:0 },
    daily: [], log: [], seen: {}, coached: {}, mkt: null,
    rep: 0.5, rating: "C", cov: null,
    redSeaClosed: CFG.REDSEA_CLOSED_START, drought: false,
    autoPause: true, pauseReason: null,
    lastWall: Date.now(), debug: false,
  };

  const cfg = CFG.START_SHIP;
  const val = assetValue(cfg.cls, 2026 - cfg.built, MKT);
  const ship = mkShip(s, cfg.cls, cfg.name, cfg.built, cfg.port);
  ship.flag = "marshall"; ship.classSoc = "bv";    // generic start; NIS is a mid-game lever
  // She comes with bunkers aboard, weighted to the grade her home trade burns:
  // the Baltic and North Sea are an ECA throughout, so that means MGO.
  ship.rob = { mgo: 340, vlsfo: 240 };
  ship.robCost = { mgo: CFG.FUEL.mgo.base + 30, vlsfo: CFG.FUEL.vlsfo.base + 30 };
  ship.flagMult = flagOpexMult(ship.flag);
  s.ships.push(ship);
  S = s;
  // She comes with a mortgage on her, like almost every first ship ever bought.
  bankOriginate({ kind:"mortgage", shipId:ship.id, principal: val*cfg.ltv,
                  rate: cfg.rate, termYears: cfg.termYears,
                  lender: "Nordvest Maritime Bank" });
  refreshBoard(true);
  refreshSnp(true);
  snapshotMarket();
  return s;
}

function mkShip(s, clsId, name, built, port){
  const cls = CLASSES[clsId];
  const rob = {}, robCost = {};
  const eca = (PORTS[port] || {}).eca === 1;
  rob.vlsfo = Math.round(cls.fuelCap*(eca ? 0.16 : 0.32));
  rob.mgo   = Math.round(cls.fuelCap*(eca ? 0.26 : 0.10));
  robCost.vlsfo = CFG.FUEL.vlsfo.base + 30;
  robCost.mgo   = CFG.FUEL.mgo.base + 30;
  const age = 2026 + Math.floor((s.day||0)/365) - built;
  return {
    id: s.nextId++, cls: clsId, name, built, port,
    status: "idle", voyage: null,
    rob, robCost, scrubber: false, eco: false, retrofit: false, dualFuel: null,
    hull: clamp(1 - Math.max(0, age-8)*0.012, 0.55, 1),
    flag: "marshall", classSoc: "bv", flagMult: 1,
    debt: null, emp: { type:"spot" },
    // class and compliance
    lastSS: -Math.floor(Math.random()*900), lastIS: 0, deferrals: 0, dd: null,
    cii: { co2:0, nm:0, year:2026 }, ciiRating: "C", ciiRatio: 1,
    deficiencies: 0, pscBump: 0, pscCount: 0, detentions: 0,
    vetPasses: 0, vetScore: 0, lastGrade: null,
    lifeTce: [], lifeDays: 0, lifeGvp: 0, voyages: 0, offHireDays: 0,
  };
}
/* Crew is roughly half of OPEX, so a flag's manning premium lands at half rate
   on the total. This is the cost side of the tonnage-tax trade. */
function flagOpexMult(flagId){ return 1 + (FLAGS[flagId].crew - 1)*0.5; }

/* ==========================================================================
   THE TICK
   ========================================================================= */
function stepSim(dt, quiet){
  S.day += dt;
  stepMarket(MKT, dt, S.day);

  for(const sh of S.ships){
    accrueDaily(sh, dt, quiet);
    if(sh.layup) stepLayup(sh, dt, quiet);
    if(sh.dd) advanceDrydock(sh, dt, quiet);
    else if(sh.voyage) advanceVoyage(sh, dt, quiet);
    else if(sh.status === "idle" && !sh.layup) maybeAutoEmploy(sh, quiet);
  }
  for(const svc of S.services) accrueService(svc, dt);
  accrueShore(dt);

  const d = Math.floor(S.day);
  if(!S.daily.length || S.daily[S.daily.length-1].day !== d){
    S.daily.push({ day:d, cash:Math.round(S.cash), eq:Math.round(equity()) });
    if(S.daily.length > 900) S.daily.shift();
    onNewDay(d, quiet);
  }
  if(S.day - S.fixturesStamp >= CFG.FIXTURE_REFRESH_DAYS) refreshBoard();
  if(S.day - S.snpStamp >= 30) refreshSnp();
  if(!quiet) rollEvents(dt);
  if(S.cash < 0 && !S.bust) onInsolvent();
}

/* Things that happen on a day boundary rather than continuously. */
function onNewDay(d, quiet){
  // deliveries
  for(const o of S.orders.slice()) if(d >= o.deliveryDay) deliverNewbuild(o, quiet);
  // derivatives
  for(const f of S.ffa.slice())  if(d >= f.endDay) settleFfa(f, quiet);
  for(const w of S.swaps.slice()) if(d >= w.endDay) settleSwap(w, quiet);
  // bank instalments fall due on their own monthly dates, and leases expire
  bankNewDay(d, quiet);
  // charter expiries
  for(const sh of S.ships) if(sh.emp && sh.emp.endDay && d >= sh.emp.endDay) endEmployment(sh, quiet);
  // COA performance
  for(const c of S.coas.slice()) if(d >= c.endDay) closeCoa(c, quiet);
  // annual tax and CII rollover
  if(d > 0 && d % 365 === 0){ settleTax(quiet); rolloverCii(); }
  // seasonal regimes, checked monthly
  if(d % 30 === 0){
    S.drought = MKT.rnd() < CFG.PANAMA_DROUGHT.chance;
    if(MKT.rnd() < 0.03) S.redSeaClosed = !S.redSeaClosed;
    checkCovenants(quiet);
  }
  // surveys fall due
  for(const sh of S.ships) checkSurvey(sh, quiet);
}

/* Daily OPEX, debt service, hire income, and the slow decay of a working hull. */
function accrueDaily(sh, dt, quiet){
  const cls = shipCls(sh);
  const emp = sh.emp || { type:"spot" };
  const offHire = !!sh.dd || sh.status === "detained";

  // Bareboat out: the charterer carries the whole running cost. That is the trade.
  // Liner: the service's own economics already carry OPEX for its whole string
  // (linerPlan's opexYear), so charging it again here would be double counting.
  if(emp.type !== "bb" && emp.type !== "liner"){
    // A laid-up ship still costs money — skeleton crew, class, insurance and the
    // berth — but far less than a trading one. That is the whole point of it.
    const share = sh.layup && sh.layup.state === "laid" ? CFG.LAYUP.opexShare : 1;
    const berth = sh.layup && sh.layup.state === "laid"
      ? CLASSES[sh.cls].gt * CFG.LAYUP.berthPerGtDay : 0;
    const opex = (opexDayFull(cls, shipAge(sh), sh)*share + berth) * dt;
    S.cash -= opex; S.ledger.opex += opex;
  }
  // Registry fee
  const fee = CLASSES[sh.cls].gt * FLAGS[sh.flag||"marshall"].feePerGt / 365 * dt;
  S.cash -= fee; S.ledger.opex += fee;

  // Hire income for the employment types that pay by the day
  if((emp.type === "tc" || emp.type === "bb" || emp.type === "dayrate") && !offHire){
    const gross = emp.rate * dt;
    const net = gross * (1 - CFG.TC.addComm);
    S.cash += net; S.ledger.hire += net;
    emp.earned = (emp.earned||0) + net;
  } else if(offHire && (emp.type === "tc" || emp.type === "dayrate")){
    sh.offHireDays += dt; emp.offHire = (emp.offHire||0) + dt;
  }

  // Debt service is NOT charged here. Loan instalments are drafted monthly by
  // §BANK on each facility's own date, which is how a loan agreement works.
  // The HUD still shows the daily-equivalent so the draft is never a surprise.

  // Bareboat hire on a leased-back ship is an operating cost, not debt service,
  // and it runs every single day she is on the books.
  if(sh.lease){
    const hire = sh.lease.daily * dt;
    S.cash -= hire; S.ledger.lease = (S.ledger.lease||0) + hire;
    sh.lease.paid = (sh.lease.paid||0) + hire;
  }
  // Working the ship wears her; drydock puts it back. Lying idle at a lay-up
  // berth wears her faster still — steel that is not being maintained under way
  // is steel nobody is looking at.
  if(sh.layup && sh.layup.state === "laid")
    sh.hull = clamp(sh.hull - 0.000045*CFG.LAYUP.hullDecay*dt*shoreFx("hullDecayMult"), 0.35, 1);
  else if(sh.status !== "idle" && !sh.dd)
    sh.hull = clamp(sh.hull - 0.000045*dt*shoreFx("hullDecayMult"), 0.35, 1);
}

/* ==========================================================================
   LAY-UP
   Two transitions, each with a real duration, so the decision is a bet on the
   market rather than a switch. Going in is quick and cheap; coming out takes a
   working week and costs money, which is exactly why an owner who calls the
   recovery late arrives after the rates have gone.
   ========================================================================= */
function layupCost(sh){
  return opexDayFull(shipCls(sh), shipAge(sh), sh) * CFG.LAYUP.outDays * CFG.LAYUP.outCost;
}
function layupSavingDay(sh){
  const full = opexDayFull(shipCls(sh), shipAge(sh), sh);
  return full*(1 - CFG.LAYUP.opexShare) - CLASSES[sh.cls].gt*CFG.LAYUP.berthPerGtDay;
}
function layUp(shipId){
  const sh = S.ships.find(s=>s.id===shipId); if(!sh) return;
  if(sh.voyage || sh.dd){ toast("She is not free.", "bad"); return; }
  if(sh.emp && sh.emp.type !== "spot"){ toast("She is on charter. Wait for redelivery.", "bad"); return; }
  sh.layup = { state:"going", left:CFG.LAYUP.inDays, since:S.day, port:sh.port };
  sh.status = "layup";
  hideSheet(); dirty();
  toast(`<b>${esc(sh.name)}</b> is going into warm lay-up — ${money0(layupSavingDay(sh))}/day saved, and nothing earned until she is back.`, "warn");
}
function reactivate(shipId){
  const sh = S.ships.find(s=>s.id===shipId); if(!sh || !sh.layup) return;
  const c = layupCost(sh);
  if(c > S.cash){ toast(`Reactivation costs ${money(c)} and you do not have it.`, "bad"); return; }
  S.cash -= c; S.ledger.opex += c;
  sh.layup.state = "coming"; sh.layup.left = CFG.LAYUP.outDays;
  hideSheet(); dirty();
  toast(`Reactivating <b>${esc(sh.name)}</b> — ${money(c)} for crew, stores and class. Back on the berth in ${CFG.LAYUP.outDays} days.`, "");
}
/* Advance the two transitions. Called once per tick per ship. */
function stepLayup(sh, dt, quiet){
  const L = sh.layup; if(!L || L.state === "laid") return;
  L.left -= dt;
  if(L.left > 0) return;
  if(L.state === "going"){
    L.state = "laid"; L.left = 0; sh.status = "layup";
  } else {
    const days = Math.round(S.day - L.since);
    sh.layup = null; sh.status = "idle";
    if(!quiet) queueNote("Back in service",
      `<b>${esc(sh.name)}</b> is out of lay-up and open at ${esc(PORTS[sh.port].name)} after ${days} days.
       Find her a cargo — she is costing full running money again from today.`, "good");
  }
}

/* ==========================================================================
   VOYAGE LIFECYCLE
   ========================================================================= */
function estOpts(sh){
  return { year: year(), month: gDate().getUTCMonth(), drought: S.drought,
           shipValue: assetValue(sh.cls, shipAge(sh), MKT),
           // What this ship's own finance costs per day — her mortgages, plus
           // bareboat hire if she is leased in. Corporate debt is not charged
           // against a single voyage.
           debtDaily: shipDebtServiceDay(sh) + (sh.lease ? sh.lease.daily : 0),
           speedCap: sh.speedCap, portRateMult: sh.portRateMult,
           extraDelay: 0 };
}

function fixVoyage(sh, fx, speed){
  const est = voyageEstimate(sh, fx, speed, MKT, estOpts(sh));
  if(!(est.qtyOut > 0)) return { ok:false, why:"She cannot lift this cargo." };
  if(fx.vetGate && vettingScore(sh) < CFG.VET.gate)
    return { ok:false, why:`${fx.major} will not approve her. Vetting score ${vettingScore(sh)} against ${CFG.VET.gate} required.` };

  sh.voyage = {
    fx: JSON.parse(JSON.stringify(fx)), plan: est, speed: est.speed,
    elapsed: 0, phase: est.balDays > 0.01 ? "ballast" : "loading",
    act: { bunkerCost:0, bunkerMt:{}, portDA:0, freight:0, freightAdv:0, demurrage:0,
           carbon:0, tolls:0, war:0, days:0, co2:0, nm:0, extra:0, notes:[] },
    billed: { load:false, disch:false, tolls:false, war:false, freight:false },
    startDay: S.day,
  };
  sh.status = sh.voyage.phase;
  S.fixtures = S.fixtures.filter(f => f.id !== fx.id);
  if(fx.coaId){ const c = S.coas.find(x=>x.id===fx.coaId); if(c) c.liftsDone++; }
  return { ok:true, est };
}

function advanceVoyage(sh, dt, quiet){
  const v = sh.voyage, p = v.plan, cls = shipCls(sh);
  const ph = phaseOf(v);
  const lp = PORTS[v.fx.load], dp = PORTS[v.fx.disch];
  const onHire = !!p.hireMode;

  // --- burn, and record what it did to the carbon ledger ---------------
  let mtDay = 0, inEca = false;
  if(ph.name === "ballast" || ph.name === "laden"){
    const laden = ph.name === "laden";
    mtDay = burnAt(cls, laden ? p.spLad : p.spBal, laden);
    const legNm  = laden ? p.ladNm : p.balNm;
    const legEca = laden ? seaRoute(v.fx.load, v.fx.disch).ecaNm : seaRoute(sh.port, v.fx.load).ecaNm;
    inEca = legNm > 0 && (ph.into/Math.max(ph.len,1e-9)) < (legEca/legNm);
    v.act.nm += (laden ? p.spLad : p.spBal) * 24 * dt;
  } else {
    mtDay = cls.auxPort;
    inEca = (ph.name === "loading" ? lp : dp).eca === 1;
  }
  const mt = mtDay*dt*(1 - (sh.eco?CFG.SNP.nbEcoGain:0) - (sh.retrofit?CFG.CII.retrofitGain:0));
  burnFuel(sh, mt, inEca, ph.name === "loading" ? lp : ph.name === "discharging" ? dp : null, onHire);
  const grade = inEca ? "mgo" : (sh.scrubber ? "hsfo" : "vlsfo");
  v.act.co2 += mt * CFG.FUEL[grade].co2 * (cls.dualFuel === "lng" ? 0.75 : 1);
  sh.cii.co2 += mt * CFG.FUEL[grade].co2 * (cls.dualFuel === "lng" ? 0.75 : 1);

  // --- bill each call once, on arrival --------------------------------
  if(ph.name !== v.phase){ v.phase = ph.name; sh.status = ph.name; }
  if(ph.name !== "ballast" && !v.billed.load){
    v.billed.load = true; sh.port = v.fx.load;
    if(!onHire){ const da = portDA(lp, cls); v.act.portDA += da; S.cash -= da; S.ledger.portDA += da; }
    if(!onHire && p.tollCost){ v.act.tolls += p.tollCost; S.cash -= p.tollCost; S.ledger.tolls += p.tollCost; }
    if(!onHire && p.warCost){ v.act.war += p.warCost; S.cash -= p.warCost; S.ledger.war += p.warCost; }
    if(has("psc")) maybePsc(sh, quiet);
  }
  // Freight advance against the bill of lading, i.e. once she is loaded — and
  // the voyage bunker stem at the same moment, so the two largest cash movements
  // offset each other the way an owner actually times them.
  if(!v.billed.freight && !onHire && (ph.name === "laden" || ph.name === "discharging")){
    v.billed.freight = true;
    const adv = p.net * CFG.FREIGHT_ON_BL;
    v.act.freightAdv = adv;
    S.cash += adv; S.ledger.freight += adv;
    stemForVoyage(sh, v, lp);
  }
  if(ph.name === "discharging" && !v.billed.disch){
    v.billed.disch = true;
    if(!onHire){ const da = portDA(dp, cls); v.act.portDA += da; S.cash -= da; S.ledger.portDA += da; }
  }

  v.elapsed += dt; v.act.days += dt;
  sh.cii.nm += (ph.name === "ballast" || ph.name === "laden") ? (ph.name==="laden"?p.spLad:p.spBal)*24*dt : 0;
  if(v.elapsed >= p.days + (v.act.extra||0) - 1e-9) settleVoyage(sh, quiet);
}

/* Buy the fuel this voyage still needs, at the load port's screen price. Without
   this the tanks simply ran dry mid-ocean and the player paid a hurry premium on
   fuel the estimate had already quoted at the normal price. */
function stemForVoyage(sh, v, loadPort){
  const p = v.plan;
  const left = clamp(1 - v.elapsed/Math.max(p.days, 0.01), 0, 1);
  for(const [g, mt] of Object.entries(p.fuel || {})){
    const need = mt*left*1.16 - (sh.rob[g] || 0);        // margin for weather and delay
    if(need <= 1) continue;
    const px = bunkerPrice(loadPort, g, MKT)
            ?? Math.round(CFG.FUEL[g].base*MKT.oil*(1+CFG.EMERGENCY_LIFT_PREMIUM));
    const cost = need*px;
    const had = sh.rob[g] || 0, hadPx = sh.robCost[g] || px;
    sh.rob[g] = had + need;
    sh.robCost[g] = (had*hadPx + need*px)/(had + need);
    S.cash -= cost; S.ledger.bunkers += cost;
    v.act.stem = (v.act.stem||0) + cost;
  }
}

function settleVoyage(sh, quiet){
  const v = sh.voyage, p = v.plan, cls = shipCls(sh);
  const lp = PORTS[v.fx.load], dp = PORTS[v.fx.disch];
  const onHire = !!p.hireMode;
  const days = Math.max(v.act.days, 0.01);

  // Revenue: freight on a spot voyage, hire on a time charter. Hire has already
  // been credited day by day in accrueDaily, so it is not credited again here.
  let net = 0;
  if(onHire){
    // Hire has already been credited day by day in accrueDaily; this is the
    // figure for the voyage record, so the log shows what she actually earned.
    net = p.hireMode.rate * days * (1 - CFG.TC.addComm);
  } else {
    const recover = v.recoverPct ?? 1;
    const total = p.net * recover * (v.freightAdj ?? 1);
    const already = v.act.freightAdv || 0;
    // Balance on right and true delivery. If an event cut the total below what was
    // already advanced there is simply no balance to collect — you keep the advance.
    const balance = Math.max(0, total - already);
    S.cash += balance; S.ledger.freight += balance;
    net = already + balance;
  }
  // Demurrage has to be claimed. A thin operations desk simply does not get
  // round to all of it — despatch you owe is still paid in full.
  const dem = onHire ? 0 : (p.demurrage > 0 ? p.demurrage*shoreFx("demurrageRate") : p.demurrage);
  if(dem){ S.cash += dem; S.ledger.demurrage += dem; }

  // Carbon settles on the fuel actually burned, not the estimate.
  const scope = euScope(lp, dp);
  const ets = etsCost(v.act.bunkerMt, scope), feu = fuelEuCost(v.act.bunkerMt, scope);
  const carbon = onHire ? 0 : ets.cost + feu.cost;
  if(carbon){ S.cash -= carbon; S.ledger.carbon += carbon; }

  const costs = v.act.bunkerCost + v.act.portDA + v.act.tolls + v.act.war + carbon;
  const gvp = net - costs + dem + (v.bonus||0);
  const tce = gvp/days;
  const opex = (sh.emp && sh.emp.type === "bb" ? 0 : opexDayFull(cls, shipAge(sh), sh)) * days;

  sh.port = v.fx.disch; sh.status = "idle"; sh.voyage = null;
  sh.voyages++; sh.lifeDays += days; sh.lifeGvp += gvp;
  sh.lifeTce.push(Math.round(tce)); if(sh.lifeTce.length>40) sh.lifeTce.shift();
  sh.speedCap = null; sh.portRateMult = null;
  if(CARGOES[v.fx.cargo].wet) sh.lastGrade = CARGOES[v.fx.cargo].grade;
  S.voyagesDone++;
  updateCii(sh);
  ensureBoard(sh);          // she is open now, so she has offers now

  const entry = {
    day: Math.round(S.day), shipId: sh.id, shipName: sh.name, cls: sh.cls,
    load: v.fx.load, disch: v.fx.disch, cargo: v.fx.cargo,
    loadName: lp.name, dischName: dp.name, unit: p.unit,
    qty: Math.round(p.qtyOut), rate: v.fx.rate, speed: v.speed, onHire,
    hireRate: onHire ? p.hireMode.rate : 0,
    days, balDays:p.balDays, ladDays:p.ladDays, loadDays:p.loadDays, dischDays:p.dischDays,
    canalDays:p.canalDays, iceDays:p.iceDays, balNm:p.balNm, ladNm:p.ladNm,
    gross: onHire ? p.hireMode.rate*days : p.gross, comm:p.comm, net,
    bunkerCost: v.act.bunkerCost, bunkerMt: v.act.bunkerMt, emergency: v.act.emergency||0,
    portDA: v.act.portDA, daLoad:p.daLoad, daDisch:p.daDisch,
    tolls: v.act.tolls, tollDetail:p.tolls, war: v.act.war, warZones:p.warZones,
    canals: p.canals, altNm: p.altNm,
    carbon, etsCost:ets.cost, feuCost:feu.cost, etsCo2:ets.co2, euScope:scope,
    demurrage: dem, laytime:p.laytime, overrun:p.overrun, demRate:p.demRate,
    advance: v.act.freightAdv||0, wcap:p.wcap, stem: v.act.stem||0,
    costs, gvp, tce, opex, netCash: gvp-opex, notes: v.act.notes.slice(),
  };
  S.log.unshift(entry);
  if(S.log.length > 200) S.log.pop();
  if(!quiet) onVoyageDone(entry, sh);
  return entry;
}

/* Time charter, bareboat, day-rate and liner ships do not need the player to
   find them cargo; the charterer does that. Spot ships wait for a decision. */
function maybeAutoEmploy(sh, quiet){
  const emp = sh.emp || {};
  if(emp.type === "tc" || emp.type === "coa"){
    // The charterer sends her somewhere. We still sail, burn and wear.
    const cand = ROUTE_POOL.filter(r => eligible(shipCls(sh), r)
      && seaRoute(sh.port, r.l).nm < 5200);
    if(!cand.length) return;
    const r = cand[Math.floor(MKT.rnd()*cand.length)];
    const fx = mkFixture(r, sh, MKT.rnd, { hire: emp.type === "tc" ? { rate: emp.rate } : null,
                                           coaId: emp.type === "coa" ? emp.coaId : null });
    if(emp.type === "coa"){ const c = S.coas.find(x=>x.id===emp.coaId); if(c) fx.rate = c.rate; }
    fixVoyage(sh, fx, shipCls(sh).designSpeed - 1.5);
  }
}

function endEmployment(sh, quiet){
  const t = sh.emp.type;
  sh.emp = { type:"spot" };
  ensureBoard(sh);
  if(!quiet){
    toast(`<b>${esc(sh.name)}</b> redelivered from ${t === "tc" ? "time charter" : t === "bb" ? "bareboat" : "contract"}.`, "warn");
    autoPause(`${sh.name} redelivered and open`);
  }
}

/* ==========================================================================
   DRYDOCK AND SURVEYS
   ========================================================================= */
function checkSurvey(sh, quiet){
  if(sh.dd || !has("survey")) return;
  const nx = nextSurvey(sh);
  sh.surveyDue = nx;
  if(S.day < nx.due) return;
  if(sh.voyage) return;                      // finish the voyage first
  // A laid-up ship is not trading, so class is content to let the survey wait
  // until she is reactivated. Drydocking a ship you have stopped paying to run
  // would be the opposite of the point.
  if(sh.layup) return;
  if(S.day < nx.due + CFG.SURVEY.deferDays && sh.deferRequested === nx.due) return;
  startDrydock(sh, nx.type, quiet);
}
function startDrydock(sh, type, quiet){
  const cost = surveyCost(sh, type)*shoreFx("drydockCostMult"), days = surveyDays(sh, type);
  sh.dd = { type, days, left:days, cost, paid:false };
  sh.status = "drydock";
  S.cash -= cost; S.ledger.survey += cost; sh.dd.paid = true;
  if(!quiet) toast(`<b>${esc(sh.name)}</b> into drydock — ${type === "SS" ? "special survey" : "intermediate survey"}, ${days1(days)}, ${money(cost)}.`, "warn");
}
function advanceDrydock(sh, dt, quiet){
  sh.dd.left -= dt;
  if(sh.dd.left > 0) return;
  const type = sh.dd.type;
  if(type === "SS"){ sh.lastSS = S.day; sh.lastIS = S.day; }
  else sh.lastIS = S.day;
  sh.hull = clamp(sh.hull + (type === "SS" ? 0.34 : 0.16) + (sh.dd.bonus||0), 0, 1);
  sh.deferrals = 0; sh.deferRequested = null; sh.pscBump = Math.max(0, (sh.pscBump||0)-0.5);
  sh.dd = null; sh.status = "idle";
  if(!quiet) toast(`<b>${esc(sh.name)}</b> out of drydock, back in class.`, "good");
}
function deferSurvey(sh){
  const nx = nextSurvey(sh);
  sh.deferRequested = nx.due; sh.deferrals = (sh.deferrals||0)+1;
  sh.hull = clamp(sh.hull - CFG.SURVEY.deferHull, 0.3, 1);
  sh.pscBump = (sh.pscBump||0) + 0.6;
  toast(`Survey deferred on <b>${esc(sh.name)}</b>. Condition down, inspection risk up, and the eventual bill is ${pc(CFG.SURVEY.deferPenalty)} worse.`, "warn");
  dirty();
}

/* ==========================================================================
   PORT STATE CONTROL
   ========================================================================= */
function maybePsc(sh, quiet){
  // Roughly six port calls a year, so the annual risk is spread across them.
  if(MKT.rnd() > pscRisk(sh)/6) return;
  const res = pscInspect(sh, MKT.rnd);
  sh.pscCount++; sh.deficiencies = res.deficiencies;
  S.cash -= res.cost; S.ledger.psc += res.cost;
  if(res.detained){
    sh.detentions++; S.rep = clamp(S.rep - CFG.PSC.repDamage, 0, 1);
    if(sh.voyage) sh.voyage.act.extra = (sh.voyage.act.extra||0) + res.days;
    if(sh.voyage) sh.voyage.act.notes.push(`Detained at ${PORTS[sh.port].name}: ${res.deficiencies} deficiencies, ${days1(res.days)} lost.`);
    if(!quiet) queueNote("Detained", `<b>${esc(sh.name)}</b> detained at ${esc(PORTS[sh.port].name)} — ${res.deficiencies} deficiencies. ${days1(res.days)} lost and ${money(res.cost)} to rectify. Your flag and your name both carry this.`, "bad");
  } else if(!quiet && res.deficiencies > 0){
    toast(`<b>${esc(sh.name)}</b> inspected at ${esc(PORTS[sh.port].name)}: ${res.deficiencies} deficienc${res.deficiencies===1?"y":"ies"}, no detention. ${money(res.cost)}.`, "warn");
  }
}

/* ==========================================================================
   CII
   ========================================================================= */
function updateCii(sh){
  const r = ciiRating(sh, year());
  sh.ciiRating = r.rating; sh.ciiRatio = r.ratio; sh.ciiAer = r.aer; sh.ciiReq = r.required;
}
function rolloverCii(){
  for(const sh of S.ships){
    updateCii(sh);
    if(sh.ciiRating === "D") sh.dStreak = (sh.dStreak||0)+1; else sh.dStreak = 0;
    if(sh.ciiRating === "E" || sh.dStreak >= 3) sh.capPlan = true;
    // A year's carbon record closes and a new one opens.
    sh.cii = { co2:0, nm:0, year:year() };
  }
}

/* ==========================================================================
   THE FIXTURE BOARD — spot, time charter, COA and day-rate work
   ========================================================================= */
/* Candidate trades for one ship. `relax` widens the acceptable ballast, which is
   how a genuinely awkward position produces bad options rather than none. */
function candidatesFor(sh, relax){
  const cls = shipCls(sh), out = [];
  const month = gDate().getUTCMonth();
  const tutorial = S.voyagesDone < 2;
  for(const r of ROUTE_POOL){
    if(!eligible(cls, r)) continue;
    const bal = seaRoute(sh.port, r.l);
    const ladNm = seaRoute(r.l, r.d).nm;
    // Ballast tolerance scales with the voyage itself: nobody ballasts 6,000
    // miles for a 1,000-mile cargo, but a VLCC returning to the Gulf empty does
    // exactly that every voyage. A flat cap strands the long-haul segments.
    const cap = clamp(ladNm*1.6, 1800, 9000) * relax;
    if(bal.nm > cap) continue;
    if(tutorial && (bal.nm > 700 || ladNm > 2000)) continue;
    if(r.nsr && !NSR_MONTHS[month]) continue;
    out.push({ r, bal:bal.nm, w: r.w * Math.exp(-bal.nm/Math.max(2200, ladNm*0.8)) });
  }
  return out;
}

/* Top a ship's board up to a full set of offers. Widens the search until it
   finds enough: an owner in a thin port is short of GOOD options, never short of
   a broker willing to quote her something. */
function topUpBoard(sh, target){
  const rnd = MKT.rnd, cls0 = shipCls(sh);
  const have = S.fixtures.filter(f=>f.forShip===sh.id);
  const want = target ?? Math.max(2, Math.round((3 + Math.floor(rnd()*3))*shoreFx("boardMult")));
  if(have.length >= want) return;
  const taken = new Set(have.map(f=>f.load+">"+f.disch+">"+f.cargo));
  let cand = [];
  for(const relax of [1, 2, 4, 999]){
    cand = candidatesFor(sh, relax);
    if(cand.length >= want - have.length) break;
  }
  if(!cand.length) return;
  const total = cand.reduce((a,c)=>a+c.w, 0);
  for(let k=0; k<want*9 && S.fixtures.filter(f=>f.forShip===sh.id).length<want; k++){
    let x = rnd()*total, pick = cand[0];
    for(const c of cand){ x -= c.w; if(x<=0){ pick=c; break; } }
    const key = pick.r.l+">"+pick.r.d+">"+pick.r.c;
    if(taken.has(key)) continue;
    taken.add(key);
    const fx = mkFixture(pick.r, sh, rnd, {});
    // No broker quotes a voyage that loses money before it sails. Keep one only
    // if she would otherwise have nothing at all to look at.
    const onBoard = S.fixtures.filter(f=>f.forShip===sh.id).length;
    if(onBoard >= 2){
      const e = voyageEstimate(sh, fx, cls0.designSpeed-1.5, MKT, estOpts(sh));
      if(!(e.tce > 0)) continue;
    }
    S.fixtures.push(fx);
  }
}

/* Charter-out and contract offers for one ship. */
function offersForShip(sh){
  const rnd = MKT.rnd, cls = shipCls(sh);
  S.tcOffers = (S.tcOffers||[]).filter(o=>o.forShip!==sh.id);
  S.dayOffers = (S.dayOffers||[]).filter(o=>o.forShip!==sh.id);
  if(has2("timecharter")){
    const durs = CFG.TC.durations.slice().sort(()=>rnd()-0.5).slice(0, 2 + (rnd()<0.5?1:0));
    for(const d of durs)
      S.tcOffers.push({ id:"t"+(S.nextId++), forShip:sh.id, kind:"tc", days:d,
        rate: Math.round(tcHire(sh.cls, MKT, d, sh)*(0.97+rnd()*0.06)),
        charterer: pickCharterer(rnd), port: sh.port });
  }
  if(has2("bareboat")){
    const yrs = [3,5,7][Math.floor(rnd()*3)];
    S.tcOffers.push({ id:"b"+(S.nextId++), forShip:sh.id, kind:"bb", days:yrs*365,
      rate: Math.round(bbHire(sh.cls, MKT)*(0.97+rnd()*0.06)),
      charterer: pickCharterer(rnd), port: sh.port });
  }
  if(cls.dayrateOnly){
    for(const c of DAYRATE_CONTRACTS){
      if(!c.cls.includes(sh.cls)) continue;
      if(c.ice && (cls.ice||0) < c.ice) continue;
      if(NORWAY_RESERVED.has(c.base) && !["nor","nis"].includes(sh.flag)) continue;
      if(seaRoute(sh.port, c.base).nm > 4000) continue;
      const days = Math.round(lerp(c.days[0], c.days[1], rnd()));
      S.dayOffers.push({ id:"d"+(S.nextId++), forShip:sh.id, kind:"dayrate", days,
        rate: Math.round((DAYRATE_BASE[sh.cls]||25000)*c.rate*(MKT.idx[cls.idx].v/100)*(0.96+rnd()*0.08)),
        name:c.name, base:c.base, war:c.war });
    }
  }
}

/* Called the instant a ship becomes free. Before this existed the board was only
   rebuilt on a timer, so a ship that discharged just after a refresh sat with an
   empty board — and paid OPEX for every day of it. */
function ensureBoard(sh){
  if(!sh || sh.dd || sh.voyage || sh.layup) return;
  if(sh.emp && sh.emp.type !== "spot") return;
  topUpBoard(sh);
  offersForShip(sh);
}

function refreshBoard(force){
  S.fixturesStamp = S.day;
  const idle = S.ships.filter(s => s.status === "idle" && !s.dd && !s.layup && (!s.emp || s.emp.type === "spot"));
  const idleIds = new Set(idle.map(s=>s.id));
  // Keep what the player may be part-way through reading; drop what has lapsed
  // or belongs to a ship no longer open.
  S.fixtures = (S.fixtures||[]).filter(f =>
    idleIds.has(f.forShip) && (S.day - (f.born ?? S.day)) < CFG.FIXTURE_MAX_AGE);
  S.tcOffers = (S.tcOffers||[]).filter(o=>idleIds.has(o.forShip));
  S.dayOffers = (S.dayOffers||[]).filter(o=>idleIds.has(o.forShip));
  for(const sh of idle) ensureBoard(sh);

  // COA offers are fleet-wide, not per ship.
  const rnd = MKT.rnd;
  S.coaOffers = [];
  if(has2("coa") && S.coas.length < 3){
    for(let i=0;i<2;i++){
      const pool = ROUTE_POOL.filter(r => S.ships.some(sh=>eligible(shipCls(sh), r)));
      if(!pool.length) break;
      const r = pool[Math.floor(rnd()*pool.length)];
      const lifts = CFG.COA.lifts[Math.floor(rnd()*CFG.COA.lifts.length)];
      const period = CFG.COA.periodDays[Math.floor(rnd()*CFG.COA.periodDays.length)];
      S.coaOffers.push({ id:"c"+(S.nextId++), kind:"coa", route:r, lifts, period,
        rate: (r.flat ?? r.rate) * (MKT.idx[routeIdx(r)].v/100) * CFG.COA.discount,
        charterer: pickCharterer(rnd) });
    }
  }
}
const CHARTERERS = ["Cargill","Bunge","Louis Dreyfus","Trafigura","Vitol","Glencore",
                    "Oldendorff","Klaveness","Mercuria","ADNOC Trading","Rio Tinto","Vale"];
function pickCharterer(rnd){ return CHARTERERS[Math.floor(rnd()*CHARTERERS.length)]; }
const has2 = (k)=> S.voyagesDone >= (CFG.UNLOCK2[k] ?? 0) || S.debug;

function mkFixture(r, sh, rnd, extra){
  const cls = shipCls(sh), cargo = CARGOES[r.c];
  const lp = PORTS[r.l], dp = PORTS[r.d];
  const jitter = (rnd()*2-1);
  const idx = routeIdx(r);
  const base = r.flat ?? r.rate;
  const rate = base * (MKT.idx[idx].v/100) * (1 + jitter*CFG.FIXTURE_NOISE) * shoreFx("freightMult");
  const intake = intakeFor(cls, cargo, lp, dp, robTot(sh));
  const qty = Math.round(intake.qty * (rnd() < 0.78 ? 1 : 0.72 + rnd()*0.2));
  const agreed = (qty/((cargo.load*lp.rateFactor)||1) + qty/((cargo.disch*dp.rateFactor)||1)) * (0.90 + rnd()*0.10);
  // Oil majors vet before they load, and they are most of the good wet business.
  const vetGate = r.kind === "wet" && rnd() < 0.6;
  return Object.assign({
    id:"f"+(S.nextId++), forShip: sh.id, kind:r.kind, born: S.day,
    load:r.l, disch:r.d, cargo:r.c, qty, rate,
    ws: r.ws ? Math.round((MKT.idx[idx].v)*(1+jitter*CFG.FIXTURE_NOISE)) : null,
    flat: r.flat ?? null,
    laytime: agreed + 1.0, demRate: Math.round(cls.dwt*0.30 + rnd()*cls.dwt*0.08),
    laydays: Math.round(3 + rnd()*9), terms:"FIOST", seg:idx,
    vetGate, major: vetGate ? CFG.VET.majors[Math.floor(rnd()*CFG.VET.majors.length)] : null,
    nsr: false, avoidCanals: null, guards: false,
  }, extra||{});
}

/* --- accepting the non-spot employment types ---------------------------- */
function takeTc(shipId, offerId){
  const sh = S.ships.find(s=>s.id===shipId), o = (S.tcOffers||[]).find(x=>x.id===offerId);
  if(!sh || !o) return;
  sh.emp = { type:o.kind, rate:o.rate, endDay:S.day+o.days, charterer:o.charterer, earned:0, offHire:0 };
  S.tcOffers = S.tcOffers.filter(x=>x.forShip!==shipId);
  hideSheet(); dirty();
  toast(`<b>${esc(sh.name)}</b> fixed to ${esc(o.charterer)} — ${o.kind==="bb"?"bareboat":"time charter"} ${Math.round(o.days/30)} months at ${money0(o.rate)}/day.`, "good");
}
function takeDayrate(shipId, offerId){
  const sh = S.ships.find(s=>s.id===shipId), o = (S.dayOffers||[]).find(x=>x.id===offerId);
  if(!sh || !o) return;
  sh.emp = { type:"dayrate", rate:o.rate, endDay:S.day+o.days, charterer:o.name, earned:0, offHire:0 };
  sh.port = o.base;
  S.dayOffers = S.dayOffers.filter(x=>x.forShip!==shipId);
  hideSheet(); dirty();
  toast(`<b>${esc(sh.name)}</b> on contract — ${esc(o.name)}, ${o.days} days at ${money0(o.rate)}/day.`, "good");
}
function takeCoa(offerId){
  const o = (S.coaOffers||[]).find(x=>x.id===offerId); if(!o) return;
  S.coas.push({ id:o.id, route:o.route, rate:o.rate, lifts:o.lifts, liftsDone:0,
                endDay:S.day+o.period, charterer:o.charterer, start:S.day });
  S.coaOffers = S.coaOffers.filter(x=>x.id!==offerId);
  hideSheet(); dirty();
  toast(`COA agreed with ${esc(o.charterer)} — ${o.lifts} cargoes in ${Math.round(o.period/30)} months.`, "good");
}
function closeCoa(c, quiet){
  const short = Math.max(0, c.lifts - c.liftsDone);
  S.coas = S.coas.filter(x=>x.id!==c.id);
  for(const sh of S.ships) if(sh.emp && sh.emp.coaId === c.id) sh.emp = { type:"spot" };
  if(short > 0){
    const pen = short * c.rate * 30000 * CFG.COA.penaltyPerLift / 1000;
    S.cash -= pen; S.ledger.penalties += pen;
    S.rep = clamp(S.rep - 0.05*short, 0, 1);
    if(!quiet) queueNote("COA failed to perform",
      `You committed to ${c.lifts} cargoes for ${esc(c.charterer)} and lifted ${c.liftsDone}. The shortfall costs ${money(pen)} and your name.`, "bad");
  } else if(!quiet){
    toast(`COA with ${esc(c.charterer)} completed in full.`, "good");
    S.rep = clamp(S.rep + 0.04, 0, 1);
  }
}
function assignCoa(shipId, coaId){
  const sh = S.ships.find(s=>s.id===shipId); if(!sh) return;
  sh.emp = { type:"coa", coaId };
  hideSheet(); dirty();
  toast(`<b>${esc(sh.name)}</b> assigned to the COA programme.`, "good");
}

/* ==========================================================================
   S&P, NEWBUILDING AND DEMOLITION
   ========================================================================= */
function refreshSnp(force){
  S.snpStamp = S.day;
  const rnd = MKT.rnd;
  const pool = Object.keys(CLASSES).filter(k=>segUnlocked(CLASSES[k].seg));
  const out = [];
  for(let i=0;i<CFG.SNP.offers;i++){
    const cls = pool[Math.floor(rnd()*pool.length)];
    const age = Math.round(lerp(3, 22, Math.pow(rnd(), 0.8)));
    const cond = clamp(1 - Math.max(0, age-8)*0.012 + (rnd()-0.5)*0.16, 0.5, 1);
    const flag = pickFlag(rnd);
    const csoc = Object.keys(CLASS_SOC)[Math.floor(rnd()*Object.keys(CLASS_SOC).length)];
    out.push({ id:"s"+(S.nextId++), cls, age, cond, flag, classSoc:csoc,
               scrubber: rnd()<0.22, eco: age<8 && rnd()<0.4,
               ask: askPrice(cls, age, MKT, cond),
               port: plausiblePort(CLASSES[cls].seg, rnd) });
  }
  S.snp = out;
}
/* A ship lies where her trade lies. An AHTS idling at a crude terminal in Egypt
   is the kind of detail that tells a reader the model is not paying attention. */
function plausiblePort(seg, rnd){
  const tag = { tanker:"oil", container:"box", gas:"lng", offshore:"osv", aqua:"aqua" }[seg];
  let pool = Object.keys(PORTS).filter(id=>!PORTS[id].bunkerOnly && (!tag || PORTS[id][tag]));
  if(!pool.length) pool = Object.keys(PORTS).filter(id=>!PORTS[id].bunkerOnly && PORTS[id].liq > 0.5);
  return pool[Math.floor(rnd()*pool.length)];
}
function segUnlocked(seg){
  if(seg === "dry") return true;
  if(seg === "tanker") return has2("tanker");
  if(seg === "container") return has2("container");
  return has2("special");
}
function buyShip(offerId, ltv){
  const o = S.snp.find(x=>x.id===offerId); if(!o) return;
  const fees = o.ask*(CFG.SNP.brokerage + CFG.SNP.inspection);
  const debt = Math.min(ltv||0, CFG.FIN.maxLtv) * o.ask;
  const cashNeed = o.ask - debt + fees;
  if(cashNeed > S.cash){ toast("Not enough cash for the deposit and fees.", "bad"); return; }
  S.cash -= cashNeed; S.ledger.snp += o.ask; S.ledger.opex += fees;
  const sh = mkShip(S, o.cls, vesselName(o.cls), year()-o.age, o.port);
  sh.hull = o.cond; sh.flag = o.flag; sh.classSoc = o.classSoc;
  sh.flagMult = flagOpexMult(sh.flag);
  sh.scrubber = o.scrubber; sh.eco = o.eco;
  S.ships.push(sh);
  if(debt > 0) bankOriginate({ kind:"mortgage", shipId:sh.id, principal:debt,
                               rate:loanRate(), termYears:CFG.FIN.termYears });
  S.snp = S.snp.filter(x=>x.id!==offerId);
  hideSheet(); dirty();
  toast(`Bought <b>${esc(sh.name)}</b> — ${CLASSES[o.cls].name}, ${o.age} years, for ${money(o.ask)}.`, "good");
}
/* What this company pays for money: a base rate, plus a margin set by the
   credit rating, plus whatever the finance department is worth, plus a product
   spread — unsecured money costs more than a ship mortgage because there is no
   ship behind it. */
/* Roughly the world fleet's registry split. Picking uniformly across the seven
   registries put a Norwegian NOR ship on the sale-and-purchase market about as
   often as a Panamanian one, which is upside down: NOR is a few hundred ships
   on Norwegian terms, Panama and Liberia are tens of thousands. */
const FLAG_WEIGHTS = { panama:0.30, liberia:0.26, marshall:0.24, malta:0.10,
                       singapore:0.07, nis:0.025, nor:0.005 };
function pickFlag(rnd){
  let r = rnd();
  for(const [k,w] of Object.entries(FLAG_WEIGHTS)){ r -= w; if(r <= 0) return k; }
  return "marshall";
}

function loanRate(spread){
  return Math.max(0.02, CFG.FIN.rateBase + (CFG.FIN.marginByRating[S.rating] ?? 0.033)
                      + shoreFx("loanMarginAdj", 0) + (spread || 0));
}
let _nameN = 0;
const NAME_A = ["Kription","Nordic","Arctic","Atlantic","Bergen","Fjord","Polar","Vestland",
                "Trondheim","Haugesund","Meridian","Cardinal","Baltic","Aurora","Solstice"];
const NAME_B = ["Trader","Voyager","Pioneer","Endeavour","Spirit","Enterprise","Mariner",
                "Navigator","Explorer","Challenger","Guardian","Provider","Sovereign"];
function vesselName(){
  const rnd = MKT ? MKT.rnd : Math.random;
  return NAME_A[Math.floor(rnd()*NAME_A.length)]+" "+NAME_B[Math.floor(rnd()*NAME_B.length)];
}
function sellShip(shipId){
  const sh = S.ships.find(s=>s.id===shipId); if(!sh) return;
  if(sh.voyage){ toast("She is on a voyage. Sell her when she is free.", "bad"); return; }
  if(sh.lease){ toast("She belongs to the lessor — she is not yours to sell.", "bad"); return; }
  const px = bidPrice(sh.cls, shipAge(sh), MKT, sh.hull);
  const fee = px*CFG.SNP.brokerage;
  // The mortgagee is paid out of the proceeds before anything reaches the owner.
  const debt = bankCloseForShip(shipId);
  const proceeds = px - fee - debt;
  S.cash += proceeds; S.ledger.snp -= px;
  releaseFromService(sh);
  S.ships = S.ships.filter(s=>s.id!==shipId);
  hideSheet(); dirty();
  toast(`Sold <b>${esc(sh.name)}</b> for ${money(px)}${debt>0?` — ${money(debt)} repaid the bank`:""}. Net ${money(proceeds)}.`, proceeds>0?"good":"warn");
}
function scrapShip(shipId){
  const sh = S.ships.find(s=>s.id===shipId); if(!sh) return;
  if(sh.voyage){ toast("She is on a voyage.", "bad"); return; }
  if(sh.lease){ toast("She belongs to the lessor — she is not yours to scrap.", "bad"); return; }
  const px = scrapValue(sh.cls, MKT);
  const debt = bankCloseForShip(shipId);
  S.cash += px - debt; S.ledger.scrap += px;
  releaseFromService(sh);
  S.ships = S.ships.filter(s=>s.id!==shipId);
  hideSheet(); dirty();
  toast(`<b>${esc(sh.name)}</b> sold for demolition — ${CLASSES[sh.cls].ldt.toLocaleString()} ldt for ${money(px)}.`, "warn");
}
function orderNewbuild(clsId, opts){
  const cls = CLASSES[clsId];
  let price = cls.nb;
  if(opts.eco) price *= 1 + CFG.SNP.nbPremiumEco;
  if(opts.dualFuel) price *= 1 + CFG.SNP.dualFuelPremium[opts.dualFuel];
  const dep = price*CFG.SNP.nbDeposit;
  if(dep > S.cash){ toast("Not enough cash for the yard deposit.", "bad"); return; }
  S.cash -= dep; S.ledger.snp += dep;
  const lag = Math.round(lerp(CFG.SNP.nbLagDays[0], CFG.SNP.nbLagDays[1], MKT.rnd()));
  S.orders.push({ id:"n"+(S.nextId++), cls:clsId, price, paid:dep,
                  deliveryDay: Math.round(S.day+lag), eco:!!opts.eco,
                  dualFuel:opts.dualFuel||null, scrubber:!!opts.scrubber });
  hideSheet(); dirty();
  toast(`Ordered a ${CLASSES[clsId].name} for ${money(price)}. Delivery ${dateFull(S.day+lag)}.`, "good");
}
function deliverNewbuild(o, quiet){
  const bal = o.price - o.paid;
  S.orders = S.orders.filter(x=>x.id!==o.id);
  if(bal > S.cash){
    // You signed for it; the yard will not wait. Sell it on at a loss.
    const recover = o.price*0.86;
    S.cash += recover - o.paid;
    if(!quiet) queueNote("Newbuild resold", `You could not fund the delivery instalment on the ${CLASSES[o.cls].name}. The berth was resold and you recovered ${money(recover)} of ${money(o.price)}.`, "bad");
    return;
  }
  S.cash -= bal; S.ledger.snp += bal;
  const sh = mkShip(S, o.cls, vesselName(o.cls), year(), "singapore");
  sh.hull = 1; sh.eco = o.eco; sh.dualFuel = o.dualFuel; sh.scrubber = o.scrubber;
  sh.flag = "nis"; sh.classSoc = "dnv"; sh.flagMult = flagOpexMult("nis");
  sh.lastSS = S.day; sh.lastIS = S.day;
  S.ships.push(sh);
  if(!quiet) queueNote("Newbuild delivered", `<b>${esc(sh.name)}</b> delivered from the yard at Singapore — a brand new ${CLASSES[o.cls].name}${o.eco?", eco design":""}${o.dualFuel?", "+o.dualFuel+" dual fuel":""}.`, "good");
}
function fitScrubber(shipId){
  const sh = S.ships.find(s=>s.id===shipId); if(!sh || sh.voyage) return;
  const cost = CLASSES[sh.cls].gt*CFG.SNP.scrubberCost;
  if(cost > S.cash){ toast("Not enough cash.", "bad"); return; }
  S.cash -= cost; S.ledger.snp += cost;
  sh.scrubber = true; sh.dd = { type:"RETRO", days:CFG.SNP.scrubberDays, left:CFG.SNP.scrubberDays, cost:0, paid:true };
  sh.status = "drydock"; hideSheet(); dirty();
  toast(`Scrubber fitted to <b>${esc(sh.name)}</b> for ${money(cost)}. She can burn HSFO now.`, "good");
}
function fitEfficiency(shipId){
  const sh = S.ships.find(s=>s.id===shipId); if(!sh || sh.voyage) return;
  const cost = CLASSES[sh.cls].gt*CFG.CII.retrofitPerGt;
  if(cost > S.cash){ toast("Not enough cash.", "bad"); return; }
  S.cash -= cost; S.ledger.snp += cost;
  sh.retrofit = true; sh.dd = { type:"RETRO", days:CFG.CII.retrofitDays, left:CFG.CII.retrofitDays, cost:0, paid:true };
  sh.status = "drydock"; hideSheet(); dirty();
  toast(`Efficiency package fitted to <b>${esc(sh.name)}</b> — ${pc(CFG.CII.retrofitGain)} off consumption.`, "good");
}
function changeFlag(shipId, flagId){
  const sh = S.ships.find(s=>s.id===shipId); if(!sh) return;
  const cost = CLASSES[sh.cls].gt*1.2 + 45000;
  if(cost > S.cash){ toast("Not enough cash for the re-registration.", "bad"); return; }
  S.cash -= cost; S.ledger.opex += cost;
  sh.flag = flagId; sh.flagMult = flagOpexMult(flagId);
  hideSheet(); dirty();
  toast(`<b>${esc(sh.name)}</b> reflagged to ${FLAGS[flagId].name} for ${money(cost)}.`, "good");
}

/* ==========================================================================
   DEBT, COVENANTS AND RESTRUCTURING
   ========================================================================= */
function fleetValue(){ return S.ships.reduce((a,s)=>a+assetValue(s.cls, shipAge(s), MKT),0); }
/* Every facility in the book — ship mortgages, the revolver, unsecured money —
   plus anything overdue. Leased-in tonnage is not debt: the ship is not yours,
   and the hire is an operating cost. */
function totalDebt(){ return (S.loans||[]).reduce((a,l)=>a+l.principal+(l.arrears||0),0); }
function equity(){ return S.cash + fleetValue() - totalDebt(); }
function checkCovenants(quiet){
  const d = totalDebt(); if(d <= 0){ S.cov = null; return; }
  const ltv = d/Math.max(1, fleetValue());
  const liq = S.cash/d;
  const dflt = bankInDefault();
  const breach = ltv > CFG.FIN.covLtv || liq < CFG.FIN.covMinLiquidity || dflt;
  if(breach && !S.cov){
    S.cov = { day:S.day, until:S.day+CFG.FIN.cureDays, ltv, liq, dflt };
    if(!quiet) queueNote("Covenant breach", dflt
      ? `Your lender has written. Instalments have stood unpaid for more than ${CFG.BANK.graceDays} days, which is an event of default under the loan agreement. Clear the arrears within ${CFG.FIN.cureDays} days or the whole book is repayable on demand.`
      : `Your lender has written. Loan-to-value stands at ${pc(ltv)} against an 80% ceiling, and cash is ${pc(liq)} of debt against a 6% minimum undertaking. You have ${CFG.FIN.cureDays} days to cure it — sell tonnage, or raise cash.`, "bad");
  } else if(!breach && S.cov){
    S.cov = null;
    if(!quiet) toast("Covenant cured. The bank has stood down.", "good");
  } else if(breach && S.cov && S.day > S.cov.until){
    // Enforcement sets the rating to D itself, and it must stick — a wrecked
    // rating is the consequence. Recomputing it here would hand it straight
    // back, since the fleet comes out of a restructuring debt free.
    restructure(quiet);
    return;
  }
  S.rating = ltv < 0.45 && liq > 0.15 ? "A" : ltv < 0.6 ? "B" : ltv < 0.75 ? "C" : "D";
}
/* Enforcement. The bank takes the fleet bar one ship; the run continues with a
   wrecked credit rating rather than ending. */
function restructure(quiet){
  // You keep the ship with the least debt against her value — and she must be
  // one you actually own; a lessor simply takes their vessel back.
  const keep = S.ships.filter(s=>!s.lease).sort((a,b)=>
    (a.debt?a.debt.principal:0)/assetValue(a.cls,shipAge(a),MKT) -
    (b.debt?b.debt.principal:0)/assetValue(b.cls,shipAge(b),MKT))[0];
  const lost = S.ships.filter(s=>s!==keep);
  for(const s of lost) releaseFromService(s);
  S.ships = keep ? [keep] : [];
  S.loans = [];
  if(keep){ keep.debt = null; keep.lease = null; keep.voyage = null; keep.status = "idle"; keep.emp = { type:"spot" }; }
  S.cov = null; S.rating = "D"; S.restructured = (S.restructured||0)+1;
  S.rep = clamp(S.rep-0.25, 0, 1);
  S.cash = Math.max(S.cash, 250000);
  S.services = []; S.coas = []; S.ffa = []; S.swaps = []; S.orders = [];
  refreshBoard(true);
  if(!quiet) queueNote("Enforcement",
    `The cure period expired. Your lender has taken ${lost.length} vessel${lost.length===1?"":"s"} and released the mortgages.
     You keep <b>${keep?esc(keep.name):"nothing"}</b>, debt free, and a credit rating of D — higher margins, less leverage, and some charterers will not touch you.
     The run continues. Rebuilding from one ship is how most of this industry started.`, "bad");
}

/* ==========================================================================
   TAX — tonnage tax regimes against a profits tax. In a boom this is the
   single most valuable decision on the Company screen.
   ========================================================================= */
function settleTax(quiet){
  const L = S.ledger;
  const grossProfit = (L.freight + L.hire + L.demurrage + L.liner)
                    - (L.bunkers + L.portDA + L.tolls + L.war + L.carbon + L.opex
                       + L.interest + L.survey + L.psc + L.penalties);
  const profit = grossProfit - (S.yearBook.profit||0);
  let tax = 0, basis = "";
  const tonnageShips = S.ships.filter(s=>FLAGS[s.flag].tonnageTax > 0);
  const allTonnage = S.ships.length > 0 && tonnageShips.length === S.ships.length;
  if(allTonnage){
    tax = S.ships.reduce((a,s)=>a + CLASSES[s.cls].gt*FLAGS[s.flag].tonnageTax*365, 0);
    basis = "tonnage tax";
  } else {
    tax = Math.max(0, profit) * CFG.TAX.corp;
    basis = "profits tax at "+pc(CFG.TAX.corp);
  }
  S.cash -= tax; S.ledger.tax += tax;
  S.yearBook = { start:S.day, profit:grossProfit };
  if(!quiet && (tax > 1000 || profit > 0))
    queueNote("Tax year closed",
      `Result for the year ${money(profit)}. Assessed on ${basis}: ${money(tax)}.
       ${allTonnage ? "Every ship sits in a tonnage-tax regime, so the charge is on tonnage rather than profit." :
       "Not all your ships are in a tonnage-tax regime, so the whole group is assessed on profit. Reflagging to NIS, Malta or Singapore would change that — at the cost of a dearer manning bill every day."}`,
      tax > profit*0.15 ? "warn" : "good", true);
}

/* ==========================================================================
   DERIVATIVES
   ========================================================================= */
function openFfa(idxKey, lots, tenor, side){
  const px = ffaPrice(idxKey, MKT, tenor);
  const notional = ffaNotional(idxKey, lots)*px;
  const margin = notional*CFG.FFA.margin, fee = notional*CFG.FFA.fee;
  if(margin+fee > S.cash){ toast("Not enough cash for the margin.", "bad"); return; }
  S.cash -= margin+fee; S.ledger.derivatives += fee;
  S.ffa.push({ id:"F"+(S.nextId++), idx:idxKey, lots, side, entry:px,
               endDay:Math.round(S.day+tenor), margin, tenor });
  hideSheet(); dirty();
  toast(`${side>0?"Bought":"Sold"} ${lots} lot${lots===1?"":"s"} ${INDEX_META[idxKey].short} at ${px} for ${tenor} days.`, "good");
}
function ffaMtm(f){
  return (MKT.idx[f.idx].v - f.entry) * f.side * ffaNotional(f.idx, f.lots);
}
function settleFfa(f, quiet){
  const pnl = ffaMtm(f);
  S.cash += f.margin + pnl; S.ledger.derivatives -= pnl;
  S.ffa = S.ffa.filter(x=>x.id!==f.id);
  if(!quiet) toast(`FFA settled: ${INDEX_META[f.idx].short} ${f.entry} → ${MKT.idx[f.idx].v.toFixed(1)}, ${money(pnl, pnl>0)}.`, pnl>=0?"good":"bad");
}
function openSwap(lots, tenor, side){
  const px = bunkerFwd(MKT, tenor);
  const notional = lots*1000*px;
  const margin = notional*CFG.BUNKER_SWAP.margin, fee = notional*CFG.BUNKER_SWAP.fee;
  if(margin+fee > S.cash){ toast("Not enough cash for the margin.", "bad"); return; }
  S.cash -= margin+fee; S.ledger.derivatives += fee;
  S.swaps.push({ id:"W"+(S.nextId++), lots, side, entry:px, endDay:Math.round(S.day+tenor), margin, tenor });
  hideSheet(); dirty();
  toast(`${side>0?"Bought":"Sold"} ${lots}kt VLSFO forward at $${px}/mt.`, "good");
}
function swapMtm(w){
  return (CFG.FUEL.vlsfo.base*MKT.oil - w.entry) * w.side * w.lots*1000;
}
function settleSwap(w, quiet){
  const pnl = swapMtm(w);
  S.cash += w.margin + pnl; S.ledger.derivatives -= pnl;
  S.swaps = S.swaps.filter(x=>x.id!==w.id);
  if(!quiet) toast(`Bunker swap settled: ${money(pnl, pnl>0)}.`, pnl>=0?"good":"bad");
}

/* ==========================================================================
   LINER SERVICES
   ========================================================================= */
function createService(laneId, clsId, speed, freq, buffer, shipIds, contractShare){
  const lane = LANES.find(l=>l.id===laneId);
  const need = linerPlan(lane, clsId, speed, freq, buffer, MKT, gDate().getUTCMonth(), { drought:S.drought }).ships;
  if(shipIds.length < need){ toast(`A ${freq}-day frequency at ${speed} knots needs ${need} ships. You have assigned ${shipIds.length}.`, "bad"); return; }
  const svc = { id:"L"+(S.nextId++), lane:laneId, cls:clsId, speed, freq, buffer,
                ships:shipIds.slice(), contractShare, reliability:0.82,
                start:S.day, rev:0, cost:0, slotSales:0, teu:0 };
  for(const id of shipIds){ const sh = S.ships.find(s=>s.id===id); if(sh) sh.emp = { type:"liner", svcId:svc.id }; }
  S.services.push(svc);
  hideSheet(); dirty();
  toast(`Service <b>${lane.short}</b> launched — ${shipIds.length} ships, ${freq}-day frequency at ${speed} knots.`, "good");
}
function accrueService(svc, dt){
  const lane = LANES.find(l=>l.id===svc.lane);
  const ships = svc.ships.map(id=>S.ships.find(s=>s.id===id)).filter(Boolean);
  const active = ships.filter(s=>!s.dd && s.status !== "detained").length;
  if(!ships.length){ S.services = S.services.filter(x=>x.id!==svc.id); return; }
  const plan = linerPlan(lane, svc.cls, svc.speed, svc.freq, svc.buffer, MKT,
                         gDate().getUTCMonth(), { drought:S.drought });
  svc.plan = plan;
  // Ships in drydock cannot maintain the advertised frequency, so reliability
  // decays and revenue with it. Buffer ships are what protect you.
  const cover = clamp((active + svc.buffer) / Math.max(1, plan.ships), 0, 1.1);
  const target = clamp(0.55 + 0.42*cover + (svc.buffer*0.03), 0, 0.97);
  svc.reliability = svc.reliability + (target - svc.reliability)*(1-Math.pow(CFG.LINER.reliabilityDecay, dt));
  const relFactor = 0.72 + 0.28*svc.reliability;
  const contractMix = 1 - svc.contractShare*(1-CFG.LINER.contractDiscount);

  const rev = plan.revPerDay*dt*relFactor*contractMix*cover;
  const cost = plan.costPerDay*dt;
  svc.rev += rev; svc.cost += cost; svc.teu += plan.teuMoved*dt/svc.freq;
  // costPerDay already carries the string's OPEX, and accrueDaily skips these
  // ships for exactly that reason. (This used to charge per-ship OPEX and then
  // refund it — but the refund was struck on opexDay while the charge was
  // opexDayFull, so the management-fee share carved out in §SHORE came back to
  // the player on every liner vessel. Not charging it at all is both simpler
  // and correct.)
  S.cash += rev - cost; S.ledger.liner += rev - cost;
  for(const s of ships){ s.cii.co2 += plan.perShipBurn*CFG.FUEL.vlsfo.co2*dt*0.9;
                         s.cii.nm += svc.speed*24*dt*0.78; }
}
function closeService(svcId){
  const svc = S.services.find(s=>s.id===svcId); if(!svc) return;
  for(const id of svc.ships){ const sh = S.ships.find(s=>s.id===id); if(sh) sh.emp = { type:"spot" }; }
  S.services = S.services.filter(s=>s.id!==svcId);
  hideSheet(); dirty();
  toast("Service withdrawn. The ships are open again.", "warn");
}
function releaseFromService(sh){
  for(const svc of S.services) svc.ships = svc.ships.filter(id=>id!==sh.id);
  S.services = S.services.filter(s=>s.ships.length>0);
}

/* ==========================================================================
   EVENTS — a decision with a trade-off, never a silent tax.
   ========================================================================= */
function rollEvents(dt){
  if(S.day - S.eventStamp < CFG.EVENTS.minGapDays) return;
  const n = S.ships.length; if(!n) return;
  const lambda = CFG.EVENTS.baseRatePerShipYear * n / 365 * dt;
  if(MKT.rnd() > lambda) return;
  const sh = S.ships[Math.floor(MKT.rnd()*n)];
  const ev = pickEvent(sh);
  if(!ev) return;
  S.eventStamp = S.day;
  if(ev.psc){ maybePsc(sh, false); return; }
  S.events.push({ evId:ev.id, shipId:sh.id, day:S.day, wall:Date.now(), id:"E"+(S.nextId++) });
  autoPause(`${sh.name} — ${ev.title.toLowerCase()}`);
  dirty();
}
function pickEvent(sh){
  const v = sh.voyage;
  const atSea = v && (v.phase === "ballast" || v.phase === "laden");
  const inPort = v && (v.phase === "loading" || v.phase === "discharging");
  const ok = EVENTS.filter(e=>{
    if(e.needs === "atsea" && !atSea) return false;
    if(e.needs === "port" && !inPort) return false;
    if(e.needs === "discharging" && !(v && v.phase === "discharging")) return false;
    if(e.needs === "laden" && !(v && v.phase === "laden")) return false;
    if(e.needs === "bunkered" && !(sh.rob && robTot(sh) > 100)) return false;
    if(e.needs === "warzone" && !(v && v.plan.warZones && v.plan.warZones.length)) return false;
    return true;
  });
  if(!ok.length) return null;
  const wOf = (e)=> e.w * (e.id === "crewcrisis" ? shoreFx("crewCrisisMult")
                        : e.id === "breakdown" ? shoreFx("breakdownMult") : 1);
  const tot = ok.reduce((a,e)=>a+wOf(e),0);
  let x = MKT.rnd()*tot;
  for(const e of ok){ x -= wOf(e); if(x<=0) return e; }
  return ok[0];
}
function eventCtx(q){
  const sh = S.ships.find(s=>s.id===q.shipId);
  const v = sh && sh.voyage;
  return { ship: sh ? sh.name : "A vessel", sh,
           port: v ? PORTS[v.phase === "discharging" ? v.fx.disch : v.fx.load].name : PORTS[sh?sh.port:"rotterdam"].name,
           where: v ? `on passage to ${PORTS[v.phase==="ballast"?v.fx.load:v.fx.disch].name}` : "in port" };
}
function resolveEvent(qid, optIdx){
  const q = S.events.find(e=>e.id===qid); if(!q) return;
  const ev = EVENTS.find(e=>e.id===q.evId);
  const sh = S.ships.find(s=>s.id===q.shipId);
  S.events = S.events.filter(e=>e.id!==qid);
  if(!ev || !sh){ hideSheet(); dirty(); return; }
  const opt = ev.opts[optIdx]; if(!opt){ hideSheet(); dirty(); return; }
  let fx = opt.fx(eventCtx(q));
  // A gamble resolves now, and the branch carries its own effects.
  if(fx.gamble !== undefined){
    const bad = MKT.rnd() < fx.gamble;
    fx = Object.assign({}, fx, bad ? fx.bad : fx.good);
  }
  applyEventFx(sh, fx);
  hideSheet();
  toast(`<b>${esc(sh.name)}</b> — ${esc(fx.msg||"resolved")}`, fx.cash < 0 ? "warn" : "good");
  dirty();
}
function applyEventFx(sh, fx){
  const v = sh.voyage;
  const rnd = MKT.rnd;
  const roll = (b)=> Array.isArray(b) ? lerp(b[0], b[1], rnd()) : b;
  if(fx.cash) { S.cash += fx.cash; if(fx.cash<0) S.ledger.opex -= fx.cash; }
  if(fx.claim){ const c = roll(fx.claim); S.cash += c; }
  if(fx.hull)  sh.hull = clamp(sh.hull + fx.hull, 0.25, 1);
  if(fx.rep)   S.rep = clamp(S.rep + fx.rep, 0, 1);
  if(fx.pscBump) sh.pscBump = (sh.pscBump||0) + fx.pscBump;
  if(fx.speedCap) sh.speedCap = fx.speedCap;
  if(fx.portRateMult) sh.portRateMult = fx.portRateMult;
  if(fx.bankFlag) S.rating = "D";
  if(v){
    if(fx.delay) v.act.extra = (v.act.extra||0) + roll(fx.delay);
    if(fx.demurrageDays) v.bonus = (v.bonus||0) + roll(fx.demurrageDays)*v.plan.demRate;
    if(fx.extraBunkerMt){ const mt = roll(fx.extraBunkerMt);
      burnFuel(sh, mt, false, PORTS[sh.port], !!v.plan.hireMode); }
    if(fx.cashPctFreight) v.freightAdj = (v.freightAdj||1) + fx.cashPctFreight;
    if(fx.recoverPct) v.recoverPct = fx.recoverPct;
    if(fx.reroute){ v.plan = voyageEstimate(sh, Object.assign({}, v.fx, { avoidCanals:["suez"] }), v.speed, MKT, estOpts(sh)); }
    if(fx.msg) v.act.notes.push(fx.msg);
  }
}
/* An unanswered decision defaults to the first, most conservative option after
   three days, so a large fleet never stalls waiting on the player. */
function autoResolveStale(){
  for(const q of S.events.slice()){
    if(q.wall === undefined) q.wall = Date.now();
    // Both clocks must run out: three game days AND ten real seconds. Without the
    // second test, high time compression would resolve decisions before the
    // player could read them.
    if(S.day - q.day > 3 && Date.now() - q.wall > 10000){
      const ev = EVENTS.find(e=>e.id===q.evId);
      if(ev && ev.opts) resolveEvent(q.id, 0);
      else S.events = S.events.filter(e=>e.id!==q.id);
    }
  }
}

/* A note the player must see, but which must not stop a 30-ship fleet. */
const noteQueue = [];
function queueNote(title, body, kind, noPause){
  noteQueue.push({ title, body, kind });
  // Informational notes (the tax year closing) let the clock run; anything that
  // needs a response stops it.
  if(!noPause) autoPause(title);
  if(!sheetOpen) flushNote();
}
function flushNote(){
  const n = noteQueue.shift(); if(!n) return;
  showSheet(esc(n.title), null, `<div class="card" style="margin:0"><div class="sm">${n.body}</div></div>`,
    `<button class="btn ${n.kind==="bad"?"dang":"pri"}" onclick="hideSheet();flushNote()">Understood</button>`);
}

/* ==========================================================================
   OFFLINE
   ========================================================================= */
function applyOffline(){
  const wall = Date.now() - (S.lastWall || Date.now());
  if(wall < 30000) return null;
  const wanted = (wall/1000)/CFG.SEC_PER_DAY;
  const days = Math.min(wanted, CFG.OFFLINE_CAP_DAYS);
  if(days < 0.5) return null;
  const cash0 = S.cash, done0 = S.voyagesDone, len0 = S.log.length;
  simDays(days, true);
  return { days, capped: wanted > CFG.OFFLINE_CAP_DAYS, wantedDays: wanted,
           cashDelta: S.cash-cash0, voyages: S.log.slice(0, S.log.length-len0),
           completed: S.voyagesDone-done0 };
}

/* ==========================================================================
   INSOLVENCY — only reachable with no tonnage left to sell.
   ========================================================================= */
function onInsolvent(){
  if(totalDebt() > 0){ checkCovenants(false); if(S.cash < 0){ S.cash = 0; restructure(false); } return; }
  if(S.ships.length > 1){ S.cash = 0; restructure(false); return; }
  S.bust = true; S.paused = true;
  showSheet("Out of cash", "The run is over.",
    `<div class="card" style="margin:0 0 10px">
      ${kv("Days survived", Math.round(S.day))}
      ${kv("Voyages completed", S.voyagesDone)}
      ${kv("Peak fleet", S.peakFleet||S.ships.length)}
      ${kv("Best voyage TCE", money(Math.max(0,...S.log.map(l=>l.tce)))+"/day")}
     </div>
     <div class="card" style="margin:0"><div class="sm">One ship, no debt left to restructure and no cash to run her. Daily OPEX is charged whether she works or not, and that is what finished it.</div></div>`,
    `<button class="btn dang" onclick="hardReset()">Start a new run</button>`);
}
/* ############################################################################
   §UI II — Fleet, Charter, Market, Yard and Company across every phase.
   Rendering only. Progressive disclosure is the rule: one line on the card, the
   whole calculation one tap down.
   ######################################################################### */

let charterShip = null, fxSpeed = {}, charterTab = "spot", yardTab = "buy";

function tabAlert(id){
  if(id === "charter") return S.ships.some(s=>s.status==="idle" && (!s.emp||s.emp.type==="spot"))
                           && (S.fixtures.length + (S.tcOffers||[]).length + (S.dayOffers||[]).length) > 0;
  if(id === "fleet")   return S.events.length > 0 || S.ships.some(s=>surveySoon(s));
  if(id === "company") return !!S.cov;
  if(id === "office")  return SHORE.noDpa() || (S.office && S.office.mode === "inhouse"
                              && shoreHealth().worst < 0.5);
  return false;
}
function surveySoon(sh){
  if(!has("survey") || sh.dd) return false;
  const nx = nextSurvey(sh);
  return nx.due - S.day < 45;
}

/* --- small shared bits --------------------------------------------------- */
const CII_CLS = { A:"on", B:"on", C:"", D:"warn", E:"bad" };
function ciiPill(sh){
  if(!has("cii")) return "";
  return `<span class="pill ${CII_CLS[sh.ciiRating]||""}">CII ${sh.ciiRating}</span>`;
}
function empLabel(sh){
  const e = sh.emp || { type:"spot" };
  if(sh.layup) return sh.layup.state === "laid" ? "Laid up"
    : sh.layup.state === "going" ? "Going into lay-up" : "Coming out of lay-up";
  if(e.type === "tc")      return `TC to ${e.charterer} · ${money0(e.rate)}/d`;
  if(e.type === "bb")      return `Bareboat to ${e.charterer} · ${money0(e.rate)}/d`;
  if(e.type === "dayrate") return `${e.charterer} · ${money0(e.rate)}/d`;
  if(e.type === "coa")     return `COA programme`;
  if(e.type === "liner"){
    const svc = S.services.find(s=>s.id===e.svcId);
    return svc ? `Service ${LANES.find(l=>l.id===svc.lane).short}` : "Liner service";
  }
  return "Open — spot";
}

/* ==========================================================================
   FLEET
   ========================================================================= */
function vFleet(){
  let h = "";
  S.peakFleet = Math.max(S.peakFleet||0, S.ships.length);

  if(S.events.length) h += eventStrip();
