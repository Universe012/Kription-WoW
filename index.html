}

/* Which constraint actually caps the stem — deadweight, draft or hold cubic. */
function intakeLimit(cls, cargo, lp, dp, rob){
  const constants = cls.dwt*0.022;
  const dwtAvail = cls.dwt - constants - Math.max(rob, cls.fuelCap*0.12);
  const lim = (port)=> cls.dwt - (cls.draft - Math.min(port.maxDraft, cls.draft))*100*cls.tpc;
  const draftLim = Math.min(lim(lp), lim(dp));
  const cubeLim = cls.grainCubic/cargo.sf;
  const m = Math.min(dwtAvail, draftLim, cubeLim);
  if(m === cubeLim) return "Hold cubic — light cargo";
  if(m === draftLim) return `Draft at ${esc(draftLim===lim(lp)?lp.name:dp.name)}`;
  return "Deadweight";
}

function doFix(shipId, fxId, sp){
  const sh = S.ships.find(s=>s.id===shipId);
  const f  = S.fixtures.find(x=>x.id===fxId);
  if(!sh || !f) return;
  const cls = shipCls(sh);
  const speed = sp ?? fxSpeed[fxId] ?? (cls.designSpeed - 1.5);
  const r = fixVoyage(sh, f, speed);
  if(!r.ok){ toast(r.why, "bad"); return; }
  hideSheet();
  S.tab = "fleet";
  toast(`<b>Fixed.</b> ${esc(sh.name)} — ${esc(r.est.loadName)} → ${esc(r.est.dischName)}`, "good");
  if(S.voyagesDone === 0)
    coach("sailing", "She's on her way", "The voyage runs in real time — about five seconds a day. Tap the vessel card any time to see where she is and what the voyage is earning.");
  onUnlockCheck();
  dirty();
}
/* ==========================================================================
   VOYAGE RESULT — the payoff moment. TCE in large type, breakdown one tap away.
   ========================================================================= */
function onVoyageDone(e, sh){
  const bigMoment = S.voyagesDone <= 2 || Math.abs(e.tce) > 40000;
  if(bigMoment) sheetResult(e);          // the sheet says it all; don't stack a toast on it
  else toast(`<b>${esc(sh.name)}</b> discharged ${esc(e.dischName)} · ${money(e.gvp,true)} · TCE ${money(e.tce)}/d`,
             e.gvp>0?"good":"bad");
  onUnlockCheck();
  dirty();
}

function sheetResult(e){
  let h = `<div class="card" style="margin:0 0 12px;text-align:center;padding:16px">
    <div class="xs mut2">${T("tce","Time charter equivalent")}</div>
    <div class="xl bb ${cls_pn(e.tce)}" style="margin:2px 0">${money(e.tce)}<span class="sm mut">/day</span></div>
    <div class="sm mut">${money(e.gvp,e.gvp>0)} gross voyage profit over ${days1(e.days)}</div>
  </div>`;

  if(S.voyagesDone === 1){
    h += `<div class="card" style="margin:0 0 12px;border-color:var(--line2)">
      <div class="sm">TCE is the number the whole industry is judged on: what the voyage earned per day, after everything you had to pay to perform it. Freight per tonne tells you almost nothing on its own — a high rate into a slow port with a long empty leg can earn less per day than a modest rate on a quick turn.</div>
    </div>`;
  }
  h += voyageBreakdown(e);
  showSheet("Voyage completed", `${esc(e.loadName)} → ${esc(e.dischName)}`, h,
    `<button class="btn pri" onclick="hideSheet()">Continue</button>`);
}

function voyageBreakdown(e){
  const ship = S.ships.find(s=>s.id===e.shipId);
  const cls = ship ? shipCls(ship) : CLASSES.handysize;
  let h = `<h2 class="sect" style="margin-top:0">Days</h2><div class="card" style="margin:0">
    ${e.balDays>0.05 ? kv((has("ballast") ? T("ballast","Ballast") : "Sailing to load port")+" "+nm0(e.balNm),
                          days1(e.balDays), "mut") : ""}
    ${kv("Loading at "+esc(e.loadName), days1(e.loadDays))}
    ${kv(T("laden","Laden")+" "+nm0(e.ladNm), days1(e.ladDays))}
    ${kv("Discharging at "+esc(e.dischName), days1(e.dischDays))}
    ${kvt("Total", days1(e.days))}
    ${e.balDays>0.05?`<div class="xs mut2" style="margin-top:7px">${Math.round(e.balDays/e.days*100)}% of this voyage earned no freight. That is what ballast costs you.</div>`:""}
  </div>`;

  h += `<h2 class="sect">Money</h2><div class="card" style="margin:0">
    ${kv(`Freight ${Math.round(e.qty).toLocaleString()} mt × $${e.rate.toFixed(2)}`, money0(e.gross))}
    ${kv(T("addcomm","Commissions"), "−"+money0(e.comm), "neg")}
    ${kv("Net freight", money0(e.net))}
    ${Object.entries(e.bunkerMt).filter(([g,mt])=>mt>0.5).map(([g,mt])=>
       kv(T(g,CFG.FUEL[g].name)+" "+Math.round(mt)+" mt", "", "mut")).join("")}
    ${kv(T("bunkers","Bunkers")+" total", "−"+money0(e.bunkerCost), "neg")}
    ${e.emergency>0.5?`<div class="xs haz" style="margin:-2px 0 6px">${Math.round(e.emergency)} mt lifted at sea prices plus ${pc(CFG.EMERGENCY_LIFT_PREMIUM)} — she ran short. Bunker before sailing next time.</div>`:""}
    ${kv(T("da","Port disbursements"), "−"+money0(e.portDA), "neg")}
    ${e.carbon>1 ? kv(T("ets","Carbon")+` — ${Math.round(e.etsCo2)} t CO₂`, "−"+money0(e.carbon), "neg") : ""}
    ${Math.abs(e.demurrage)>100 ? kv(
        e.overrun>0 ? T("demurrage","Demurrage")+" "+days1(e.overrun) : T("despatch","Despatch")+" "+days1(-e.overrun),
        (e.demurrage>0?"+":"−")+money0(Math.abs(e.demurrage)), e.demurrage>0?"pos":"neg") : ""}
    ${kvt("Gross voyage profit", money0(e.gvp), cls_pn(e.gvp))}
    ${kv(T("opex","OPEX")+" "+days1(e.days), "−"+money0(e.opex), "neg")}
    ${kvt("Net contribution", money0(e.netCash), cls_pn(e.netCash))}
  </div>`;

  if(e.carbon>1){
    h += `<h2 class="sect">Carbon detail</h2><div class="card" style="margin:0">
      ${kv("CO₂ emitted", Math.round(e.etsCo2).toLocaleString()+" t")}
      ${kv("EU scope", pc(e.euScope)+(e.euScope===1?" — intra-EU":e.euScope===0.5?" — one leg in the EU":""))}
      ${kv(T("ets","EU ETS"), "−"+money0(e.etsCost), "neg")}
      ${kv(T("fueleu","FuelEU"), "−"+money0(e.feuCost), "neg")}
    </div>`;
  }
  return h;
}

function sheetVoyage(day, shipId){
  const e = S.log.find(x=>x.day===day && x.shipId===shipId); if(!e) return;
  showSheet(`${esc(e.loadName)} → ${esc(e.dischName)}`,
    `${dateFull(e.day)} · ${esc(e.shipName)}`,
    `<div class="card" style="margin:0 0 12px;text-align:center;padding:14px">

      <div class="xl bb ${cls_pn(e.tce)}">${money(e.tce)}<span class="sm mut">/day</span></div>

}

function sheetAllVoyages(){
  showSheet("Voyage log", `${S.log.length} completed`,
    S.log.map(e=>`<div class="card tap" style="margin-bottom:8px" onclick="sheetVoyage(${e.day},${e.shipId})">

      </div><div style="text-align:right">
        <div class="b ${cls_pn(e.gvp)}">${money(e.gvp,e.gvp>0)}</div>

}

/* --- live estimate for a running voyage ---------------------------------- */
function sheetEstimate(shipId){
  const sh = S.ships.find(s=>s.id===shipId); if(!sh || !sh.voyage) return;
  const v = sh.voyage, p = v.plan;
  const fake = Object.assign({}, p, {
    shipId: sh.id, cargo: v.fx.cargo, rate: v.fx.rate, qty: p.qty,
    loadName: p.loadName, dischName: p.dischName,
    bunkerMt: v.act.bunkerMt, bunkerCost: p.bunkerCost, portDA: p.daLoad+p.daDisch,
    carbon: p.ets.cost+p.feu.cost, etsCo2: p.ets.co2, etsCost: p.ets.cost,
    feuCost: p.feu.cost, euScope: p.euScope, emergency: v.act.emergency||0,
  });
  showSheet("Voyage estimate", `${esc(p.loadName)} → ${esc(p.dischName)} · ${days1(Math.max(0,p.days-v.elapsed))} to run`,
    `<div class="card" style="margin:0 0 12px;text-align:center;padding:14px">
      <div class="xs mut2">Projected ${T("tce","TCE")}</div>
      <div class="xl bb ${cls_pn(p.tce)}">${money(p.tce)}<span class="sm mut">/day</span></div>
    </div>` + voyageBreakdown(fake));
}

/* --- bunkering ----------------------------------------------------------- */
function sheetBunker(shipId){
  const sh = S.ships.find(s=>s.id===shipId); if(!sh) return;
  renderBunker(sh, null);
}
let bunkerLift = {};
function renderBunker(sh, grade){
  const cls = shipCls(sh), port = PORTS[sh.port];
  const avail = Object.keys(CFG.FUEL).filter(g =>
    bunkerPrice(port, g, MKT) !== null && (g !== "hsfo" || sh.scrubber));
  if(!avail.length){
    showSheet("Bunkers", esc(port.name),
      `<div class="empty"><div class="big">⛽</div><div class="b">No bunkers available here</div>
       <div class="sm mut2" style="margin-top:6px">${esc(port.name)} is not a bunkering port. Plan a call somewhere that is, or you will pay a hurry premium at sea.</div></div>`);
    return;
  }
  const g = grade || (sh.scrubber && avail.includes("hsfo") ? "hsfo" : avail.includes("vlsfo") ? "vlsfo" : avail[0]);
  const px = bunkerPrice(port, g, MKT);
  const space = cls.fuelCap - robTot(sh);
  const key = sh.id+g;
  const lift = clamp(bunkerLift[key] ?? Math.min(space, cls.fuelCap*0.45), 0, space);
  const cost = lift*px;

  // Where else could she lift this grade, and at what?
  const others = Object.entries(PORTS)
    .map(([id,p])=>({ id, p, px: bunkerPrice(p, g, MKT) }))
    .filter(x=>x.px !== null && x.id !== sh.port)
    .sort((a,b)=>a.px-b.px).slice(0,4);

  let h = `<div class="seg">${avail.map(x=>
    `<button aria-selected="${x===g}" onclick="renderBunker(S.ships.find(s=>s.id===${sh.id}),'${x}')">${CFG.FUEL[x].name}</button>`).join("")}</div>`;

  h += `<div class="card" style="margin:0 0 12px">
    ${kv("Price here", "$"+px+"/mt")}
    ${kv("On board", Math.round(robTot(sh)).toLocaleString()+" mt of "+cls.fuelCap.toLocaleString()+" mt")}
    ${kv("Space", Math.round(space).toLocaleString()+" mt")}
  </div>`;

  h += `<h2 class="sect" style="margin-top:0">Lift</h2><div class="card" style="margin:0">
    <div class="between"><div class="b mono">${Math.round(lift).toLocaleString()} mt</div>
      <div class="b ${cost>S.cash?"neg":""}">${money0(cost)}</div></div>
    <input type="range" min="0" max="${Math.max(1,Math.floor(space))}" step="10" value="${Math.floor(lift)}"
      oninput="bunkerLift['${key}']=+this.value;renderBunker(S.ships.find(s=>s.id===${sh.id}),'${g}')">
    <div class="row xs mut2"><span>0</span><span style="margin-left:auto">${Math.round(space).toLocaleString()} mt full</span></div>
  </div>`;

  h += `<h2 class="sect">Cheapest ${CFG.FUEL[g].name} elsewhere</h2><div class="card" style="margin:0">
    ${others.map(o=>kv(esc(o.p.name), "$"+o.px+"/mt", o.px<px?"pos":"")).join("")}
    <div class="xs mut2" style="margin-top:7px">Lifting where fuel is cheap and running through where it is dear is worth real money over a year. ${T("bunkers","Bunkers")} are the biggest voyage cost you actually control.</div>
  </div>`;

  showSheet("Bunkering", `${esc(sh.name)} · ${esc(port.name)}`, h,
    `<button class="btn pri" ${cost>S.cash||lift<1?"disabled":""} onclick="doBunker(${sh.id},'${g}',${Math.floor(lift)},${px})">Lift ${Math.round(lift).toLocaleString()} mt for ${money(cost)}</button>`);
}
function doBunker(shipId, g, mt, px){
  const sh = S.ships.find(s=>s.id===shipId); if(!sh || mt<1) return;
  const cost = mt*px;
  if(cost > S.cash){ toast("Not enough cash.", "bad"); return; }
  // Weighted-average the cost of what is already aboard with the new stem.
  const had = sh.rob[g] || 0, hadPx = sh.robCost[g] || px;
  sh.rob[g] = had + mt;
  sh.robCost[g] = (had*hadPx + mt*px) / (had+mt);
  S.cash -= cost; S.ledger.bunkers += cost;
  hideSheet();
  toast(`Lifted ${mt.toLocaleString()} mt ${CFG.FUEL[g].name} at $${px}/mt`, "good");
  dirty();
}

/* ==========================================================================
   MARKET
   ========================================================================= */
function vMarket(){
  if(!has("market")) return lockView("📈", "Market data",
    `The freight indices, bunker prices by port and asset values open up once you have ${CFG.UNLOCK.market} voyages behind you — by then the question "is this a good rate?" actually means something.`,
    CFG.UNLOCK.market);

  let h = `<h2 class="sect" style="margin-top:0">Freight indices</h2>`;
  h += `<div class="card" style="margin-bottom:10px">
    <div class="xs mut" style="margin-bottom:2px">${T("index","100 is mid-cycle")}. The segments correlate but do not move together — Capesize turns first.</div>
  </div>`;
  for(const k of Object.keys(INDEX_META)) h += indexCard(k);

  h += `<h2 class="sect">Bunker prices</h2>`;
  const grades = ["vlsfo","mgo"];
  const rows = Object.entries(PORTS)
    .filter(([id,p])=>p.bunker && p.bunker.vlsfo !== undefined)
    .map(([id,p])=>({ id, p, v:bunkerPrice(p,"vlsfo",MKT), m:bunkerPrice(p,"mgo",MKT) }))
    .sort((a,b)=>a.v-b.v);
  h += `<div class="card"><div class="kv"><span class="k xs">Port</span>
      <span class="v xs mut">VLSFO / MGO $/mt</span></div>
    ${rows.slice(0,10).map(r=>kv(esc(r.p.name), `${r.v} / ${r.m}`)).join("")}
    <div class="xs mut2" style="margin-top:7px">Ten cheapest of ${rows.length} bunkering ports. Singapore, Rotterdam and Fujairah are cheap for a reason: volume.</div>
  </div>`;
  return h;
}

function indexCard(k){
  const m = INDEX_META[k], v = S.mkt.idx[k], hist = S.mkt.hist[k] || [];
  const prev = hist.length>6 ? hist[hist.length-7] : v;
  const chg = v - prev;
  const band = v<70?"Weak":v<95?"Soft":v<115?"Mid-cycle":v<150?"Firm":"Strong";
  const bcls = v<70?"neg":v<95?"haz":v<115?"":"pos";
  return `<div class="card tap" onclick="sheetIndex('${k}')">
    <div class="between">
      <div><div class="b">${m.name}</div>
        <div class="xs mut2">${band} market</div></div>
      <div style="text-align:right">
        <div class="lg b ${bcls}">${v.toFixed(1)}</div>
        <div class="xs ${cls_pn(chg)}">${chg>=0?"+":""}${chg.toFixed(1)} / 30d</div>
      </div></div>
    ${sparkline(hist)}
  </div>`;
}

function sparkline(hist){
  if(hist.length<3) return "";
  const w=100, hh=38, lo=Math.min(...hist), hi=Math.max(...hist), rg=Math.max(hi-lo,1);
  const pts = hist.map((v,i)=>`${(i/(hist.length-1)*w).toFixed(2)},${(hh-(v-lo)/rg*hh).toFixed(2)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none" style="margin-top:8px">
    <polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

function sheetIndex(k){
  const m = INDEX_META[k], hist = S.mkt.hist[k]||[], v = S.mkt.idx[k];
  const lo = hist.length?Math.min(...hist):v, hi = hist.length?Math.max(...hist):v;
  showSheet(m.name, `Index ${v.toFixed(1)} · ${hist.length*CFG.MKT.histEvery} days of history`,
    `<div class="card" style="margin:0 0 12px">${chart(hist)}</div>
     <div class="card" style="margin:0">
      ${kv("Now", v.toFixed(1))}
      ${kv("Period high", hi.toFixed(1))}
      ${kv("Period low", lo.toFixed(1))}
      ${kv("Mid-cycle", "100.0")}
     </div>
     <div class="card" style="margin-top:12px">
      <div class="sm mut">Freight rates are cyclical, and the cycle is long — roughly four to five years peak to peak. Fixing a ship on a long time charter near the top and staying spot near the bottom is the whole game. Rates on this index feed straight through to every ${m.short} cargo on the board.</div>
     </div>`);
}

function chart(hist){
  if(hist.length<3) return `<div class="mut sm">Not enough history yet.</div>`;
  const w=300, h=150, pad=18;
  const lo=Math.min(...hist,60), hi=Math.max(...hist,140), rg=Math.max(hi-lo,1);
  const x=i=>pad+(i/(hist.length-1))*(w-pad-4);
  const y=v=>h-pad-((v-lo)/rg)*(h-pad-8);
  const pts=hist.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  let g="";
  for(const gv of [50,100,150,200]){ if(gv<lo||gv>hi) continue;
    g+=`<line class="gl" x1="${pad}" y1="${y(gv)}" x2="${w-4}" y2="${y(gv)}"/>
        <text class="ax" x="0" y="${y(gv)+3}">${gv}</text>`; }
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${g}
    <line class="gl" x1="${pad}" y1="${y(100)}" x2="${w-4}" y2="${y(100)}" stroke-dasharray="3 3"/>
    <polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

function lockView(icon, title, body, n){
  return `<div class="lock"><div class="big">${icon}</div>
    <div class="t">${title}</div>
    <div class="sm" style="max-width:290px;margin:0 auto">${body}</div>
    <div class="pill" style="margin-top:14px">${S.voyagesDone} / ${n} voyages</div></div>`;
}

/* ==========================================================================
   COMPANY
   ========================================================================= */
function vCompany(){
  const L = S.ledger;
  const debt = S.ships.reduce((a,s)=>a+(s.debt?s.debt.principal:0),0);
  const assets = S.ships.reduce((a,s)=>a+assetValue(s.cls, shipAge(s), MKT),0);
  const eq = S.cash + assets - debt;
  const fleetDays = S.ships.reduce((a,s)=>a+s.lifeDays,0);
  const fleetGvp  = S.ships.reduce((a,s)=>a+s.lifeGvp,0);

  let h = `<h2 class="sect" style="margin-top:0">Position</h2><div class="card">
    ${kv("Cash", money(S.cash), cls_pn(S.cash))}
    ${kv("Fleet market value", money(assets))}
    ${kv("Debt outstanding", "−"+money(debt), "neg")}
    ${kvt("Net equity", money(eq), cls_pn(eq))}
  </div>`;

  h += `<h2 class="sect">Profit &amp; loss — to date</h2><div class="card">
    ${kv("Net freight earned", money(L.freight))}
    ${Math.abs(L.demurrage)>100?kv(T("demurrage","Demurrage")+" net", money(L.demurrage, L.demurrage>0), cls_pn(L.demurrage)):""}
    ${kv(T("bunkers","Bunkers"), "−"+money(L.bunkers), "neg")}
    ${kv(T("da","Port disbursements"), "−"+money(L.portDA), "neg")}
    ${L.carbon>1?kv("Carbon", "−"+money(L.carbon), "neg"):""}
    ${kv(T("opex","OPEX"), "−"+money(L.opex), "neg")}
    ${kv("Interest", "−"+money(L.interest), "neg")}
    ${kvt("Result before principal", money(L.freight+L.demurrage-L.bunkers-L.portDA-L.carbon-L.opex-L.interest),
        cls_pn(L.freight+L.demurrage-L.bunkers-L.portDA-L.carbon-L.opex-L.interest))}
    ${kv("Principal repaid", "−"+money(L.principal), "mut")}
  </div>`;

  h += `<h2 class="sect">Fleet KPIs</h2><div class="card">
    ${kv("Vessels", S.ships.length)}
    ${kv("Voyages completed", S.voyagesDone)}
    ${kv("Utilisation", pc(utilisation()))}
    ${fleetDays>0?kv("Fleet "+T("tce","TCE"), money(fleetGvp/fleetDays)+"/day"):""}
    ${kv("Average OPEX", money0(S.ships.reduce((a,s)=>a+opexDay(shipCls(s),shipAge(s)),0)/Math.max(1,S.ships.length))+"/day")}
  </div>`;

  if(S.daily.length>4){
    h += `<h2 class="sect">Cash</h2><div class="card">${cashChart()}</div>`;
  }

  h += `<h2 class="sect">Reference</h2>
    <button class="btn" style="margin-bottom:8px" onclick="sheetGlossary()">Glossary — ${Object.keys(GLOSSARY).length} terms</button>
    <button class="btn" style="margin-bottom:8px" onclick="sheetSettings()">Settings &amp; save</button>`;

  h += `<div style="text-align:center;margin:22px 0 6px">
    <span id="ver">Kription v${CFG.VERSION}${S.debug?" · debug":""}</span></div>`;
  return h;
}

function cashChart(){
  const d = S.daily.slice(-180);
  if(d.length<4) return "";
  const w=300, h=110, pad=20;
  const vals=d.map(x=>x.cash);
  const lo=Math.min(...vals,0), hi=Math.max(...vals), rg=Math.max(hi-lo,1);
  const x=i=>pad+(i/(d.length-1))*(w-pad-4);
  const y=v=>h-14-((v-lo)/rg)*(h-24);
  const pts=d.map((p,i)=>`${x(i).toFixed(1)},${y(p.cash).toFixed(1)}`).join(" ");
  const last=vals[vals.length-1];
  return `<svg class="chart" style="height:110px" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${lo<0?`<line class="gl" x1="${pad}" y1="${y(0)}" x2="${w-4}" y2="${y(0)}" stroke="var(--neg)" stroke-dasharray="3 3"/>`:""}
    <polyline points="${pts}" fill="none" stroke="${last>=0?"var(--pos)":"var(--neg)"}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
    <text class="ax" x="0" y="12">${money(hi)}</text>
    <text class="ax" x="0" y="${h-2}">${money(lo)}</text>
  </svg><div class="xs mut2">Last ${d.length} days</div>`;
}

function sheetGlossary(){
  const keys = Object.keys(GLOSSARY).sort((a,b)=>GLOSSARY[a][0].localeCompare(GLOSSARY[b][0]));
  showSheet("Glossary", "Every term the game uses, in plain language",
    keys.map(k=>`<div class="card" style="margin-bottom:8px;padding:11px 13px">
      <div class="b sm">${esc(GLOSSARY[k][0])}</div>
      <div class="sm mut" style="margin-top:3px">${esc(GLOSSARY[k][1])}</div></div>`).join(""));
}

  showSheet("Settings", "Phase 1 build",

        ? "Autosaves every 10 seconds and when you leave the tab."

      <button class="btn sm" style="width:100%;margin-bottom:8px" onclick="doExport()">Export save as JSON</button>
      <button class="btn sm" style="width:100%" onclick="doImport()">Import save</button>
    </div>
    <h2 class="sect">Offline</h2><div class="card" style="margin:0">
      <div class="sm mut">While the tab is closed, ships finish the voyage they are on and then wait — the game never fixes cargo on your behalf. Elapsed time is capped at ${CFG.OFFLINE_CAP_DAYS} days so running costs cannot spiral while you are away.</div>
    </div>
    <h2 class="sect">Danger</h2><div class="card" style="margin:0">
      <button class="btn dang sm" style="width:100%" onclick="if(confirm('Delete this run and start over?'))hardReset()">Reset run</button>
    </div>`);
}

/* --- export / import ------------------------------------------------------ */
function doExport(){
  const blob = new Blob([serialise()], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `kription-${dateFull(S.day).replace(/ /g,"-")}.json`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast("Save exported.", "good");
}
function doImport(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try { load(String(r.result)); hideSheet(); save(); dirty();
            toast("Save imported.", "good"); }
      catch(e){ toast("That file is not a Kription save.", "bad"); }
    };
    r.readAsText(f);
  };
  inp.click();
}
function hardReset(){
  try { localStorage.removeItem(CFG.SAVE_KEY); } catch(e){}
  hideSheet(); newGame(); dirty();
}

/* ==========================================================================
   UNLOCKS — layer the systems in, and say why each one now matters
   ========================================================================= */
function onUnlockCheck(){
  const n = S.voyagesDone;
  if(n >= CFG.UNLOCK.bunkers)
    coach("u_bunkers", "Bunkers are yours to buy", "Fuel is the biggest voyage cost you actually control. Prices differ by hundreds of dollars a tonne between ports — lift where it is cheap. There is a <b>Bunker</b> button on each idle ship.");
  if(n >= CFG.UNLOCK.ballast)
    coach("u_ballast", "Watch the empty leg", "Getting to the cargo costs fuel and days and earns nothing. A fixture card now shows its ballast leg, and tells you how much cargo is on offer where the voyage ends. Discharging into a dead-end port is how a good rate becomes a bad quarter.");
  if(n >= CFG.UNLOCK.eca)
    coach("u_eca", "Emission control areas", "Inside an ECA — the North Sea, Baltic, North America, Caribbean and Mediterranean — you must burn 0.1% sulphur MGO, which is roughly a third dearer than VLSFO. Short Baltic trades burn it the whole way, which is why they look expensive per tonne.");
  if(n >= CFG.UNLOCK.speed)
    coach("u_speed", "Now choose your speed", "Consumption rises with roughly the cube of speed, so dropping two knots can cut daily burn by a third — at the cost of days. Which way is right depends on the freight rate and the bunker price, and it changes. Every fixture now has a speed slider.");
  if(n >= CFG.UNLOCK.market)
    coach("u_market", "The market has a shape", "The Market tab is open. Freight rates run in cycles of four to five years, and the segments do not move together. Knowing where you are in the cycle is what separates an owner from an operator.");
  if(n >= CFG.UNLOCK.demurrage)
    coach("u_dem", "Laytime and demurrage", "Charter parties allow a fixed time for cargo work. Beat it and the charterer pays you demurrage; run over and you hand back despatch. It is now itemised on every fixture and result.");
}

/* ##########################################################################
   §BOOT
   ######################################################################### */

/* --- input --------------------------------------------------------------- */
$("tabs").addEventListener("click", (ev)=>{
  const b = ev.target.closest("button[data-tab]"); if(!b) return;
  S.tab = b.dataset.tab; dirty();
});
$("scrim").addEventListener("click", hideSheet);
$("sheet").querySelector(".grab").addEventListener("click", hideSheet);

$("clockbtn").addEventListener("click", ()=>{
  if(S.paused){ S.paused = false; }
  else {
    const i = CFG.SPEEDS.indexOf(S.speed);
    if(i === CFG.SPEEDS.length-1){ S.paused = true; S.speed = CFG.SPEEDS[0]; }
    else S.speed = CFG.SPEEDS[i+1];
  }
  dirty();
});

// glossary term taps (delegated — terms are rendered all over the place)
document.addEventListener("click", (ev)=>{
  const t = ev.target.closest(".term"); if(!t) return;
  ev.stopPropagation();
  const g = GLOSSARY[t.dataset.t]; if(!g) return;
  markSeen(t.dataset.t);
  toast(`<b>${esc(g[0])}</b><br><span class="mut">${esc(g[1])}</span>`);
});

// long-press the version number for the debug panel
(function(){
  let timer = null;
  const start = (ev)=>{
    const v = ev.target.closest("#ver"); if(!v) return;
    timer = setTimeout(()=>{ timer=null; sheetDebug(); }, 650);
  };
  const stop = ()=>{ if(timer){ clearTimeout(timer); timer=null; } };
  document.addEventListener("pointerdown", start);
  document.addEventListener("pointerup", stop);
  document.addEventListener("pointercancel", stop);
  document.addEventListener("pointermove", stop);
})();

function sheetDebug(){
  S.debug = true;
  const clsOpts = Object.entries(CLASSES).map(([id,c])=>
    `<option value="${id}">${c.name} — ${c.dwt.toLocaleString()} dwt</option>`).join("");
  showSheet("Debug", "Everything unlocked while this is on",
    `<div class="card" style="margin:0 0 10px">
      ${kv("Day", Math.round(S.day)+" — "+dateFull(S.day))}
      ${kv("Seed", S.seed)}
      ${kv("Indices", Object.entries(S.mkt.idx).map(([k,v])=>k+" "+v.toFixed(0)).join("  "))}
      ${kv("Oil factor", MKT.oil.toFixed(3))}
    </div>
    <h2 class="sect" style="margin-top:0">Cash</h2><div class="card" style="margin:0">
      <div class="row" style="gap:6px">
        <button class="btn sm" onclick="S.cash+=1e6;dirty()">+$1M</button>
        <button class="btn sm" onclick="S.cash+=1e7;dirty()">+$10M</button>
        <button class="btn sm" onclick="S.cash+=1e8;dirty()">+$100M</button>
      </div></div>
    <h2 class="sect">Time</h2><div class="card" style="margin:0">
      <div class="row" style="gap:6px">
        <button class="btn sm" onclick="simDays(30);snapshotMarket();dirty()">+30d</button>
        <button class="btn sm" onclick="simDays(180);snapshotMarket();dirty()">+180d</button>
        <button class="btn sm" onclick="simDays(365);snapshotMarket();dirty()">+1yr</button>
      </div></div>
    <h2 class="sect">Market</h2><div class="card" style="margin:0">
      <div class="row" style="gap:6px;margin-bottom:8px">
        <button class="btn sm" onclick="forceMkt(45)">Bust 45</button>
        <button class="btn sm" onclick="forceMkt(100)">Mid 100</button>
        <button class="btn sm" onclick="forceMkt(210)">Boom 210</button>
      </div>
      <div class="xs mut2">Sets every index and resets the cycle phase to match.</div>
    </div>
    <h2 class="sect">Spawn vessel</h2><div class="card" style="margin:0">
      <select id="dbg-cls" style="width:100%;min-height:40px;background:var(--surf2);color:var(--txt);
        border:1px solid var(--line2);border-radius:9px;padding:0 10px;margin-bottom:8px">${clsOpts}</select>
      <button class="btn sm" style="width:100%" onclick="dbgSpawn()">Spawn debt-free at Rotterdam</button>
    </div>
    <h2 class="sect">Progress</h2><div class="card" style="margin:0">
      <button class="btn sm" style="width:100%;margin-bottom:8px" onclick="S.voyagesDone+=5;onUnlockCheck();dirty()">+5 voyages counted (unlocks)</button>
      <button class="btn sm" style="width:100%" onclick="S.debug=false;hideSheet();dirty()">Turn debug off</button>
    </div>`);
}
function forceMkt(v){
  for(const k of Object.keys(MKT.idx)){
    const s = MKT.idx[k];
    s.v = v; s.noise = 0;
    // put the cycle phase where it would need to be to produce this level
    const want = clamp((v/100 - 1)/CFG.MKT.amp, -1, 1);
    s.phase = Math.asin(want);
  }
  snapshotMarket(); dirty(); toast("Market forced to "+v, "warn");
}
function dbgSpawn(){
  const id = $("dbg-cls").value;
  const sh = mkShip(S, id, CLASSES[id].name.split(" ")[0]+" "+(S.nextId), 2020, "rotterdam");
  S.ships.push(sh); hideSheet(); dirty();
  toast("Spawned "+CLASSES[id].name, "good");
}

/* --- main loop ----------------------------------------------------------- */
let lastT = 0, acc = 0;
function frame(t){
  if(!lastT) lastT = t;
  const dtMs = Math.min(t - lastT, 250);   // a backgrounded tab must not lurch
  lastT = t;

  if(!S.paused && !S.bust){
    acc += dtMs;
    const step = 40;                        // sim at 25 Hz, render on demand
    while(acc >= step){
      simDays((step/1000)/CFG.SEC_PER_DAY * S.speed, false);
      acc -= step;
    }
  }

  // The top bar is cheap and always live; the screen only redraws when dirty.
  renderTop();
  if(_dirty || !sheetOpen && S.tab === "fleet"){
    if(_dirty){ snapshotMarket(); render(); _dirty = false; }
    else updateFleetProgress();
  }
  requestAnimationFrame(frame);
}

/* Cheap in-place progress update so the Fleet tab animates without a full
   re-render — a 40-ship fleet is 40 style writes, not 40 DOM rebuilds. */
function updateFleetProgress(){
  const cards = $("screen").querySelectorAll(".card .bar.pos > i");
  let i = 0;
  for(const sh of S.ships){
    if(!sh.voyage) continue;
    const el = cards[i++]; if(!el) break;
    el.style.width = pc(clamp(sh.voyage.elapsed/sh.voyage.plan.days, 0, 1));
  }
}

/* --- persistence hooks --------------------------------------------------- */
setInterval(()=>{ if(!S.bust) save(); }, CFG.AUTOSAVE_MS);
// Non-Fleet tabs hold live numbers (board, indices, P&L) but don't animate;
// a slow repaint keeps them current without rebuilding the DOM every frame.
setInterval(()=>{ if(!S.paused && !sheetOpen && S.tab !== "fleet") dirty(); }, 700);
window.addEventListener("pagehide", save);
window.addEventListener("visibilitychange", ()=>{ if(document.hidden) save(); });

/* --- start --------------------------------------------------------------- */
(function boot(){
  // storage probe
  try { localStorage.setItem("__k","1"); localStorage.removeItem("__k"); }
  catch(e){ hasStorage = false; }

  const resumed = tryLoad();
  if(!resumed) newGame();

  let off = null;
  if(resumed) off = applyOffline();

  snapshotMarket();
  render();
  requestAnimationFrame(frame);

  if(off && off.completed >= 0 && off.days >= 0.5) sheetAway(off);
  else if(!resumed){
    coach("welcome", "One ship, and a mortgage",
      `You own <b>${esc(S.ships[0].name)}</b> — a ${shipAge(S.ships[0])}-year-old Handysize bulker lying at Riga, and ${money(S.cash)} in the bank. Running costs are charged every day whether she is working or not. Find her a cargo.`);
  }
  if(!hasStorage) showBanner("Browser storage unavailable — this session is memory-only. Use Export Save in Company to keep your run.");
})();

function sheetAway(off){
  const rows = off.voyages.length
    ? off.voyages.map(e=>`<div class="card" style="margin-bottom:8px;padding:11px 13px">
        <div class="between"><div class="grow trunc">
          <div class="sm b trunc">${esc(e.loadName)} → ${esc(e.dischName)}</div>
          <div class="xs mut2">${esc(e.shipName)} · ${days1(e.days)}</div>
        </div><div style="text-align:right">
          <div class="b ${cls_pn(e.gvp)}">${money(e.gvp,e.gvp>0)}</div>
          <div class="xs mut2 mono">${money(e.tce)}/d</div>
        </div></div></div>`).join("")
    : `<div class="mut sm">No voyages completed — nothing was due to finish.</div>`;

  const idle = S.ships.filter(s=>s.status==="idle").length;
  showSheet("While you were away",
    `${days1(off.days)} elapsed${off.capped?` — capped from ${days1(off.wantedDays)}`:""}`,
    `<div class="card" style="margin:0 0 12px;text-align:center;padding:14px">
      <div class="xs mut2">Cash movement</div>
      <div class="xl bb ${cls_pn(off.cashDelta)}">${money(off.cashDelta, off.cashDelta>0)}</div>
      <div class="sm mut">after running costs and debt service</div>
    </div>
    <h2 class="sect" style="margin-top:0">Voyages completed</h2>${rows}
    ${idle?`<div class="card" style="margin-top:12px">
      <div class="sm">${idle} ship${idle===1?" is":"s are"} now idle and earning nothing. The game never fixes cargo for you — that decision is always yours.</div></div>`:""}`,
    `<button class="btn pri" onclick="hideSheet()">Continue</button>`);
}
</script>
