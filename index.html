    ${!sh.retrofit&&!sh.voyage&&!sh.dd&&has("cii")?`<button class="btn sm" onclick="sheetRetro(${sh.id},'eff')">Efficiency package</button>`:""}
    ${has("survey")&&!sh.dd&&nx.due-S.day<0?`<button class="btn sm" onclick="deferSurvey(S.ships.find(s=>s.id===${sh.id}));hideSheet()">Defer survey</button>`:""}
    ${has2("sandp")&&!sh.voyage&&!sh.dd?`<button class="btn sm" onclick="sheetSell(${sh.id})">Sell or scrap</button>`:""}
    </div></div>`;

  showSheet(esc(sh.name), `${cls.name} · ${PORTS[sh.port].name}`, h, acts.join("") || null);
}
function canalNote(cls){
  const a = canalsAllowed(cls, false);
  if(a.has("suez") && a.has("panama")) return "Suez and Panama";
  if(a.has("suez")) return `${T("suez","Suez")} only — too wide for Panama`;
  if(a.has("panama")) return "Panama only";
  return `Neither — ${cls.draft.toFixed(1)} m draft exceeds Suez`;
}

/* ==========================================================================
   CHARTER — spot, time charter, COA, day-rate contracts, liner services
   ========================================================================= */
function goCharter(shipId){
  S.tab = "charter";
  const idle = S.ships.filter(s=>s.status==="idle" && (!s.emp||s.emp.type==="spot"));
  charterShip = shipId || (idle[0] && idle[0].id) || null;
  if(S.voyagesDone === 0)
    coach("pick", "Pick a cargo", "Each card is a firm offer: the cargo, where it loads and discharges, and what you would earn. Tap <b>Fix</b> to take one, or the card itself to see how the number is built.");
  dirty();
}

function vCharter(){
  const idle = S.ships.filter(s=>s.status==="idle" && (!s.emp||s.emp.type==="spot"));
  const tabs = [["spot","Spot"]];
  if(has2("timecharter")) tabs.push(["tc","Charter out"]);
  if(has2("coa")) tabs.push(["coa","COA"]);
  if(has2("liner")) tabs.push(["svc","Services"]);
  let h = tabs.length>1 ? `<div class="seg">${tabs.map(([k,l])=>
    `<button aria-selected="${charterTab===k}" onclick="charterTab='${k}';dirty()">${l}</button>`).join("")}</div>` : "";

  if(charterTab === "coa") return h + vCoa();
  if(charterTab === "svc") return h + vServices();

  if(!idle.length) return h + `<div class="empty"><div class="big">⚓</div>
    <div class="b">Every ship is employed</div>
    <div class="sm mut2" style="margin-top:6px">New business appears as vessels come free. The board turns over about once a week.</div></div>`;

  if(!charterShip || !idle.find(s=>s.id===charterShip)) charterShip = idle[0].id;
  const sh = S.ships.find(s=>s.id===charterShip);
  if(idle.length > 1) h += `<div class="seg">${idle.map(s=>
    `<button aria-selected="${s.id===charterShip}" onclick="charterShip=${s.id};dirty()">${esc(s.name.split(" ").slice(-1)[0])}</button>`).join("")}</div>`;

  const p = PORTS[sh.port];
  h += `<div class="card" style="padding:11px 13px"><div class="between">
    <div><div class="xs mut2">Open at</div><div class="b">${esc(p.name)}</div></div>
    <div style="text-align:right"><div class="xs mut2">${has("ballast")?T("liquidity","Cargo on offer"):"Cargo on offer"}</div>
      <div class="b ${p.liq>0.5?"pos":p.liq>0.3?"haz":"neg"}">${p.liq>0.75?"Strong":p.liq>0.5?"Moderate":p.liq>0.3?"Thin":"Very thin"}</div></div>
  </div></div>`;

  if(charterTab === "tc") return h + vTcOffers(sh);

  const list = S.fixtures.filter(f=>f.forShip===sh.id);
  const dayList = (S.dayOffers||[]).filter(f=>f.forShip===sh.id);
  if(dayList.length){
    h += `<h2 class="sect">Contracts</h2>`;
    for(const o of dayList) h += `<div class="card tap" onclick="sheetDayrate(${sh.id},'${o.id}')">
      <div class="between"><div class="grow trunc"><div class="b trunc">${esc(o.name)}</div>
        <div class="xs mut2">${esc(PORTS[o.base].name)} · ${o.days} days</div></div>
      <div style="text-align:right"><div class="lg b pos">${money0(o.rate)}<span class="sm mut">/d</span></div>
        <div class="xs mut2">${money(o.rate*o.days)} total</div></div></div></div>`;
  }
  if(!list.length && !dayList.length)
    return h + `<div class="empty"><div class="big">📋</div><div class="b">Nothing on the board here</div>
      <div class="sm mut2" style="margin-top:6px">${esc(p.name)} is a thin market for this ship. Wait for the board to turn, or take a ballast leg somewhere busier.</div></div>`;

  if(list.length){
    h += `<h2 class="sect">Cargoes on offer</h2>`;
    for(const f of list){
      const e = voyageEstimate(sh, f, fxSpeed[f.id] ?? (shipCls(sh).designSpeed-1.5), MKT, estOpts(sh));
      h += fixtureCard(sh, f, e);
    }
  }
  return h;
}

function fixtureCard(sh, f, e){
  const dp = PORTS[f.disch], liq = dp.liq;
  const chips = [`<span class="pill">${S.voyagesDone>=1?"TCE ":""}${money(e.tce)}/d</span>`];
  if(has("ballast") && e.balDays>0.05) chips.push(`<span class="pill warn">${days1(e.balDays)} ballast</span>`);
  if(has("eca") && e.ecaNm>0) chips.push(`<span class="pill">${T("eca","ECA")} ${Math.round(e.ecaNm/Math.max(1,e.balNm+e.ladNm)*100)}%</span>`);
  if(has2("canal") && Object.keys(e.canals).length) chips.push(`<span class="pill">${Object.keys(e.canals).map(c=>CFG.CANAL[c].name.split(" ")[0]).join("+")}</span>`);
  if(e.warZones.length) chips.push(`<span class="pill bad">War risk</span>`);
  if(f.vetGate) chips.push(`<span class="pill ${vettingScore(sh)>=CFG.VET.gate?"on":"bad"}">${esc(f.major)}</span>`);
  if(e.wcap > S.cash) chips.push(`<span class="pill bad">Needs ${money(e.wcap)} cash</span>`);
  return `<div class="card tap" onclick="sheetFixture(${sh.id},'${f.id}')">
    <div class="between"><div class="grow trunc">
      <div class="b trunc">${esc(e.loadName)} → ${esc(e.dischName)}</div>
      <div class="xs mut2 trunc">${CARGOES[f.cargo].name} · ${Math.round(e.qty).toLocaleString()} ${e.unit} · ${f.ws?"WS "+f.ws:"$"+f.rate.toFixed(2)}</div>
    </div><div style="text-align:right;flex:none">
      <div class="lg b ${cls_pn(e.gvp)}">${money(e.gvp, e.gvp>0)}</div>
      <div class="xs mut2">${days1(e.days)}</div></div></div>
    <div class="row" style="margin-top:9px;gap:5px;flex-wrap:wrap">${chips.join("")}
      <button class="btn pri sm" style="margin-left:auto" onclick="event.stopPropagation();doFix(${sh.id},'${f.id}')">Fix</button></div>
    <div class="xs mut2" style="margin-top:6px">Onward cargo from ${esc(dp.name)}: ${
      liq>0.75?"strong":liq>0.5?"moderate":liq>0.3?"thin":'<span class="haz">very thin</span>'}</div>
  </div>`;
}

/* --- the second layer: the whole calculation ----------------------------- */
function sheetFixture(shipId, fxId){
  const sh = S.ships.find(s=>s.id===shipId), f = S.fixtures.find(x=>x.id===fxId);
  if(!sh || !f) return;
  renderFixtureSheet(sh, f, fxSpeed[fxId] ?? (shipCls(sh).designSpeed-1.5));
}
function renderFixtureSheet(sh, f, sp){
  const cls = shipCls(sh);
  const e = voyageEstimate(sh, f, sp, MKT, estOpts(sh));
  const opt = has("speed") ? optimalSpeed(sh, f, MKT, estOpts(sh)) : null;
  const lp = PORTS[f.load], dp = PORTS[f.disch];
  const rr = `renderFixtureSheet(S.ships.find(s=>s.id===${sh.id}),S.fixtures.find(x=>x.id==='${f.id}')`;
  let h = "";

  h += `<div class="card" style="margin:0 0 12px;text-align:center;padding:15px">
    <div class="xs mut2">${S.voyagesDone>=1?T("tce","Time charter equivalent"):"Earnings per day"}</div>
    <div class="xl bb ${cls_pn(e.tce)}" style="margin:2px 0">${money(e.tce)}<span class="sm mut">/day</span></div>
    <div class="sm mut">${money(e.gvp,e.gvp>0)} over ${days1(e.days)}</div></div>`;

  if(f.vetGate){
    const s = vettingScore(sh), ok = s >= CFG.VET.gate;
    h += `<div class="card" style="margin:0 0 12px;border-color:${ok?"var(--line2)":"var(--neg)"}">
      <div class="between"><div class="b ${ok?"":"neg"}">${esc(f.major)} ${T("vetting","vetting")}</div>
        <span class="pill ${ok?"on":"bad"}">${s} / ${CFG.VET.gate}</span></div>
      <div class="sm mut" style="margin-top:4px">${ok?"She is approved for this charterer.":"She will not be approved. Improve her condition, her flag or her class, or take non-major business."}</div></div>`;
  }

  if(has("speed")){
    h += `<h2 class="sect" style="margin-top:0">Speed</h2><div class="card" style="margin:0">
      <div class="between"><div class="b mono">${sp.toFixed(2)} kn</div>
        <div class="xs mut">${burnAt(cls,sp,true).toFixed(1)} mt/d laden</div></div>
      <input type="range" min="${cls.minSpeed}" max="${cls.maxSpeed}" step="0.25" value="${sp}"
        oninput="fxSpeed['${f.id}']=+this.value;${rr},+this.value)">
      <div class="row xs mut2"><span>${cls.minSpeed} kn slow</span><span style="margin-left:auto">${cls.maxSpeed} kn full</span></div>
      ${opt?`<div class="between xs" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">
        <span class="mut">Best TCE here</span>
        <button class="btn sm" style="min-height:30px" onclick="fxSpeed['${f.id}']=${opt.speed};${rr},${opt.speed})">${opt.speed} kn → ${money(opt.tce)}/d</button></div>`:""}
    </div>`;
  }

  // routing choice: canal or the long way round
  if(has2("canal") && (Object.keys(e.canals).length || e.altNm !== e.balNm+e.ladNm)){
    const viaCanal = Object.keys(e.canals).length > 0;
    h += `<h2 class="sect">Routing</h2><div class="card" style="margin:0">
      ${kv("Via "+(viaCanal?Object.keys(e.canals).map(c=>CFG.CANAL[c].name).join(" + "):"the Cape"), nm0(e.balNm+e.ladNm))}
      ${kv("Canal tolls", e.tollCost?"−"+money0(e.tollCost):"none", e.tollCost?"neg":"")}
      ${kv("All-Cape alternative", nm0(e.altNm)+` · +${days1((e.altNm-(e.balNm+e.ladNm))/Math.max(1,e.speed)/24)}`)}
      <div class="row" style="gap:6px;margin-top:9px">
        <button class="btn sm" onclick="f_route('${f.id}',null);${rr},${sp})" ${!f.avoidCanals?'style="border-color:var(--acc)"':""}>Use canal</button>
        <button class="btn sm" onclick="f_route('${f.id}',['suez','panama']);${rr},${sp})" ${f.avoidCanals?'style="border-color:var(--acc)"':""}>Round the Cape</button>
      </div>
      ${(cls.ice||0)>=2 && NSR_MONTHS[gDate().getUTCMonth()] ? `<div class="row" style="gap:6px;margin-top:6px">
        <button class="btn sm" onclick="f_nsr('${f.id}');${rr},${sp})">${f.nsr?"NSR selected":T("nsr","Try the Northern Sea Route")}</button></div>`:""}
    </div>`;
  }

  if(e.warZones.length){
    h += `<h2 class="sect">War risk</h2><div class="card" style="margin:0;border-color:var(--haz)">
      ${e.warZones.map(z=>kv(esc(z.name), "−"+money0(z.cost), "neg")).join("")}
      <div class="row" style="gap:6px;margin-top:8px">
        <button class="btn sm" onclick="f_guards('${f.id}');${rr},${sp})" ${f.guards?'style="border-color:var(--acc)"':""}>
          ${f.guards?"Guards embarked":"Embark armed guards"}</button></div>
      <div class="xs mut2" style="margin-top:6px">${T("warrisk","A premium on the ship's value")} plus a crew bonus. Guards cost money and cut the premium by roughly half.</div>
    </div>`;
  }

  h += `<h2 class="sect">Legs</h2><div class="card" style="margin:0">
    ${e.balNm>0?kv(has("ballast")?T("ballast","Ballast")+` to ${esc(lp.name)}`:`Sailing to ${esc(lp.name)}`, nm0(e.balNm)+" · "+days1(e.balDays), "mut"):""}
    ${kv("Load at "+esc(lp.name), days1(e.loadDays))}
    ${kv(T("laden","Laden")+` to ${esc(dp.name)}`, nm0(e.ladNm)+" · "+days1(e.ladDays))}
    ${kv("Discharge at "+esc(dp.name), days1(e.dischDays))}
    ${e.canalDays?kv("Canal transit", days1(e.canalDays)):""}
    ${e.iceDays>0.05?kv(T("iceclass","Ice delay"), days1(e.iceDays), "haz"):""}
    ${e.cleanDays?kv("Tank cleaning", days1(e.cleanDays), "haz"):""}
    ${(e.wBal||e.wLad)?kv("Weather allowance", `−${pc(Math.max(e.wBal,e.wLad))} speed`, "haz"):""}
    ${kvt("Total voyage", days1(e.days))}</div>`;

  h += `<h2 class="sect">Voyage result</h2><div class="card" style="margin:0">
    ${kv(`Freight — ${Math.round(e.qtyOut).toLocaleString()} ${e.unit}${f.ws?` @ WS ${f.ws} of $${f.flat.toFixed(2)}`:` × $${f.rate.toFixed(2)}`}`, money0(e.gross))}
    ${kv(T("addcomm","Commissions")+" 3.75%", "−"+money0(e.comm), "neg")}
    ${kv("Net freight", money0(e.net))}
    ${e.bunkerLines.map(b=>kv(T(b.grade,CFG.FUEL[b.grade].name)+` ${Math.round(b.mt)} mt @ $${b.px}`, "−"+money0(b.cost), "neg")).join("")}
    ${kv(T("da","Port disbursements")+" — "+esc(lp.name), "−"+money0(e.daLoad), "neg")}
    ${kv("Port disbursements — "+esc(dp.name), "−"+money0(e.daDisch), "neg")}
    ${e.tollCost?kv("Canal tolls", "−"+money0(e.tollCost), "neg"):""}
    ${e.warCost?kv(T("warrisk","War risk"), "−"+money0(e.warCost), "neg"):""}
    ${e.ets.cost>1?kv(T("ets","EU ETS")+` — ${Math.round(e.ets.co2)} t CO₂ @ ${pc(e.euScope)}`, "−"+money0(e.ets.cost), "neg"):""}
    ${e.feu.cost>1?kv(T("fueleu","FuelEU"), "−"+money0(e.feu.cost), "neg"):""}
    ${has("demurrage")&&Math.abs(e.demurrage)>100?kv(e.overrun>0?T("demurrage","Demurrage")+" "+days1(e.overrun):T("despatch","Despatch")+" "+days1(-e.overrun),
        (e.demurrage>0?"+":"−")+money0(Math.abs(e.demurrage)), e.demurrage>0?"pos":"neg"):""}
    ${kvt("Gross voyage profit", money0(e.gvp), cls_pn(e.gvp))}
    ${kv(T("opex","OPEX")+" "+days1(e.days), "−"+money0(e.opex), "neg")}
    ${kvt("Net contribution", money0(e.netCash), cls_pn(e.netCash))}</div>`;

  const short = e.wcap > S.cash;
  h += `<h2 class="sect">Cash flow</h2><div class="card" style="margin:0${short?";border-color:var(--neg)":""}">
    ${kvs("Freight terms", `${pc(CFG.FREIGHT_ON_BL)} against the ${T("blading","bill of lading")}, balance on delivery`)}
    ${kv("Advance arrives", money0(e.advance)+" on day "+(Math.round(e.preDays*10)/10))}
    ${kv(T("wcap","Cash to fund until then"), money0(e.wcap), short?"neg":"")}
    ${kv("You have", money(S.cash), short?"neg":"pos")}
    ${short
      ? `<div class="xs neg" style="margin-top:7px">You cannot fund this voyage. She would run out of cash before the freight advance lands — a profitable fixture you simply cannot afford yet. Take a shorter trade, or one loading closer to where she is.</div>`
      : `<div class="xs mut2" style="margin-top:7px">Most of the freight lands once she is loaded, so a long voyage ties up less than its total cost. What you must carry is the ballast leg, the load port bill and the running costs until then.</div>`}
  </div>`;

  h += `<h2 class="sect">Terms</h2><div class="card" style="margin:0">
    ${kvs("Charter party", T("fiost","FIOST")+" — charterer loads and discharges")}
    ${kv(T("laytime","Laytime")+" allowed", days1(e.laytime))}
    ${kv(T("laycan","Laycan")+" opens", "in "+f.laydays+" days")}
    ${kv(T("stowage","Stowage factor"), (CARGOES[f.cargo].sf||0).toFixed(2)+" m³/mt")}
  </div>`;

  showSheet(`${esc(lp.name)} → ${esc(dp.name)}`, `${CARGOES[f.cargo].name} · ${esc(sh.name)}`, h,
    short
      ? `<button class="btn dang" onclick="doFix(${sh.id},'${f.id}',${sp})">Fix anyway — you cannot fund this</button>`
      : `<button class="btn pri" onclick="doFix(${sh.id},'${f.id}',${sp})">Fix at ${money(e.tce)}/day</button>`);
}
function f_route(fxId, avoid){ const f=S.fixtures.find(x=>x.id===fxId); if(f) f.avoidCanals=avoid; }
function f_nsr(fxId){ const f=S.fixtures.find(x=>x.id===fxId); if(f) f.nsr=!f.nsr; }
function f_guards(fxId){ const f=S.fixtures.find(x=>x.id===fxId); if(f) f.guards=!f.guards; }

function doFix(shipId, fxId, sp){
  const sh = S.ships.find(s=>s.id===shipId), f = S.fixtures.find(x=>x.id===fxId);
  if(!sh || !f) return;
  const speed = sp ?? fxSpeed[fxId] ?? (shipCls(sh).designSpeed-1.5);
  const r = fixVoyage(sh, f, speed);
  if(!r.ok){ toast(r.why, "bad"); return; }
  hideSheet(); S.tab = "fleet";
  toast(`<b>Fixed.</b> ${esc(sh.name)} — ${esc(r.est.loadName)} → ${esc(r.est.dischName)}`, "good");
  if(S.voyagesDone === 0)
    coach("sailing", "She's on her way", "The voyage runs in real time — about five seconds a game day. Tap her card any time to see where she is and what the voyage is earning.");
  onUnlockCheck(); dirty();
}

/* --- charter out --------------------------------------------------------- */
function vTcOffers(sh){
  const offers = (S.tcOffers||[]).filter(o=>o.forShip===sh.id);
  const spot = spotTce(sh.cls, MKT);
  let h = `<div class="card"><div class="between">
    <div class="sm mut">Spot market is paying</div><div class="b">${money(spot)}/day</div></div>
    <div class="xs mut2" style="margin-top:5px">${T("tc","Time charter")} trades upside for certainty. Long charters price off where the market expects to be, so in a boom they sit below spot and in a slump above it.</div></div>`;
  if(!offers.length) return h + `<div class="empty"><div class="big">📄</div><div class="b">No charterers bidding</div></div>`;
  h += `<h2 class="sect">Offers</h2>`;
  for(const o of offers.sort((a,b)=>a.days-b.days)){
    const vs = o.rate/spot - 1;
    h += `<div class="card tap" onclick="sheetTc(${sh.id},'${o.id}')">
      <div class="between"><div class="grow"><div class="b">${o.kind==="bb"?T("bareboat","Bareboat"):o.days>=365?Math.round(o.days/365*10)/10+" years":Math.round(o.days/30)+" months"}</div>
        <div class="xs mut2">${esc(o.charterer)}</div></div>
      <div style="text-align:right"><div class="lg b">${money0(o.rate)}<span class="sm mut">/d</span></div>
        <div class="xs ${vs>=0?"pos":"neg"}">${vs>=0?"+":""}${pc(vs)} vs spot</div></div></div>
      <div class="row" style="margin-top:8px;gap:6px">
        <span class="pill">${money(o.rate*o.days)} total</span>
        <button class="btn pri sm" style="margin-left:auto" onclick="event.stopPropagation();takeTc(${sh.id},'${o.id}')">Fix</button></div></div>`;
  }
  return h;
}
function sheetTc(shipId, offerId){
  const sh = S.ships.find(s=>s.id===shipId), o = S.tcOffers.find(x=>x.id===offerId);
  if(!sh || !o) return;
  const cls = shipCls(sh);
  const opex = opexDay(cls, shipAge(sh))*(sh.flagMult||1);
  const debt = sh.debt ? sh.debt.principal*sh.debt.rate/365 + sh.debt.orig/sh.debt.termDays : 0;
  const bb = o.kind === "bb";
  showSheet(bb?"Bareboat charter":"Time charter", `${esc(o.charterer)} · ${esc(sh.name)}`,
    `<div class="card" style="margin:0 0 12px;text-align:center;padding:15px">
      <div class="xs mut2">Hire</div>
      <div class="xl bb pos">${money0(o.rate)}<span class="sm mut">/day</span></div>
      <div class="sm mut">${o.days} days · ${money(o.rate*o.days)} gross</div></div>
     <div class="card" style="margin:0">
      ${kv("Hire, net of 3.75% commission", money0(o.rate*(1-CFG.TC.addComm))+"/day")}
      ${kv(T("opex","OPEX"), bb?"Charterer's account":"−"+money0(opex)+"/day", bb?"pos":"neg")}
      ${debt?kv("Debt service", "−"+money0(debt)+"/day", "neg"):""}
      ${kvt("Net to you", money0(o.rate*(1-CFG.TC.addComm) - (bb?0:opex) - debt)+"/day")}
     </div>
     <div class="card" style="margin-top:12px">
      <div class="sm mut">${bb
        ? `On ${T("bareboat","bareboat")} the charterer crews, insures and operates her. You carry almost no cost and almost no risk — and earn the least. It is a pure asset play.`
        : `On ${T("tc","time charter")} the charterer pays bunkers, port costs and canal tolls and decides where she goes. You keep paying OPEX and debt. A breakdown or a survey puts her ${T("offhire","off-hire")} and the hire clock stops.`}</div>
     </div>`,
    `<button class="btn pri" onclick="takeTc(${sh.id},'${o.id}')">Fix for ${o.days} days</button>`);
}
function sheetDayrate(shipId, offerId){
  const sh = S.ships.find(s=>s.id===shipId), o = S.dayOffers.find(x=>x.id===offerId);
  if(!sh || !o) return;
  const opex = opexDay(shipCls(sh), shipAge(sh))*(sh.flagMult||1);
  showSheet(esc(o.name), `${esc(PORTS[o.base].name)} · ${esc(sh.name)}`,
    `<div class="card" style="margin:0 0 12px;text-align:center;padding:15px">
      <div class="xs mut2">Day rate</div>
      <div class="xl bb pos">${money0(o.rate)}<span class="sm mut">/day</span></div>
      <div class="sm mut">${o.days} days · ${money(o.rate*o.days)}</div></div>
     <div class="card" style="margin:0">
      ${kv("Base port", esc(PORTS[o.base].name))}
      ${kv(T("opex","OPEX"), "−"+money0(opex)+"/day", "neg")}
      ${kvt("Net", money0(o.rate*(1-CFG.TC.addComm)-opex)+"/day")}
      ${o.war?kv("Area", "War risk area — premium applies", "haz"):""}
     </div>
     <div class="card" style="margin-top:12px"><div class="sm mut">Offshore and aquaculture work is a day-rate business, not a voyage business: you are on hire for a period from a base port. Utilisation is everything, and a survey in the middle of a contract is off-hire you cannot recover.</div></div>`,
    `<button class="btn pri" onclick="takeDayrate(${sh.id},'${o.id}')">Take the contract</button>`);
}

/* --- COA ----------------------------------------------------------------- */
function vCoa(){
  let h = "";
  if(S.coas.length){
    h += `<h2 class="sect" style="margin-top:0">Live contracts</h2>`;
    for(const c of S.coas){
      const left = Math.max(0, c.lifts - c.liftsDone);
      const dLeft = Math.max(0, Math.round(c.endDay - S.day));
      const risk = left > 0 && dLeft < left*30;
      h += `<div class="card"><div class="between"><div class="grow trunc">
        <div class="b trunc">${esc(PORTS[c.route.l].name)} → ${esc(PORTS[c.route.d].name)}</div>
        <div class="xs mut2">${esc(c.charterer)} · ${CARGOES[c.route.c].name} · $${c.rate.toFixed(2)}</div></div>
        <span class="pill ${risk?"bad":"on"}">${c.liftsDone}/${c.lifts}</span></div>
        <div class="bar ${risk?"bad":"pos"}" style="margin-top:8px"><i style="width:${pc(c.liftsDone/c.lifts)}"></i></div>
        <div class="row xs mut2" style="margin-top:5px"><span>${left} cargo${left===1?"":"es"} to lift</span>
          <span style="margin-left:auto">${dLeft}d remaining</span></div>
        <div class="row" style="gap:6px;margin-top:9px;flex-wrap:wrap">
        ${S.ships.filter(s=>s.status==="idle"&&(!s.emp||s.emp.type==="spot")&&eligible(shipCls(s),c.route))
          .map(s=>`<button class="btn sm" onclick="assignCoa(${s.id},'${c.id}')">Assign ${esc(s.name.split(" ").slice(-1)[0])}</button>`).join("")||'<span class="xs mut2">No eligible ship is open.</span>'}
        </div></div>`;
    }
  }
  h += `<h2 class="sect">Offers</h2>`;
  if(!(S.coaOffers||[]).length) return h + `<div class="empty"><div class="big">📑</div><div class="b">No contracts on offer</div></div>`;
  for(const o of S.coaOffers){
    h += `<div class="card tap" onclick="sheetCoa('${o.id}')">
      <div class="between"><div class="grow trunc">
        <div class="b trunc">${esc(PORTS[o.route.l].name)} → ${esc(PORTS[o.route.d].name)}</div>
        <div class="xs mut2">${esc(o.charterer)} · ${CARGOES[o.route.c].name}</div></div>
      <div style="text-align:right"><div class="b">$${o.rate.toFixed(2)}</div>
        <div class="xs mut2">${o.lifts} cargoes / ${Math.round(o.period/30)}mo</div></div></div></div>`;
  }
  return h;
}
function sheetCoa(id){
  const o = S.coaOffers.find(x=>x.id===id); if(!o) return;
  const idx = routeIdx(o.route);
  showSheet(T("coa","Contract of Affreightment"), `${esc(o.charterer)}`,
    `<div class="card" style="margin:0">
      ${kv("Trade", esc(PORTS[o.route.l].name)+" → "+esc(PORTS[o.route.d].name))}
      ${kv("Cargo", CARGOES[o.route.c].name)}
      ${kv("Rate", "$"+o.rate.toFixed(2)+" per unit")}
      ${kv("Against spot today", "$"+((o.route.flat??o.route.rate)*(MKT.idx[idx].v/100)).toFixed(2))}
      ${kv("Commitment", o.lifts+" cargoes")}
      ${kv("Period", Math.round(o.period/30)+" months")}
      ${kv("Cadence needed", "one cargo every "+Math.round(o.period/o.lifts)+" days")}
     </div>
     <div class="card" style="margin-top:12px"><div class="sm mut">A ${T("coa","COA")} fills your programme at a known rate — you accept a small discount to spot for the certainty of volume. Fail to lift the agreed number by the end of the period and you pay for the shortfall and lose standing. Assign any eligible ship to it, and she will work the trade instead of the open market.</div></div>`,
    `<button class="btn pri" onclick="takeCoa('${o.id}')">Agree the contract</button>`);
}

/* --- liner services ------------------------------------------------------ */
function vServices(){
  let h = "";
  if(S.services.length){
    for(const svc of S.services) h += serviceCard(svc);
  } else {
    h += `<div class="card"><div class="sm mut">A liner service is a product you build and maintain, not a cargo you accept. Choose a trade lane and a frequency, and the game tells you how many ships the ${T("string","string")} needs at your chosen speed.</div></div>`;
  }
  h += `<h2 class="sect">Open a service</h2>`;
  const own = S.ships.filter(s=>CLASSES[s.cls].seg==="container");
  if(!own.length) return h + `<div class="empty"><div class="big">🚢</div><div class="b">You own no container tonnage</div>
    <div class="sm mut2" style="margin-top:6px">Buy boxships in the Yard first. You can also simply charter them out and let someone else run the network.</div></div>`;
  for(const lane of LANES){
    const usable = own.filter(s=>lane.cls.includes(s.cls));
    if(!usable.length) continue;
    const plan = linerPlan(lane, usable[0].cls, 16, 7, 1, MKT, gDate().getUTCMonth(), { drought:S.drought });

let bld = { freq:7, speed:16, buffer:1, contract:0.6, ships:[] };

  h += `<h2 class="sect">Frequency and buffer</h2><div class="card" style="margin:0">
    <div class="row" style="gap:6px">${CFG.LINER.frequencies.map(f=>

    <div class="row" style="gap:6px;margin-top:8px">${[0,1,2].map(b=>
      `<button class="btn sm" style="${bld.buffer===b?"border-color:var(--acc)":""}" onclick="bld.buffer=${b};renderLaneBuild()">${b} buffer</button>`).join("")}</div>
    <div class="xs mut2" style="margin-top:7px">Delay propagates round the loop — a ship late out of Yantian is late into Rotterdam and late back again. ${T("reliability","Buffer days")} are the only real defence, and they cost a ship.</div>
  </div>`;

  h += `<h2 class="sect">Contract cover</h2><div class="card" style="margin:0">
    <div class="between"><div class="b">${pc(bld.contract)} on annual contract</div><div class="xs mut">${pc(1-bld.contract)} spot</div></div>

  </div>`;

  h += `<h2 class="sect">Economics per sailing</h2><div class="card" style="margin:0">
    ${kv(T("headhaul","Headhaul"), Math.round(plan.hhTeu).toLocaleString()+" TEU @ $"+Math.round(plan.hhRate))}
    ${kv("Backhaul", Math.round(plan.bhTeu).toLocaleString()+" TEU @ $"+Math.round(plan.bhRate))}

    ${kv(T("thc","Terminal handling"), "−"+money0(plan.thc), "neg")}
    ${kv("Port disbursements", "−"+money0(plan.daCost), "neg")}
    ${plan.tolls?kv("Canal tolls", "−"+money0(plan.tolls), "neg"):""}
    ${kv("Empty repositioning", "−"+money0(plan.emptyCost), "neg")}

function idxVisible(k){

}

let buyLtv = 0.5;
function sheetBuy(id){
  const o = S.snp.find(x=>x.id===id); if(!o) return;
  const c = CLASSES[o.cls];
  const debt = Math.min(buyLtv, CFG.FIN.maxLtv)*o.ask;
  const fees = o.ask*(CFG.SNP.brokerage+CFG.SNP.inspection);
  const cash = o.ask - debt + fees;
  const rate = loanRate();
  const svc = debt>0 ? debt*rate/365 + debt/(CFG.FIN.termYears*365) : 0;
  const tce = spotTce(o.cls, MKT);
  showSheet(c.name, `${o.age} years · ${esc(PORTS[o.port].name)}`,
    `<div class="card" style="margin:0 0 12px">
      ${kv("Asking price", money(o.ask))}

      ${kv("Debt service", money0(svc)+"/day", "neg")}

function vCompany(){
  const L = S.ledger, debt = totalDebt(), assets = fleetValue(), eq = equity();
  const fleetDays = S.ships.reduce((a,s)=>a+s.lifeDays,0);
  const fleetGvp = S.ships.reduce((a,s)=>a+s.lifeGvp,0);
  const result = L.freight+L.hire+L.demurrage+L.liner
                -(L.bunkers+L.portDA+L.tolls+L.war+L.carbon+L.opex+L.interest+L.survey+L.psc+L.penalties+L.tax);

  let h = "";
  if(S.cov) h += `<div class="card" style="border-color:var(--neg);background:rgba(224,82,82,.08)">
    <div class="b neg">${T("covenant","Covenant")} breach — ${Math.max(0,Math.ceil(S.cov.until-S.day))} days to cure</div>
    <div class="sm mut" style="margin-top:5px">Sell tonnage or raise cash. If the cure period expires the bank takes the fleet bar one ship and the run continues from there.</div></div>`;

  h += `<h2 class="sect" ${S.cov?"":'style="margin-top:2px"'}>Balance sheet</h2><div class="card">
    ${kv("Cash", money(S.cash), cls_pn(S.cash))}
    ${kv("Fleet market value", money(assets))}
    ${S.orders.length?kv("Newbuild deposits paid", money(S.orders.reduce((a,o)=>a+o.paid,0))):""}
    ${kv("Debt", "−"+money(debt), "neg")}
    ${kvt("Net equity", money(eq), cls_pn(eq))}
    ${debt>0?kv(T("ltv","LTV"), pc(debt/Math.max(1,assets)), debt/assets>0.7?"haz":"")+kv("Credit rating", S.rating):""}
  </div>`;

  h += `<h2 class="sect">Profit &amp; loss — to date</h2><div class="card">
    ${L.freight?kv("Net freight", money(L.freight)):""}
    ${L.hire?kv("Charter hire", money(L.hire)):""}
    ${L.liner?kv("Liner services", money(L.liner), cls_pn(L.liner)):""}
    ${Math.abs(L.demurrage)>100?kv(T("demurrage","Demurrage")+" net", money(L.demurrage,L.demurrage>0), cls_pn(L.demurrage)):""}
    ${kv(T("bunkers","Bunkers"), "−"+money(L.bunkers), "neg")}
    ${kv(T("da","Port disbursements"), "−"+money(L.portDA), "neg")}
    ${L.tolls?kv("Canal tolls", "−"+money(L.tolls), "neg"):""}
    ${L.war?kv(T("warrisk","War risk"), "−"+money(L.war), "neg"):""}
    ${L.carbon?kv("Carbon", "−"+money(L.carbon), "neg"):""}
    ${kv(T("opex","OPEX"), "−"+money(L.opex), "neg")}
    ${L.survey?kv("Surveys and drydock", "−"+money(L.survey), "neg"):""}
    ${L.psc?kv(T("psc","PSC")+" deficiencies", "−"+money(L.psc), "neg"):""}
    ${L.penalties?kv("COA penalties", "−"+money(L.penalties), "neg"):""}
    ${kv("Interest", "−"+money(L.interest), "neg")}
    ${L.tax?kv("Tax", "−"+money(L.tax), "neg"):""}
    ${Math.abs(L.derivatives)>100?kv("Derivatives", money(-L.derivatives, -L.derivatives>0), cls_pn(-L.derivatives)):""}
    ${kvt("Result", money(result), cls_pn(result))}
    ${kv("Principal repaid", "−"+money(L.principal), "mut")}
  </div>`;

  h += `<h2 class="sect">Fleet KPIs</h2><div class="card">
    ${kv("Vessels", S.ships.length + (S.orders.length?` (+${S.orders.length} on order)`:""))}
    ${kv("Voyages completed", S.voyagesDone)}
    ${kv("Utilisation", pc(utilisation()))}
    ${fleetDays>0?kv("Fleet "+T("tce","TCE"), money(fleetGvp/fleetDays)+"/day"):""}
    ${kv("Average OPEX", money0(S.ships.reduce((a,s)=>a+opexDay(shipCls(s),shipAge(s))*(s.flagMult||1),0)/Math.max(1,S.ships.length))+"/day")}
    ${kv("Reputation", pc(S.rep), S.rep>0.6?"pos":S.rep<0.4?"neg":"")}
    ${has("cii")?kv("Fleet "+T("cii","CII"), ciiSpread()):""}
    ${S.ships.some(s=>s.offHireDays>0.1)?kv(T("offhire","Off-hire to date"), days1(S.ships.reduce((a,s)=>a+s.offHireDays,0)), "neg"):""}
  </div>`;

  if(S.daily.length>4) h += `<h2 class="sect">Cash and equity</h2><div class="card">${cashChart()}</div>`;

  h += `<h2 class="sect">Reference</h2>
    <button class="btn" style="margin-bottom:8px" onclick="sheetGlossary()">Glossary — ${Object.keys(GLOSSARY).length} terms</button>
    <button class="btn" style="margin-bottom:8px" onclick="sheetSettings()">Settings &amp; save</button>`;
  h += `<div style="text-align:center;margin:22px 0 6px"><span id="ver">Kription v${CFG.VERSION}${S.debug?" · debug":""}</span></div>`;
  return h;
}
function ciiSpread(){
  const c = {}; for(const s of S.ships) c[s.ciiRating] = (c[s.ciiRating]||0)+1;
  return ["A","B","C","D","E"].filter(k=>c[k]).map(k=>`${c[k]}×${k}`).join(" ") || "—";
}

function sheetEvent(qid){

/* ==========================================================================
   UNLOCKS — layer the systems in, and say why each now matters
   ========================================================================= */
function onUnlockCheck(){
  const n = S.voyagesDone;
  const c = (k,t,b)=>{ if(n>=k) coach("u"+k+t.slice(0,4), t, b); };
  if(n>=CFG.UNLOCK.bunkers) coach("u_bunkers","Bunkers are yours to buy","Fuel is the biggest voyage cost you control. Prices differ by hundreds of dollars a tonne between ports — lift where it is cheap. Each idle ship has a <b>Bunker</b> button.");
  if(n>=CFG.UNLOCK.ballast) coach("u_ballast","Watch the empty leg","Getting to the cargo costs fuel and days and earns nothing. Cards now show the ballast leg and how much cargo is on offer where the voyage <i>ends</i>. Discharging into a dead end is how a good rate becomes a bad quarter.");
  if(n>=CFG.UNLOCK.eca) coach("u_eca","Emission control areas","Inside an ECA you must burn 0.1% sulphur MGO, about a third dearer than VLSFO. Short Baltic and North Sea trades burn it the whole way.");
  if(n>=CFG.UNLOCK.speed) coach("u_speed","Now choose your speed","Consumption rises with roughly the cube of speed, so two knots off can cut daily burn by a third — at the cost of days. Which way is right depends on the freight rate and the bunker price, and it moves.");
  if(n>=CFG.UNLOCK.market) coach("u_market","The market has a shape","The Market tab is open. Freight runs in cycles of four to five years and the segments do not move together. Knowing where you are in the cycle is what separates an owner from an operator.");
  if(n>=CFG.UNLOCK.demurrage) coach("u_dem","Laytime and demurrage","Charter parties allow a fixed time for cargo work. Beat it and the charterer pays you demurrage; run over and you hand back despatch.");
  if(n>=CFG.UNLOCK2.canal) coach("u_canal","Canal or the Cape","Suez and Panama save thousands of miles and charge for it on your tonnage. Every fixture now lets you choose, and for a big ship in a soft market the Cape is sometimes cheaper. Panama simply will not take a Capesize.");
  if(n>=CFG.UNLOCK2.timecharter) coach("u_tc","Charter her out","You can now fix a ship on time charter: a fixed rate per day, the charterer pays bunkers and port costs. Long charters price off where the market expects to be — above spot in a slump, below it in a boom. Certainty has a price.");
  if(n>=CFG.UNLOCK2.survey) coach("u_survey","Class is not optional","Intermediate surveys fall every two and a half years, special surveys every five. Weeks in drydock earning nothing, and a bill that grows with age and neglect. You can defer once. It costs you.");
  if(n>=CFG.UNLOCK2.psc) coach("u_psc","Port State Control","Inspectors board and check her against the conventions. A hard-run ship on a weak flag gets boarded more and detained more, and detention follows your name.");
  if(n>=CFG.UNLOCK2.cii) coach("u_cii","Carbon intensity","Every ship now carries a CII rating from A to E, tightened annually. Idle time and fast steaming both hurt it, and charterers pay less for a poor one. Slow down, or fit an efficiency package.");
  if(n>=CFG.UNLOCK2.sandp) coach("u_snp","Buy low, sell high","The Yard is open. Ship values move with the cycle but less than rates, and they are floored by scrap. Over ten years, trading tonnage well is worth more than trading freight well — and it is the part most players never learn.");
  if(n>=CFG.UNLOCK2.flag) coach("u_flag","Flag and tonnage tax","Registry is a real lever. NIS and Malta tax the tonnage rather than the profit — enormous in a boom — and cost you a dearer crew every single day. NOR buys the finest reputation in the business and charges properly for it.");
  if(n>=CFG.UNLOCK2.newbuild) coach("u_nb","Order from a yard","A newbuild takes two to three years. You are buying the market as it will be, not as it is.");
  if(n>=CFG.UNLOCK2.coa) coach("u_coa","Contracts of affreightment","Commit to lifting a number of cargoes over a period and fill your programme at a known rate. Fail to perform and you pay for the shortfall.");
  if(n>=CFG.UNLOCK2.tanker) coach("u_tanker","Wet cargo","Tankers work on Worldscale — a fixed reference rate per route, fixed at a percentage of it. Oil majors vet before they load, and a ship that fails is shut out of the best business whatever she bids.");
  if(n>=CFG.UNLOCK2.hedging) coach("u_ffa","Paper","FFAs let you lock in today's index for tonnage you have not fixed, and bunker swaps fix your fuel cost ahead. The forward curve already expects reversion, so you cannot simply sell the top at the top.");
  if(n>=CFG.UNLOCK2.container) coach("u_box","Container tonnage","You can own boxships. Charter them to liner operators for a steady return, or — once you have enough of them — run your own service.");
  if(n>=CFG.UNLOCK2.special) coach("u_spec","Specialised tonnage","Gas, car carriers, reefers, project cargo, offshore support and live fish carriers. Thin markets, high day rates, and some of them will only work for you under a Norwegian flag.");
  if(n>=CFG.UNLOCK2.liner) coach("u_liner","Run a service","Open the Charter tab's Services section. Pick a lane and a frequency and the game works out the string: round voyage divided by frequency. Slow the service down and you need <b>more</b> ships — but the whole string burns far less fuel. That trade is the heart of container shipping.");
}

function forceMkt(v){
  for(const k of Object.keys(MKT.idx)){
    const s = MKT.idx[k];
    s.v = v; s.noise = 0;
    // put the cycle phase where it would need to be to produce this level
    const want = clamp((v/100 - 1)/CFG.MKT.amp, -1, 1);
    s.phase = Math.asin(want);
  }
  snapshotMarket(); dirty(); toast("Market forced to "+v, "warn");
}

  const sh = S.ships[Math.floor(MKT.rnd()*S.ships.length)]; if(!sh) return;

  if(ev.psc){ maybePsc(sh,false); hideSheet(); return; }
  S.events.push({ evId:ev.id, shipId:sh.id, day:S.day, id:"E"+(S.nextId++) });
  hideSheet(); S.tab="fleet"; dirty();
}

let lastT = 0, acc = 0;
function frame(t){
  if(!lastT) lastT = t;
  const dtMs = Math.min(t - lastT, 250);   // a backgrounded tab must not lurch
  lastT = t;

  if(!S.paused && !S.bust){
    acc += dtMs;
    const step = 40;                        // sim at 25 Hz, render on demand
    while(acc >= step){
      simDays((step/1000)/CFG.SEC_PER_DAY * S.speed, false);
      acc -= step;
    }
  }

  if(!S.paused && S.events.length) autoResolveStale();

  // The top bar is cheap and always live; the screen only redraws when dirty.
  renderTop();
  if(_dirty || !sheetOpen && S.tab === "fleet"){
    if(_dirty){ snapshotMarket(); render(); _dirty = false; }
    else updateFleetProgress();
  }
  requestAnimationFrame(frame);
}

/* Cheap in-place progress update so the Fleet tab animates without a full
   re-render — a 40-ship fleet is 40 style writes, not 40 DOM rebuilds. */
function updateFleetProgress(){
  const cards = $("screen").querySelectorAll(".card .bar.pos > i");
  let i = 0;
  for(const sh of S.ships){
    if(!sh.voyage) continue;
    const el = cards[i++]; if(!el) break;
    el.style.width = pc(clamp(sh.voyage.elapsed/sh.voyage.plan.days, 0, 1));
  }
}

/* --- persistence hooks --------------------------------------------------- */
setInterval(()=>{ if(!S.bust) save(); }, CFG.AUTOSAVE_MS);
// Non-Fleet tabs hold live numbers (board, indices, P&L) but don't animate;
// a slow repaint keeps them current without rebuilding the DOM every frame.
setInterval(()=>{ if(!S.paused && !sheetOpen && S.tab !== "fleet") dirty(); }, 700);
window.addEventListener("pagehide", save);
window.addEventListener("visibilitychange", ()=>{ if(document.hidden) save(); });

/* --- start --------------------------------------------------------------- */
(function boot(){
  // storage probe
  try { localStorage.setItem("__k","1"); localStorage.removeItem("__k"); }
  catch(e){ hasStorage = false; }

  const resumed = tryLoad();
  if(!resumed) newGame();

  let off = null;
  if(resumed) off = applyOffline();

  snapshotMarket();
  render();
  requestAnimationFrame(frame);

  if(off && off.completed >= 0 && off.days >= 0.5){
    sheetAway(off);
    if(S.ships.some(s=>s.status === "idle" && (!s.emp || s.emp.type === "spot")))
      autoPause("Ships idle since you were away");
  }
  else if(!resumed){
    coach("welcome", "One ship, and a mortgage",
      `You own <b>${esc(S.ships[0].name)}</b> — a ${shipAge(S.ships[0])}-year-old Handysize bulker lying at Riga, and ${money(S.cash)} in the bank. Running costs are charged every day whether she is working or not. Find her a cargo.`);
  }
  if(!hasStorage) showBanner("Browser storage unavailable — this session is memory-only. Use Export Save in Company to keep your run.");
})();

function sheetAway(off){
  const rows = off.voyages.length
    ? off.voyages.map(e=>`<div class="card" style="margin-bottom:8px;padding:11px 13px">
        <div class="between"><div class="grow trunc">
          <div class="sm b trunc">${esc(e.loadName)} → ${esc(e.dischName)}</div>
          <div class="xs mut2">${esc(e.shipName)} · ${days1(e.days)}</div>
        </div><div style="text-align:right">
          <div class="b ${cls_pn(e.gvp)}">${money(e.gvp,e.gvp>0)}</div>
          <div class="xs mut2 mono">${money(e.tce)}/d</div>
        </div></div></div>`).join("")
    : `<div class="mut sm">No voyages completed — nothing was due to finish.</div>`;

  const idle = S.ships.filter(s=>s.status==="idle").length;
  showSheet("While you were away",
    `${days1(off.days)} elapsed${off.capped?` — capped from ${days1(off.wantedDays)}`:""}`,
    `<div class="card" style="margin:0 0 12px;text-align:center;padding:14px">
      <div class="xs mut2">Cash movement</div>
      <div class="xl bb ${cls_pn(off.cashDelta)}">${money(off.cashDelta, off.cashDelta>0)}</div>
      <div class="sm mut">after running costs and debt service</div>
    </div>
    <h2 class="sect" style="margin-top:0">Voyages completed</h2>${rows}
    ${idle?`<div class="card" style="margin-top:12px">
      <div class="sm">${idle} ship${idle===1?" is":"s are"} now idle and earning nothing. The game never fixes cargo for you — that decision is always yours.</div></div>`:""}`,
    `<button class="btn pri" onclick="hideSheet()">Continue</button>`);
}
</script>
