  if(S.cov) h += `<div class="card" style="border-color:var(--neg);background:rgba(224,82,82,.08)">
    <div class="between"><div class="b neg">Covenant breach</div>
      <span class="pill bad">${Math.max(0,Math.ceil(S.cov.until-S.day))}d to cure</span></div>
    <div class="sm mut" style="margin-top:5px">${T("covenant","Loan-to-value")} ${pc(S.cov.ltv)} against an 80% ceiling. Sell tonnage or raise cash before the cure period expires.</div>
  </div>`;

  const idle = S.ships.filter(s=>s.status==="idle" && (!s.emp||s.emp.type==="spot"));
  h += `<h2 class="sect">Fleet — ${S.ships.length} vessel${S.ships.length===1?"":"s"}</h2>`;
  for(const sh of S.ships) h += shipCard(sh);

  if(S.orders.length){
    h += `<h2 class="sect">On order</h2>`;
    for(const o of S.orders) h += `<div class="card">
      <div class="between"><div><div class="b">${CLASSES[o.cls].name}</div>
        <div class="xs mut2">${o.eco?"Eco design · ":""}${o.dualFuel?o.dualFuel+" dual fuel · ":""}${money(o.price)}</div></div>
        <div style="text-align:right"><div class="sm b acc">${Math.max(0,Math.ceil(o.deliveryDay-S.day))}d</div>
          <div class="xs mut2">${dateFull(o.deliveryDay)}</div></div></div>
      <div class="bar" style="margin-top:8px"><i style="width:${pc(clamp(1-(o.deliveryDay-S.day)/CFG.SNP.nbLagDays[1],0,1))}"></i></div>
    </div>`;
  }
  if(S.services.length){
    h += `<h2 class="sect">Liner services</h2>`;
    for(const svc of S.services) h += serviceCard(svc);
  }
  if(idle.length){
    h += `<div style="margin-top:14px"><button class="btn pri ${S.voyagesDone<2?"pulse":""}" onclick="goCharter()">
      Find employment${idle.length>1?` — ${idle.length} ships open`:""}</button></div>`;
  }
  if(S.log.length){
    h += `<h2 class="sect">Recent voyages</h2>`;
    for(const e of S.log.slice(0,4)) h += logCard(e);
    if(S.log.length>4) h += `<button class="btn sm" style="width:100%;margin-top:2px" onclick="sheetAllVoyages()">All ${S.log.length} voyages</button>`;
  }
  h += positionCard();
  return h;
}

/* The three numbers that decide whether a run survives: what the company costs
   to exist, what it is earning, and how long the cash lasts at that rate. It
   closes every Fleet screen, so the opening position is never a bare button on
   an empty page and the question "where is my money going" has an answer that
   is always one tap away. */
/* Runway in the unit the player can act on. Under a quarter, days matter and
   are worth counting; beyond three years the exact number is noise, and quoting
   "11,075 days" would be false precision about a rate that will not hold. */
function runwayText(d){
  if(d < 120)  return Math.floor(d) + " days at this rate";
  if(d < 1095) return (d/365).toFixed(1) + " years at this rate";
  return "Over three years";
}
function positionCard(){
  const base = costBaseDay(), earn = earnDay(), net = earn - base;
  const runway = net < -1 ? S.cash/-net : null;
  const working = S.ships.filter(s=>s.status!=="idle").length;
  return `<h2 class="sect">Position</h2><div class="card">
    ${kv("Cost base", money0(base)+"/day", "neg")}
    ${kv("Earning", earn>0.5 ? money0(earn)+"/day"
        : S.ships.some(s=>s.layup) ? "nothing — the fleet is laid up"
        : "nothing — every ship is idle", earn>0.5?"pos":"haz")}
    ${kvt("Net", (net>0?"+":"")+money0(net)+"/day", cls_pn(net))}
    ${runway !== null
      ? kv("Cash lasts", runwayText(runway), runway < 45 ? "neg" : runway < 120 ? "haz" : "")
      : kv("Cash", money(S.cash)+" and building", "pos")}
    <div class="xs mut2" style="margin-top:7px">Cost base is ${T("opex","OPEX")}, registry fees, the shore organisation and debt service${S.ships.some(s=>s.lease)?", plus bareboat hire on leased tonnage":""} — it runs whether ${working===S.ships.length&&working>0?"or not they are":"a ship is"} working. Earnings are ${T("tce","TCE")} for ships at sea and hire for ships on charter.</div>
  </div>`;
}

function eventStrip(){
  return S.events.map(q=>{
    const ev = EVENTS.find(e=>e.id===q.evId), sh = S.ships.find(s=>s.id===q.shipId);
    if(!ev || !sh) return "";
    return `<div class="card tap" style="border-color:var(--haz);background:rgba(240,138,36,.08)"
       onclick="sheetEvent('${q.id}')">
      <div class="between"><div class="grow trunc"><div class="b haz trunc">${esc(ev.title)}</div>
        <div class="xs mut2 trunc">${esc(sh.name)} — a decision is needed</div></div>
        <span class="pill warn">Decide</span></div></div>`;
  }).join("");
}

function shipCard(sh){
  const cls = shipCls(sh), v = sh.voyage, age = shipAge(sh);
  let pill, line2, prog = "";

  if(sh.layup){
    const L = sh.layup;
    pill = `<span class="pill">${L.state==="laid"?"Laid up":L.state==="going"?"Laying up":"Reactivating"}</span>`;
    line2 = L.state === "laid"
      ? `Laid up at ${esc(PORTS[L.port].name)} · ${days1(S.day-L.since)} · saving ${money0(layupSavingDay(sh))}/day`
      : `${L.state==="going"?"Going into lay-up":"Coming out of lay-up"} · ${days1(Math.max(0,L.left))} remaining`;
    if(L.state !== "laid") prog = `<div class="bar" style="margin-top:9px"><i style="width:${
      pc(clamp(1-L.left/(L.state==="going"?CFG.LAYUP.inDays:CFG.LAYUP.outDays),0,1))}"></i></div>`;
  } else if(sh.dd){
    pill = `<span class="pill warn">Drydock</span>`;
    line2 = `${sh.dd.type==="SS"?"Special survey":sh.dd.type==="IS"?"Intermediate survey":"Retrofit"} · ${days1(sh.dd.left)} remaining`;
    prog = `<div class="bar warn" style="margin-top:9px"><i style="width:${pc(1-sh.dd.left/sh.dd.days)}"></i></div>`;
  } else if(v){
    const p = v.plan, ph = phaseOf(v);
    pill = `<span class="pill on">${{ballast:"Ballast",loading:"Loading",laden:"Laden",discharging:"Discharging"}[ph.name]}</span>`;
    line2 = `${esc(p.loadName)} → ${esc(p.dischName)} · ${days1(Math.max(0,p.days+(v.act.extra||0)-v.elapsed))} to go · <span class="${cls_pn(p.netCash)}">${money(p.netCash, p.netCash>0)}</span>`;
    prog = `<div class="bar pos" style="margin-top:9px"><i style="width:${pc(clamp(v.elapsed/(p.days+(v.act.extra||0)),0,1))}"></i></div>`;
  } else if(sh.emp && sh.emp.type !== "spot"){
    pill = `<span class="pill on">On hire</span>`;
    line2 = empLabel(sh) + ` · to ${dateFull(sh.emp.endDay||S.day)}`;
  } else {
    pill = `<span class="pill idle">Idle</span>`;
    const p = PORTS[sh.port];
    line2 = `At ${esc(p.name)} · cargo on offer ${p.liq>0.75?"strong":p.liq>0.5?"moderate":p.liq>0.3?"thin":"very thin"}`;
  }

  const nx = has("survey") ? nextSurvey(sh) : null;
  const ddIn = nx ? Math.round(nx.due - S.day) : null;
  const chips = [pill, ciiPill(sh)];
  if(ddIn !== null && ddIn < 60) chips.push(`<span class="pill ${ddIn<0?"bad":"warn"}">${nx.type} ${ddIn<0?"overdue":"in "+ddIn+"d"}</span>`);
  if(sh.detentions) chips.push(`<span class="pill bad">${sh.detentions} detention${sh.detentions>1?"s":""}</span>`);

  const rob = Math.round(robTot(sh)), fuelPct = rob/cls.fuelCap;
  return `<div class="card tap" onclick="sheetShip(${sh.id})">
    <div class="between"><div class="grow">
      <div class="b trunc">${esc(sh.name)}</div>
      <div class="xs mut2 trunc">${cls.name} · ${capLabel(cls)} · ${age}yr${
        // The registry only earns a place on the card when it is a decision the
        // player made. Marshall Islands on every hull is just noise, and it was
        // pushing the useful half of the line into an ellipsis.
        sh.flag && sh.flag !== "marshall" ? " · "+FLAGS[sh.flag].short : ""}</div>
    </div><div style="text-align:right;flex:none">${chips.join(" ")}</div></div>
    <div class="sm mut trunc" style="margin-top:7px">${line2}</div>
    ${prog}
    ${has("bunkers") && !sh.dd && (!sh.emp || sh.emp.type==="spot" || sh.emp.type==="tc") ? `
    <div class="row xs mut2" style="margin-top:8px;gap:6px">
      <span>Bunkers</span>
      <div class="bar ${fuelPct<0.18?"bad":fuelPct<0.35?"warn":""}" style="flex:1;max-width:74px"><i style="width:${pc(clamp(fuelPct,0,1))}"></i></div>
      <span class="mono">${rob} mt</span>
      <div class="bar ${sh.hull<0.6?"bad":sh.hull<0.78?"warn":"pos"}" style="flex:1;max-width:52px"><i style="width:${pc(sh.hull)}"></i></div>
      <span class="mono">hull</span>
      ${!v && !sh.layup?`<button class="btn sm" style="margin-left:auto;padding:0 12px"
        onclick="event.stopPropagation();sheetBunker(${sh.id})">Bunker</button>`:""}
    </div>`:""}
  </div>`;
}
function capLabel(cls){
  if(cls.teu) return cls.teu.toLocaleString()+" TEU";
  if(cls.cbm) return cls.cbm.toLocaleString()+" m³";
  if(cls.ceu) return cls.ceu.toLocaleString()+" CEU";
  if(cls.bollard) return cls.bollard+"t BP";
  return cls.dwt.toLocaleString()+" dwt";
}

/* --- vessel sheet -------------------------------------------------------- */
function sheetShip(id){
  const sh = S.ships.find(s=>s.id===id); if(!sh) return;
  const cls = shipCls(sh), age = shipAge(sh);
  const val = assetValue(sh.cls, age, MKT);
  const nx = nextSurvey(sh);
  let h = "";

  if(sh.voyage){
    const p = sh.voyage.plan, ph = phaseOf(sh.voyage), v = sh.voyage;
    h += `<div class="card" style="margin:0 0 12px">
      <div class="between"><div class="mut sm">Current voyage</div><span class="pill on">${ph.name}</span></div>
      <div class="b" style="margin-top:4px">${esc(p.loadName)} → ${esc(p.dischName)}</div>
      <div class="xs mut2">${CARGOES[v.fx.cargo].name} · ${Math.round(p.qtyOut).toLocaleString()} ${p.unit}${p.hireMode?" · on hire":` · ${v.fx.ws?"WS "+v.fx.ws:"$"+v.fx.rate.toFixed(2)}`}</div>
      <div class="bar pos" style="margin-top:9px"><i style="width:${pc(clamp(v.elapsed/(p.days+(v.act.extra||0)),0,1))}"></i></div>
      <button class="btn sm" style="width:100%;margin-top:10px" onclick="sheetEstimate(${sh.id})">Voyage breakdown</button>
    </div>`;
  }
  if(sh.dd) h += `<div class="card" style="margin:0 0 12px;border-color:var(--haz)">
    <div class="b haz">${sh.dd.type==="SS"?"Special survey":sh.dd.type==="IS"?"Intermediate survey":"Retrofit"}</div>
    <div class="sm mut" style="margin-top:4px">${days1(sh.dd.left)} to go. ${sh.emp&&sh.emp.type!=="spot"?"She is off-hire, so the charterer is paying nothing.":"Earning nothing."}</div>
    ${sh.dd.attended
      ? `<div class="xs pos" style="margin-top:6px">A ${T("superint","superintendent")} is attending — 15% off the time in dock and a better job done.</div>`
      : (S.office&&S.office.mode==="inhouse"&&(S.office.staff.technical||0)>0
        ? `<button class="btn sm" style="width:100%;margin-top:9px" onclick="attendDrydock(${sh.id})">Send a superintendent — $24k</button>`
        : `<div class="xs mut2" style="margin-top:6px">With your own technical department you could send a ${T("superint","superintendent")} to attend.</div>`)}
  </div>`;

  h += `<h2 class="sect" style="margin-top:0">Employment</h2><div class="card" style="margin:0">
    ${kvs("Status", empLabel(sh))}
    ${sh.emp&&sh.emp.endDay?kv("Redelivery", dateFull(sh.emp.endDay)):""}
    ${sh.emp&&sh.emp.earned?kv("Hire earned", money(sh.emp.earned)):""}
    ${sh.emp&&sh.emp.offHire?kv(T("offhire","Off-hire"), days1(sh.emp.offHire), "neg"):""}
    ${kv("Voyages completed", sh.voyages)}
    ${sh.lifeDays>0?kv("Lifetime "+T("tce","TCE"), money(sh.lifeGvp/sh.lifeDays)+"/day"):""}
  </div>`;

  if(has("cii") || has("survey") || has("psc")){
    h += `<h2 class="sect">Class and compliance</h2><div class="card" style="margin:0">
      ${has("cii")?kv(T("cii","CII rating"), sh.cii && sh.cii.nm > 100
        ? `<span class="${sh.ciiRating==="E"?"neg":sh.ciiRating==="D"?"haz":"pos"}">${sh.ciiRating}</span> — ${T("aer","AER")} ${(sh.ciiAer||0).toFixed(2)} vs ${(sh.ciiReq||0).toFixed(2)} required`
        : `<span class="mut">No rating yet — she has not sailed this year</span>`):""}
      ${sh.capPlan?`<div class="xs haz" style="padding:4px 0">A corrective action plan is required. Charterers are already pricing her lower — retrofit or slow her down.</div>`:""}
      ${has("survey")?kv("Next "+(nx.type==="SS"?T("special","special survey"):"intermediate survey"),
          `${dateFull(nx.due)} · ${money(surveyCost(sh,nx.type))} · ${days1(surveyDays(sh,nx.type))}`):""}
      ${kv("Hull condition", pc(sh.hull), sh.hull<0.6?"neg":sh.hull<0.78?"haz":"pos")}
      ${has("psc")?kv(T("psc","PSC inspections"), `${sh.pscCount} · ${sh.detentions} detention${sh.detentions===1?"":"s"}`, sh.detentions?"neg":""):""}
      ${kv(T("flag","Flag"), FLAGS[sh.flag].name)}
      ${kv(T("classoc","Class"), CLASS_SOC[sh.classSoc].name)}
      ${cls.seg==="tanker"?kv(T("vetting","Vetting score"), `${vettingScore(sh)} / ${CFG.VET.gate} needed`, vettingScore(sh)>=CFG.VET.gate?"pos":"neg"):""}
    </div>`;
  }

  h += `<h2 class="sect">Particulars</h2><div class="card" style="margin:0">
    ${kv("Class", cls.name)}
    ${kv(T("dwt","Deadweight"), cls.dwt.toLocaleString()+" mt")}
    ${cls.teu?kv("Capacity", cls.teu.toLocaleString()+" TEU"+(cls.reefer?` · ${cls.reefer} reefer plugs`:"")):""}
    ${cls.cbm?kv("Cargo capacity", cls.cbm.toLocaleString()+" m³"):""}
    ${cls.ceu?kv("Capacity", cls.ceu.toLocaleString()+" CEU"):""}
    ${kv("Summer "+T("draft","draft"), cls.draft.toFixed(1)+" m")}
    ${kv("Beam", cls.beam.toFixed(1)+" m")}
    ${kvs("Canals", canalNote(cls))}
    ${kv("Cargo gear", cls.geared?`${T("geared","Geared")} — ${cls.swl}t`:"Gearless")}
    ${cls.ice?kv(T("iceclass","Ice class"), ["","1C","1A","1A Super"][cls.ice]):""}
    ${kv("Built", sh.built+" · "+age+" years")}
    ${kv("Design speed", cls.designSpeed.toFixed(1)+" kn")}
    ${sh.scrubber?kv(T("scrubber","Scrubber"),"Fitted — HSFO available","pos"):""}
    ${sh.eco?kv("Eco design", `−${pc(CFG.SNP.nbEcoGain)} consumption`,"pos"):""}
    ${sh.retrofit?kv("Efficiency package", `−${pc(CFG.CII.retrofitGain)} consumption`,"pos"):""}
  </div>`;

  h += `<h2 class="sect">Consumption curve</h2><div class="card" style="margin:0">
    <div class="xs mut" style="margin-bottom:8px">Laden burn, mt/day. ${T("slowsteam","Consumption rises with roughly the cube of speed")}.</div>
    ${consTable(cls)}</div>`;

  h += `<h2 class="sect">Bunkers on board</h2><div class="card" style="margin:0">
    ${Object.entries(sh.rob).filter(([g,mt])=>mt>0.5).map(([g,mt])=>
      kv(T(g,CFG.FUEL[g].name), Math.round(mt).toLocaleString()+" mt @ "+money0(sh.robCost[g]||0)+"/mt")).join("") || `<div class="mut sm">Tanks empty.</div>`}
    ${kv("Capacity", cls.fuelCap.toLocaleString()+" mt")}</div>`;

  h += `<h2 class="sect">Commercial</h2><div class="card" style="margin:0">
    ${kv("Market value", money(val))}
    ${kv("Daily "+T("opex","OPEX"), money0(opexDayFull(cls,age,sh)) + (sh.flagMult!==1?` (${FLAGS[sh.flag].name} ${sh.flagMult>1?"+":""}${Math.round((sh.flagMult-1)*100)}%)`:""))}
    ${sh.hull < expectedHull(age)-0.005?kv("Condition penalty", "+"+pc(clamp(expectedHull(age)-sh.hull,0,1)*0.6)+" on OPEX — she is below condition for her age", "haz"):""}
    ${sh.debt?kv("Mortgage", money(sh.debt.principal)+" @ "+pc(sh.debt.rate)):kv("Mortgage","None")}
    ${sh.debt?kv(T("ltv","LTV"), pc(sh.debt.principal/val), sh.debt.principal/val>0.7?"haz":""):""}
    ${kv("Scrap value", money(scrapValue(sh.cls, MKT)))}
  </div>`;

  // Lay-up gets its own block because in a bust it is the most important
  // decision on the screen, and it needs its arithmetic shown.
  if(sh.layup) h += layupCard(sh);
  else if(has2("layup") && !sh.voyage && !sh.dd && (!sh.emp || sh.emp.type==="spot"))
    h += `<h2 class="sect">${T("layup","Lay-up")}</h2><div class="card" style="margin:0">
      ${kv("Running cost now", money0(opexDayFull(cls,age,sh))+"/day")}
      ${kv("Laid up she would cost", money0(opexDayFull(cls,age,sh)*CFG.LAYUP.opexShare + cls.gt*CFG.LAYUP.berthPerGtDay)+"/day")}
      ${kvt("Saving", money0(layupSavingDay(sh))+"/day", "pos")}
      ${kv("Costs to bring her back", money(layupCost(sh))+" and "+CFG.LAYUP.outDays+" days", "neg")}
      ${kv("Break-even", Math.ceil(layupCost(sh)/Math.max(1,layupSavingDay(sh)))+" days laid up")}
      <div class="xs mut2" style="margin-top:7px">She earns nothing while she is down, and coming back takes ${CFG.LAYUP.outDays} days — so this is a bet on how long the market stays bad, not a free saving. Steel also deteriorates faster at a lay-up berth than under way.</div>
      <button class="btn sm" style="width:100%;margin-top:10px" onclick="layUp(${sh.id})">Lay her up</button>
    </div>`;

  const acts = [];
  if(sh.status === "idle" && !sh.dd && !sh.layup){
    acts.push(`<button class="btn pri" onclick="hideSheet();goCharter(${sh.id})">Find employment</button>`);
  }
  if(sh.layup && sh.layup.state === "laid"){
    acts.push(`<button class="btn pri" ${layupCost(sh)>S.cash?"disabled":""} onclick="reactivate(${sh.id})">
      ${layupCost(sh)>S.cash?"Cannot afford reactivation":"Bring her back — "+money(layupCost(sh))}</button>`);
  }
  h += `<h2 class="sect">Actions</h2><div class="card" style="margin:0">
    <div class="row" style="gap:6px;flex-wrap:wrap">
    ${has2("flag")?`<button class="btn sm" onclick="sheetFlag(${sh.id})">Reflag</button>`:""}
    ${!sh.scrubber&&!sh.voyage&&!sh.dd?`<button class="btn sm" onclick="sheetRetro(${sh.id},'scrubber')">Fit scrubber</button>`:""}
    ${!sh.retrofit&&!sh.voyage&&!sh.dd&&has("cii")?`<button class="btn sm" onclick="sheetRetro(${sh.id},'eff')">Efficiency package</button>`:""}
    ${has("survey")&&!sh.dd&&nx.due-S.day<0?`<button class="btn sm" onclick="deferSurvey(S.ships.find(s=>s.id===${sh.id}));hideSheet()">Defer survey</button>`:""}
    ${has2("sandp")&&!sh.voyage&&!sh.dd?`<button class="btn sm" onclick="sheetSell(${sh.id})">Sell or scrap</button>`:""}
    </div></div>`;

  showSheet(esc(sh.name), `${cls.name} · ${PORTS[sh.port].name}`, h, acts.join("") || null);
}
function layupCard(sh){
  const L = sh.layup, idx = MKT.idx[shipCls(sh).idx].v;
  if(L.state !== "laid") return `<h2 class="sect">${T("layup","Lay-up")}</h2><div class="card" style="margin:0">
    ${kv(L.state==="going"?"Going into lay-up":"Coming back into service", days1(Math.max(0,L.left))+" remaining")}
  </div>`;
  const down = S.day - L.since, saved = layupSavingDay(sh)*down;
  return `<h2 class="sect">${T("layup","Laid up")}</h2><div class="card" style="margin:0">
    ${kv("At", esc(PORTS[L.port].name)+" · "+days1(down))}
    ${kv("Saved so far", money(saved), "pos")}
    ${kv("Reactivation", money(layupCost(sh))+" and "+CFG.LAYUP.outDays+" days", "neg")}
    ${kvt("Net position", money(saved-layupCost(sh)), cls_pn(saved-layupCost(sh)))}
    ${kv("Her market now", Math.round(idx)+" — "+(idx<70?"still weak":idx<95?"soft but turning":"recovered"),
         idx<70?"neg":idx<95?"haz":"pos")}
    <div class="xs mut2" style="margin-top:7px">${idx>=95
      ? "The market has come back. Every day laid up from here is a day of earnings given away — and it takes five days to get her working again."
      : "Nothing to do but watch the index. Bring her back before the recovery, not after it."}</div>
  </div>`;
}

/* The cycle, said out loud. A one-ship owner meeting their first real bust has
   no way to tell "the market has turned" from "the game is broken", and the
   difference is the entire point of the freight cycle. */
function marketMoodCard(sh){
  const key = shipCls(sh).idx, v = MKT.idx[key].v;
  const hist = (S.mkt.hist[key] || []);
  const mo = hist.length > 6 ? v - hist[hist.length-7] : 0;
  if(v >= 78 && v <= 158) return "";
  const weak = v < 78;
  const moves = [];
  if(weak){
    if(has2("timecharter")) moves.push("fix her out on <b>time charter</b> — a poor rate you are paid every day beats a good rate you cannot find");
    if(has2("layup")) moves.push("put her in <b>lay-up</b> and stop paying to trade a ship that cannot cover her costs");
    if(has2("coa")) moves.push("take a <b>COA</b> and lock in volume across the trough");
    if(has2("sandp")) moves.push("<b>buy</b> — this is when tonnage is cheap, and it is the only time it is");
    if(has2("hedging")) moves.push("sell <b>FFAs</b> against the tonnage you already own");
  } else {
    if(has2("sandp")) moves.push("<b>sell</b> tonnage into the strength — values follow rates, and they follow them up");
    if(has2("timecharter")) moves.push("fix out <b>long</b> at today's rate and keep it after the market goes");
    if(has2("hedging")) moves.push("sell <b>FFAs</b> forward while the curve is high");
  }
  return `<div class="card" style="border-color:var(--${weak?"neg":"pos"});background:rgba(${weak?"224,82,82":"63,178,127"},.07)">
    <div class="between"><div class="b ${weak?"neg":"pos"}">${weak?"The market has turned down":"The market is running hot"}</div>
      <span class="pill ${weak?"bad":"on"}">${INDEX_META[key].short} ${Math.round(v)}</span></div>
    <div class="sm mut" style="margin-top:6px">${weak
      ? `${INDEX_META[key].name} is at ${Math.round(v)} against 100 at mid-cycle${mo<-3?`, down ${Math.abs(mo).toFixed(0)} in a month`:""}. Freight is cyclical and this is the cycle, not a fault — ${T("tce","TCE")} on every cargo on offer will be poor until it turns, and it will turn.`
      : `${INDEX_META[key].name} is at ${Math.round(v)}${mo>3?`, up ${mo.toFixed(0)} in a month`:""}. Good markets end, and the owners who do well are the ones who act while it is still good.`}</div>
    ${moves.length?`<div class="xs mut" style="margin-top:8px">What owners do here: ${moves.join("; ")}.</div>`:""}
  </div>`;
}

function canalNote(cls){
  const a = canalsAllowed(cls, false);
  if(a.has("suez") && a.has("panama")) return "Suez and Panama";
  if(a.has("suez")) return `${T("suez","Suez")} only — too wide for Panama`;
  if(a.has("panama")) return "Panama only";
  return `Neither — ${cls.draft.toFixed(1)} m draft exceeds Suez`;
}

/* ==========================================================================
   CHARTER — spot, time charter, COA, day-rate contracts, liner services
   ========================================================================= */
function goCharter(shipId){
  S.tab = "charter";
  const idle = S.ships.filter(s=>s.status==="idle" && (!s.emp||s.emp.type==="spot"));
  charterShip = shipId || (idle[0] && idle[0].id) || null;
  if(S.voyagesDone === 0)
    coach("pick", "Pick a cargo", "Each card is a firm offer: the cargo, where it loads and discharges, and what you would earn. Tap <b>Fix</b> to take one, or the card itself to see how the number is built.");
  dirty();
}

function vCharter(){
  const idle = S.ships.filter(s=>s.status==="idle" && (!s.emp||s.emp.type==="spot"));
  const tabs = [["spot","Spot"]];
  if(has2("timecharter")) tabs.push(["tc","Charter out"]);
  if(has2("coa")) tabs.push(["coa","COA"]);
  if(has2("liner")) tabs.push(["svc","Services"]);
  let h = tabs.length>1 ? `<div class="seg">${tabs.map(([k,l])=>
    `<button aria-selected="${charterTab===k}" onclick="charterTab='${k}';dirty()">${l}</button>`).join("")}</div>` : "";

  if(charterTab === "coa") return h + vCoa();
  if(charterTab === "svc") return h + vServices();

  if(!idle.length) return h + `<div class="empty"><div class="big">⚓</div>
    <div class="b">Every ship is employed</div>
    <div class="sm mut2" style="margin-top:6px">New business appears as vessels come free. The board turns over about once a week.</div></div>`;

  if(!charterShip || !idle.find(s=>s.id===charterShip)) charterShip = idle[0].id;
  const sh = S.ships.find(s=>s.id===charterShip);
  // Past three or four idle ships the picker stops being a segmented control and
  // becomes a list, so it scrolls sideways rather than crushing every name.
  if(idle.length > 1) h += `<div class="seg${idle.length>3?" scroll":""}">${idle.map(s=>
    `<button aria-selected="${s.id===charterShip}" onclick="charterShip=${s.id};dirty()">${esc(s.name.split(" ").slice(-1)[0])}</button>`).join("")}</div>`;

  h += marketMoodCard(sh);

  const p = PORTS[sh.port];
  h += `<div class="card" style="padding:11px 13px"><div class="between">
    <div><div class="xs mut2">Open at</div><div class="b">${esc(p.name)}</div></div>
    <div style="text-align:right"><div class="xs mut2">${has("ballast")?T("liquidity","Cargo on offer"):"Cargo on offer"}</div>
      <div class="b ${p.liq>0.5?"pos":p.liq>0.3?"haz":"neg"}">${p.liq>0.75?"Strong":p.liq>0.5?"Moderate":p.liq>0.3?"Thin":"Very thin"}</div></div>
  </div></div>`;

  if(charterTab === "tc") return h + vTcOffers(sh);

  const list = S.fixtures.filter(f=>f.forShip===sh.id);
  const dayList = (S.dayOffers||[]).filter(f=>f.forShip===sh.id);
  if(dayList.length){
    h += `<h2 class="sect">Contracts</h2>`;
    for(const o of dayList) h += `<div class="card tap" onclick="sheetDayrate(${sh.id},'${o.id}')">
      <div class="between"><div class="grow trunc"><div class="b trunc">${esc(o.name)}</div>
        <div class="xs mut2">${esc(PORTS[o.base].name)} · ${o.days} days</div></div>
      <div style="text-align:right"><div class="lg b pos">${money0(o.rate)}<span class="sm mut">/d</span></div>
        <div class="xs mut2">${money(o.rate*o.days)} total</div></div></div></div>`;
  }
  if(!list.length && !dayList.length)
    return h + `<div class="empty"><div class="big">📋</div><div class="b">Nothing on the board here</div>
      <div class="sm mut2" style="margin-top:6px">${esc(p.name)} is a thin market for this ship. Wait for the board to turn, or take a ballast leg somewhere busier.</div></div>`;

  if(list.length){
    h += `<h2 class="sect">Cargoes on offer</h2>`;
    for(const f of list){
      const e = voyageEstimate(sh, f, fxSpeed[f.id] ?? (shipCls(sh).designSpeed-1.5), MKT, estOpts(sh));
      h += fixtureCard(sh, f, e);
    }
  }
  return h;
}

/* A fixture is judged against what the ship costs to run, not against zero. The
   card colours TCE on that basis: green clears OPEX with something over, amber
   covers the running cost and little else, red loses money on every day of the
   voyage. This is the comparison the whole industry makes and it is the one the
   headline number on the card should be inviting. */
function tceCls(tce, sh){
  const opex = opexDayFull(shipCls(sh), shipAge(sh), sh);
  return tce > opex*1.35 ? "pos" : tce > opex ? "" : tce > opex*0.55 ? "haz" : "neg";
}
function fixtureCard(sh, f, e){
  const dp = PORTS[f.disch], liq = dp.liq;
  const chips = [];
  if(has("ballast") && e.balDays>0.05) chips.push(`<span class="pill warn">${days1(e.balDays)} ballast</span>`);
  if(has("eca") && e.ecaNm>0) chips.push(`<span class="pill">${T("eca","ECA")} ${Math.round(e.ecaNm/Math.max(1,e.balNm+e.ladNm)*100)}%</span>`);
  if(has2("canal") && Object.keys(e.canals).length) chips.push(`<span class="pill">${Object.keys(e.canals).map(c=>CFG.CANAL[c].name.split(" ")[0]).join("+")}</span>`);
  if(e.warZones.length) chips.push(`<span class="pill bad">War risk</span>`);
  if(f.vetGate) chips.push(`<span class="pill ${vettingScore(sh)>=CFG.VET.gate?"on":"bad"}">${esc(f.major)}</span>`);
  if(e.wcap > S.cash) chips.push(`<span class="pill bad">Needs ${money(e.wcap)} cash</span>`);
  return `<div class="card tap" onclick="sheetFixture(${sh.id},'${f.id}')">
    <div class="between"><div class="grow trunc">
      <div class="b trunc">${esc(e.loadName)} → ${esc(e.dischName)}</div>
      <div class="xs mut2 trunc">${CARGOES[f.cargo].name} · ${Math.round(e.qty).toLocaleString()} ${e.unit} · ${f.ws?"WS "+f.ws:"$"+f.rate.toFixed(2)}</div>
    </div><div style="text-align:right;flex:none">
      <div class="lg b ${tceCls(e.tce, sh)}">${money0(e.tce)}<span class="sm mut">/d</span></div>
      <div class="xs mut2">${money(e.gvp, e.gvp>0)} over ${days1(e.days)}</div></div></div>
    <div class="row" style="margin-top:9px;gap:5px;flex-wrap:wrap">${chips.join("")}</div>
    <div class="between" style="margin-top:9px;gap:10px">
      <div class="xs mut2 grow">Onward cargo from ${esc(dp.name)}: ${
        liq>0.75?"strong":liq>0.5?"moderate":liq>0.3?"thin":'<span class="haz">very thin</span>'}</div>
      <button class="btn pri sm" style="flex:none" onclick="event.stopPropagation();doFix(${sh.id},'${f.id}')">Fix</button>
    </div>
  </div>`;
}

/* --- the second layer: the whole calculation ----------------------------- */
function sheetFixture(shipId, fxId){
  const sh = S.ships.find(s=>s.id===shipId), f = S.fixtures.find(x=>x.id===fxId);
  if(!sh || !f) return;
  renderFixtureSheet(sh, f, fxSpeed[fxId] ?? (shipCls(sh).designSpeed-1.5));
}
function renderFixtureSheet(sh, f, sp){
  const cls = shipCls(sh);
  const e = voyageEstimate(sh, f, sp, MKT, estOpts(sh));
  const opt = has("speed") ? optimalSpeed(sh, f, MKT, estOpts(sh)) : null;
  const lp = PORTS[f.load], dp = PORTS[f.disch];
  const rr = `renderFixtureSheet(S.ships.find(s=>s.id===${sh.id}),S.fixtures.find(x=>x.id==='${f.id}')`;
  let h = "";

  h += `<div class="card" style="margin:0 0 12px;text-align:center;padding:15px">
    <div class="xs mut2">${S.voyagesDone>=1?T("tce","Time charter equivalent"):"Earnings per day"}</div>
    <div class="xl bb ${cls_pn(e.tce)}" style="margin:2px 0">${money(e.tce)}<span class="sm mut">/day</span></div>
    <div class="sm mut">${money(e.gvp,e.gvp>0)} over ${days1(e.days)}</div></div>`;

  if(f.vetGate){
    const s = vettingScore(sh), ok = s >= CFG.VET.gate;
    h += `<div class="card" style="margin:0 0 12px;border-color:${ok?"var(--line2)":"var(--neg)"}">
      <div class="between"><div class="b ${ok?"":"neg"}">${esc(f.major)} ${T("vetting","vetting")}</div>
        <span class="pill ${ok?"on":"bad"}">${s} / ${CFG.VET.gate}</span></div>
      <div class="sm mut" style="margin-top:4px">${ok?"She is approved for this charterer.":"She will not be approved. Improve her condition, her flag or her class, or take non-major business."}</div></div>`;
  }

  if(has("speed")){
    h += `<h2 class="sect" style="margin-top:0">Speed</h2><div class="card" style="margin:0">
      <div class="between"><div class="b mono">${kn(sp)}</div>
        <div class="xs mut">${burnAt(cls,sp,true).toFixed(1)} mt/d laden</div></div>
      <input type="range" min="${cls.minSpeed}" max="${cls.maxSpeed}" step="0.25" value="${sp}"
        oninput="fxSpeed['${f.id}']=+this.value;${rr},+this.value)">
      <div class="row xs mut2"><span>${cls.minSpeed} kn slow</span><span style="margin-left:auto">${cls.maxSpeed} kn full</span></div>
      ${opt?`<div class="between xs" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">
        <span class="mut">Best TCE here</span>
        <button class="btn sm" onclick="fxSpeed['${f.id}']=${opt.speed};${rr},${opt.speed})">${opt.speed} kn → ${money(opt.tce)}/d</button></div>`:""}
    </div>`;
  }

  // routing choice: canal or the long way round
  if(has2("canal") && (Object.keys(e.canals).length || e.altNm !== e.balNm+e.ladNm)){
    const viaCanal = Object.keys(e.canals).length > 0;
    h += `<h2 class="sect">Routing</h2><div class="card" style="margin:0">
      ${kv("Via "+(viaCanal?Object.keys(e.canals).map(c=>CFG.CANAL[c].name).join(" + "):"the Cape"), nm0(e.balNm+e.ladNm))}
      ${kv("Canal tolls", e.tollCost?cost0(e.tollCost):"none", e.tollCost?"neg":"")}
      ${kv("All-Cape alternative", nm0(e.altNm)+` · +${days1((e.altNm-(e.balNm+e.ladNm))/Math.max(1,e.speed)/24)}`)}
      <div class="row" style="gap:6px;margin-top:9px">
        <button class="btn sm" onclick="f_route('${f.id}',null);${rr},${sp})" ${!f.avoidCanals?'style="border-color:var(--acc)"':""}>Use canal</button>
        <button class="btn sm" onclick="f_route('${f.id}',['suez','panama']);${rr},${sp})" ${f.avoidCanals?'style="border-color:var(--acc)"':""}>Round the Cape</button>
      </div>
      ${(cls.ice||0)>=2 && NSR_MONTHS[gDate().getUTCMonth()] ? `<div class="row" style="gap:6px;margin-top:6px">
        <button class="btn sm" onclick="f_nsr('${f.id}');${rr},${sp})">${f.nsr?"NSR selected":T("nsr","Try the Northern Sea Route")}</button></div>`:""}
    </div>`;
  }

  if(e.warZones.length){
    h += `<h2 class="sect">War risk</h2><div class="card" style="margin:0;border-color:var(--haz)">
      ${e.warZones.map(z=>kv(esc(z.name), cost0(z.cost), "neg")).join("")}
      <div class="row" style="gap:6px;margin-top:8px">
        <button class="btn sm" onclick="f_guards('${f.id}');${rr},${sp})" ${f.guards?'style="border-color:var(--acc)"':""}>
          ${f.guards?"Guards embarked":"Embark armed guards"}</button></div>
      <div class="xs mut2" style="margin-top:6px">${T("warrisk","A premium on the ship's value")} plus a crew bonus. Guards cost money and cut the premium by roughly half.</div>
    </div>`;
  }

  h += `<h2 class="sect">Legs</h2><div class="card" style="margin:0">
    ${e.balNm>0?kv(has("ballast")?T("ballast","Ballast")+` to ${esc(lp.name)}`:`Sailing to ${esc(lp.name)}`, nm0(e.balNm)+" · "+days1(e.balDays), "mut"):""}
    ${kv("Load at "+esc(lp.name), days1(e.loadDays))}
    ${kv(T("laden","Laden")+` to ${esc(dp.name)}`, nm0(e.ladNm)+" · "+days1(e.ladDays))}
    ${kv("Discharge at "+esc(dp.name), days1(e.dischDays))}
    ${e.canalDays?kv("Canal transit", days1(e.canalDays)):""}
    ${e.iceDays>0.05?kv(T("iceclass","Ice delay"), days1(e.iceDays), "haz"):""}
    ${e.cleanDays?kv("Tank cleaning", days1(e.cleanDays), "haz"):""}
    ${(e.wBal||e.wLad)?kv("Weather allowance", `−${pc(Math.max(e.wBal,e.wLad))} speed`, "haz"):""}
    ${kvt("Total voyage", days1(e.days))}</div>`;

  h += `<h2 class="sect">Voyage result</h2><div class="card" style="margin:0">
    ${kv(`Freight — ${Math.round(e.qtyOut).toLocaleString()} ${e.unit}${f.ws?` @ WS ${f.ws} of $${f.flat.toFixed(2)}`:` × $${f.rate.toFixed(2)}`}`, money0(e.gross))}
    ${kv(T("addcomm","Commissions")+" 3.75%", cost0(e.comm), "neg")}
    ${kv("Net freight", money0(e.net))}
    ${e.bunkerLines.map(b=>kv(T(b.grade,CFG.FUEL[b.grade].name)+` ${Math.round(b.mt)} mt @ $${b.px}`, cost0(b.cost), "neg")).join("")}
    ${kv(T("da","Port disbursements")+" — "+esc(lp.name), cost0(e.daLoad), "neg")}
    ${kv("Port disbursements — "+esc(dp.name), cost0(e.daDisch), "neg")}
    ${e.tollCost?kv("Canal tolls", cost0(e.tollCost), "neg"):""}
    ${e.warCost?kv(T("warrisk","War risk"), cost0(e.warCost), "neg"):""}
    ${e.ets.cost>1?kv(T("ets","EU ETS")+` — ${Math.round(e.ets.co2)} t CO₂ @ ${pc(e.euScope)}`, cost0(e.ets.cost), "neg"):""}
    ${e.feu.cost>1?kv(T("fueleu","FuelEU"), cost0(e.feu.cost), "neg"):""}
    ${has("demurrage")&&Math.abs(e.demurrage)>100?kv(e.overrun>0?T("demurrage","Demurrage")+" "+days1(e.overrun):T("despatch","Despatch")+" "+days1(-e.overrun),
        (e.demurrage>0?"+":"−")+money0(Math.abs(e.demurrage)), e.demurrage>0?"pos":"neg"):""}
    ${kvt("Gross voyage profit", money0(e.gvp), cls_pn(e.gvp))}
    ${kv(T("opex","OPEX")+" "+days1(e.days), cost0(e.opex), "neg")}
    ${kvt("Net contribution", money0(e.netCash), cls_pn(e.netCash))}</div>`;

  const short = e.wcap > S.cash;
  h += `<h2 class="sect">Cash flow</h2><div class="card" style="margin:0${short?";border-color:var(--neg)":""}">
    ${kvs("Freight terms", `${pc(CFG.FREIGHT_ON_BL)} against the ${T("blading","bill of lading")}, balance on delivery`)}
    ${kv("Advance arrives", money0(e.advance)+" on day "+(Math.round(e.preDays*10)/10))}
    ${e.stemCost>1?kv("Fuel to buy at the load port", cost0(e.stemCost)+", same day", "neg"):kv("Fuel to buy", "none — she has enough aboard", "pos")}
    ${kvt("Net when she loads", money(e.advance-e.stemCost, e.advance-e.stemCost>0), cls_pn(e.advance-e.stemCost))}
    ${kv(T("wcap","Cash to fund until then"), money0(e.wcap), short?"neg":"")}
    ${kv("You have", money(S.cash), short?"neg":"pos")}
    ${short
      ? `<div class="xs neg" style="margin-top:7px">You cannot fund this voyage. She would run out of cash before the freight advance lands — a profitable fixture you simply cannot afford yet. Take a shorter trade, or one loading closer to where she is.</div>`
      : `<div class="xs mut2" style="margin-top:7px">Most of the freight lands once she is loaded, so a long voyage ties up less than its total cost. What you must carry is the ballast leg, the load port bill and the running costs until then.</div>`}
  </div>`;

  h += `<h2 class="sect">Terms</h2><div class="card" style="margin:0">
    ${kvs("Charter party", T("fiost","FIOST")+" — charterer loads and discharges")}
    ${kv(T("laytime","Laytime")+" allowed", days1(e.laytime))}
    ${kv(T("laycan","Laycan")+" opens", "in "+f.laydays+" days")}
    ${kv(T("stowage","Stowage factor"), (CARGOES[f.cargo].sf||0).toFixed(2)+" m³/mt")}
  </div>`;

  showSheet(`${esc(lp.name)} → ${esc(dp.name)}`, `${CARGOES[f.cargo].name} · ${esc(sh.name)}`, h,
    short
      ? `<button class="btn dang" onclick="doFix(${sh.id},'${f.id}',${sp})">Fix anyway — you cannot fund this</button>`
      : `<button class="btn pri" onclick="doFix(${sh.id},'${f.id}',${sp})">Fix at ${money(e.tce)}/day</button>`);
}
function f_route(fxId, avoid){ const f=S.fixtures.find(x=>x.id===fxId); if(f) f.avoidCanals=avoid; }
function f_nsr(fxId){ const f=S.fixtures.find(x=>x.id===fxId); if(f) f.nsr=!f.nsr; }
function f_guards(fxId){ const f=S.fixtures.find(x=>x.id===fxId); if(f) f.guards=!f.guards; }

function doFix(shipId, fxId, sp){
  const sh = S.ships.find(s=>s.id===shipId), f = S.fixtures.find(x=>x.id===fxId);
  if(!sh || !f) return;
  const speed = sp ?? fxSpeed[fxId] ?? (shipCls(sh).designSpeed-1.5);
  const r = fixVoyage(sh, f, speed);
  if(!r.ok){ toast(r.why, "bad"); return; }
  hideSheet(); S.tab = "fleet";
  toast(`<b>Fixed.</b> ${esc(sh.name)} — ${esc(r.est.loadName)} → ${esc(r.est.dischName)}`, "good");
  if(S.voyagesDone === 0)
    coach("sailing", "She's on her way", "The voyage runs in real time — about five seconds a game day. Tap her card any time to see where she is and what the voyage is earning.");
  onUnlockCheck(); dirty();
}

/* --- charter out --------------------------------------------------------- */
function vTcOffers(sh){
  const offers = (S.tcOffers||[]).filter(o=>o.forShip===sh.id);
  const spot = spotTce(sh.cls, MKT);
  let h = `<div class="card"><div class="between">
    <div class="sm mut">Spot market is paying</div><div class="b">${money(spot)}/day</div></div>
    <div class="xs mut2" style="margin-top:5px">${T("tc","Time charter")} trades upside for certainty. Long charters price off where the market expects to be, so in a boom they sit below spot and in a slump above it.</div></div>`;
  if(!offers.length) return h + `<div class="empty"><div class="big">📄</div><div class="b">No charterers bidding</div></div>`;
  h += `<h2 class="sect">Offers</h2>`;
  for(const o of offers.sort((a,b)=>a.days-b.days)){
    const vs = o.rate/spot - 1;
    h += `<div class="card tap" onclick="sheetTc(${sh.id},'${o.id}')">
      <div class="between"><div class="grow"><div class="b">${o.kind==="bb"?T("bareboat","Bareboat"):o.days>=365?Math.round(o.days/365*10)/10+" years":Math.round(o.days/30)+" months"}</div>
        <div class="xs mut2">${esc(o.charterer)}</div></div>
      <div style="text-align:right"><div class="lg b">${money0(o.rate)}<span class="sm mut">/d</span></div>
        <div class="xs ${vs>=0?"pos":"neg"}">${vs>=0?"+":""}${pc(vs)} vs spot</div></div></div>
      <div class="row" style="margin-top:8px;gap:6px">
        <span class="pill">${money(o.rate*o.days)} total</span>
        <button class="btn pri sm" style="margin-left:auto" onclick="event.stopPropagation();takeTc(${sh.id},'${o.id}')">Fix</button></div></div>`;
  }
  return h;
}
function sheetTc(shipId, offerId){
  const sh = S.ships.find(s=>s.id===shipId), o = S.tcOffers.find(x=>x.id===offerId);
  if(!sh || !o) return;
  const cls = shipCls(sh);
  const opex = opexDay(cls, shipAge(sh))*(sh.flagMult||1);
  const debt = sh.debt ? sh.debt.principal*sh.debt.rate/365 + sh.debt.orig/sh.debt.termDays : 0;
  const bb = o.kind === "bb";
  showSheet(bb?"Bareboat charter":"Time charter", `${esc(o.charterer)} · ${esc(sh.name)}`,
    `<div class="card" style="margin:0 0 12px;text-align:center;padding:15px">
      <div class="xs mut2">Hire</div>
      <div class="xl bb pos">${money0(o.rate)}<span class="sm mut">/day</span></div>
      <div class="sm mut">${o.days} days · ${money(o.rate*o.days)} gross</div></div>

/* --- COA ----------------------------------------------------------------- */
function vCoa(){
  let h = "";
  if(S.coas.length){
    h += `<h2 class="sect" style="margin-top:0">Live contracts</h2>`;
    for(const c of S.coas){
      const left = Math.max(0, c.lifts - c.liftsDone);
      const dLeft = Math.max(0, Math.round(c.endDay - S.day));
      const risk = left > 0 && dLeft < left*30;
      h += `<div class="card"><div class="between"><div class="grow trunc">
        <div class="b trunc">${esc(PORTS[c.route.l].name)} → ${esc(PORTS[c.route.d].name)}</div>
        <div class="xs mut2">${esc(c.charterer)} · ${CARGOES[c.route.c].name} · $${c.rate.toFixed(2)}</div></div>
        <span class="pill ${risk?"bad":"on"}">${c.liftsDone}/${c.lifts}</span></div>
        <div class="bar ${risk?"bad":"pos"}" style="margin-top:8px"><i style="width:${pc(c.liftsDone/c.lifts)}"></i></div>
        <div class="row xs mut2" style="margin-top:5px"><span>${left} cargo${left===1?"":"es"} to lift</span>
          <span style="margin-left:auto">${dLeft}d remaining</span></div>
        <div class="row" style="gap:6px;margin-top:9px;flex-wrap:wrap">
        ${S.ships.filter(s=>s.status==="idle"&&(!s.emp||s.emp.type==="spot")&&eligible(shipCls(s),c.route))
          .map(s=>`<button class="btn sm" onclick="assignCoa(${s.id},'${c.id}')">Assign ${esc(s.name.split(" ").slice(-1)[0])}</button>`).join("")||'<span class="xs mut2">No eligible ship is open.</span>'}
        </div></div>`;
    }
  }
  h += `<h2 class="sect">Offers</h2>`;
  if(!(S.coaOffers||[]).length) return h + `<div class="empty"><div class="big">📑</div><div class="b">No contracts on offer</div></div>`;
  for(const o of S.coaOffers){
    h += `<div class="card tap" onclick="sheetCoa('${o.id}')">
      <div class="between"><div class="grow trunc">
        <div class="b trunc">${esc(PORTS[o.route.l].name)} → ${esc(PORTS[o.route.d].name)}</div>
        <div class="xs mut2">${esc(o.charterer)} · ${CARGOES[o.route.c].name}</div></div>
      <div style="text-align:right"><div class="b">$${o.rate.toFixed(2)}</div>
        <div class="xs mut2">${o.lifts} cargoes / ${Math.round(o.period/30)}mo</div></div></div></div>`;
  }
  return h;
}
function sheetCoa(id){
  const o = S.coaOffers.find(x=>x.id===id); if(!o) return;
  const idx = routeIdx(o.route);
  showSheet(T("coa","Contract of Affreightment"), `${esc(o.charterer)}`,
    `<div class="card" style="margin:0">
      ${kv("Trade", esc(PORTS[o.route.l].name)+" → "+esc(PORTS[o.route.d].name))}
      ${kv("Cargo", CARGOES[o.route.c].name)}
      ${kv("Rate", "$"+o.rate.toFixed(2)+" per unit")}

/* --- liner services ------------------------------------------------------ */
function vServices(){
  let h = "";
  if(S.services.length){
    for(const svc of S.services) h += serviceCard(svc);
  } else {
    h += `<div class="card"><div class="sm mut">A liner service is a product you build and maintain, not a cargo you accept. Choose a trade lane and a frequency, and the game tells you how many ships the ${T("string","string")} needs at your chosen speed.</div></div>`;
  }
  h += `<h2 class="sect">Open a service</h2>`;
  const own = S.ships.filter(s=>CLASSES[s.cls].seg==="container");
  if(!own.length) return h + `<div class="empty"><div class="big">🚢</div><div class="b">You own no container tonnage</div>
    <div class="sm mut2" style="margin-top:6px">Buy boxships in the Yard first. You can also simply charter them out and let someone else run the network.</div></div>`;
  for(const lane of LANES){
    const usable = own.filter(s=>lane.cls.includes(s.cls));
    if(!usable.length) continue;
    const plan = linerPlan(lane, usable[0].cls, 16, 7, 1, MKT, gDate().getUTCMonth(), { drought:S.drought });
    h += `<div class="card tap" onclick="sheetLaneBuild('${lane.id}','${usable[0].cls}')">
      <div class="between"><div class="grow trunc"><div class="b trunc">${lane.short} · ${esc(lane.name)}</div>

  return h;
}
function serviceCard(svc){

    <div class="between"><div class="grow trunc">
      <div class="b trunc">${lane.short} · ${esc(lane.name)}</div>
      <div class="xs mut2">${svc.ships.length}×${CLASSES[svc.cls].name} · ${svc.freq}-day · ${svc.speed} kn</div>

      <div class="b ${p&&p.ebitPerDay>=0?"pos":"neg"}">${p?perDay(p.ebitPerDay):"—"}</div>

    <div class="row" style="margin-top:8px;gap:5px;flex-wrap:wrap">
      <span class="pill ${svc.ships.length<need?"bad":"on"}">${svc.ships.length}/${need} ships</span>

let bld = { freq:7, speed:16, buffer:1, contract:0.6, ships:[] };
function sheetLaneBuild(laneId, clsId){
  bld = { freq:7, speed:16, buffer:1, contract:0.6, ships:[], lane:laneId, cls:clsId };
  renderLaneBuild();
}
function renderLaneBuild(){
  const lane = LANES.find(l=>l.id===bld.lane);
  const plan = linerPlan(lane, bld.cls, bld.speed, bld.freq, bld.buffer, MKT, gDate().getUTCMonth(), { drought:S.drought });

  const need = plan.ships;
  let h = `<div class="card" style="margin:0 0 12px">
    <div class="xs mut2">${T("string","String required")}</div>
    <div class="between"><div class="xl bb ${avail.length>=need?"pos":"haz"}">${need}<span class="sm mut"> ships</span></div>
      <div class="sm mut" style="text-align:right">round voyage ${days1(plan.rot.roundDays)}<br>${bld.freq}-day frequency</div></div>
    <div class="xs mut2" style="margin-top:6px">ceil(${plan.rot.roundDays.toFixed(1)} ÷ ${bld.freq}) + ${bld.buffer} buffer</div></div>`;

  h += `<h2 class="sect" style="margin-top:0">Service speed</h2><div class="card" style="margin:0">
    <div class="between"><div class="b mono">${kn(bld.speed)}</div>

  </div>`;

  h += `<h2 class="sect">Frequency and buffer</h2><div class="card" style="margin:0">
    <div class="row" style="gap:6px">${CFG.LINER.frequencies.map(f=>
      `<button class="btn sm" style="${bld.freq===f?"border-color:var(--acc)":""}" onclick="bld.freq=${f};renderLaneBuild()">${f}-day</button>`).join("")}</div>
    <div class="row" style="gap:6px;margin-top:8px">${[0,1,2].map(b=>
      `<button class="btn sm" style="${bld.buffer===b?"border-color:var(--acc)":""}" onclick="bld.buffer=${b};renderLaneBuild()">${b} buffer</button>`).join("")}</div>
    <div class="xs mut2" style="margin-top:7px">Delay propagates round the loop — a ship late out of Yantian is late into Rotterdam and late back again. ${T("reliability","Buffer days")} are the only real defence, and they cost a ship.</div>
  </div>`;

  h += `<h2 class="sect">Contract cover</h2><div class="card" style="margin:0">
    <div class="between"><div class="b">${pc(bld.contract)} on annual contract</div><div class="xs mut">${pc(1-bld.contract)} spot</div></div>
    <input type="range" min="0" max="0.85" step="0.05" value="${bld.contract}" oninput="bld.contract=+this.value;renderLaneBuild()">
    <div class="xs mut2">Contract volume is steady at a small discount; spot swings with the index. The same choice as time charter against voyage charter, in a different costume.</div>
  </div>`;

  h += `<h2 class="sect">Economics per sailing</h2><div class="card" style="margin:0">
    ${kv(T("headhaul","Headhaul"), Math.round(plan.hhTeu).toLocaleString()+" TEU @ $"+Math.round(plan.hhRate))}
    ${kv("Backhaul", Math.round(plan.bhTeu).toLocaleString()+" TEU @ $"+Math.round(plan.bhRate))}
    ${kv("Freight", money0(plan.freightPerSailing))}
    ${kv(T("bunkers","Bunkers"), cost0(plan.bunkerCost), "neg")}
    ${kv(T("thc","Terminal handling"), cost0(plan.thc), "neg")}
    ${kv("Port disbursements", cost0(plan.daCost), "neg")}
    ${plan.tolls?kv("Canal tolls", cost0(plan.tolls), "neg"):""}
    ${kv("Empty repositioning", cost0(plan.emptyCost), "neg")}
    ${plan.carbon?kv(T("ets","EU ETS"), cost0(plan.carbon), "neg"):""}
    ${kv("Boxes, inland, network", cost0(plan.overhead), "neg")}
    ${kvt("EBIT per year", money(plan.ebitYear), cls_pn(plan.ebitYear))}
    ${kv("Per ship per day", perDay(plan.ebitPerShipDay), cls_pn(plan.ebitPerShipDay))}
  </div>`;

  h += `<h2 class="sect">Assign ships — ${bld.ships.length}/${need}</h2><div class="card" style="margin:0">
    ${avail.length?avail.map(s=>`<div class="between" style="padding:5px 0">
      <div class="grow trunc sm">${esc(s.name)} <span class="mut2 xs">${PORTS[s.port].name}</span></div>
      <button class="btn sm" style="${bld.ships.includes(s.id)?"border-color:var(--acc)":""}"

      :`<div class="mut sm">No open ships of this class. Buy or free up tonnage first.</div>`}
  </div>`;

  showSheet(lane.short+" · "+esc(lane.name), lane.ports.map(p=>PORTS[p].name).join(" → "), h,
    `<button class="btn pri" ${bld.ships.length<need?"disabled":""}

      ${bld.ships.length<need?`Need ${need-bld.ships.length} more ship${need-bld.ships.length===1?"":"s"}`:"Launch service"}</button>`);

      <div class="xs mut2" style="margin-top:7px">Against mid-cycle. Values move less than rates and are floored by scrap — which is why old tonnage stops falling in a crash.</div></div>`;

      <button class="btn" onclick="sheetSwap()">Bunker swap — fix fuel forward</button>`;
    if(S.ffa.length || S.swaps.length){
      h += `<div class="card" style="margin-top:10px">
        ${S.ffa.map(f=>kv(`${INDEX_META[f.idx].short} ${f.side>0?"long":"short"} ${f.lots} · ${Math.max(0,Math.round(f.endDay-S.day))}d`,
            money(ffaMtm(f), ffaMtm(f)>0), cls_pn(ffaMtm(f)))).join("")}
        ${S.swaps.map(w=>kv(`VLSFO ${w.side>0?"long":"short"} ${w.lots}kt · ${Math.max(0,Math.round(w.endDay-S.day))}d`,

      ${S.drought?`<div class="sm haz b" style="margin-top:${S.redSeaClosed?"9px":"0"}">Panama — drought restrictions</div><div class="xs mut" style="margin-top:3px">Draft cut to ${CFG.PANAMA_DROUGHT.draft} m and booking slots are auctioning far above the tariff.</div>`:""}

function idxVisible(k){
  if(["handy","pmx","cape"].includes(k)) return true;
  if(["prod","dirty"].includes(k)) return has2("tanker");

  return has2("special");
}

  const keys = Object.keys(INDEX_META).filter(idxVisible);
  let h = `<div class="card" style="margin:0 0 12px"><div class="sm mut">An ${T("ffa","FFA")} is a cash-settled bet on the index. Sell forward to lock in today's earnings for tonnage you have not fixed; buy to take a view. The curve already pulls toward mid-cycle, so you cannot simply sell the top at the top.</div></div>`;
  for(const k of keys){
    h += `<h2 class="sect" ${k===keys[0]?'style="margin-top:0"':""}>${INDEX_META[k].name} — ${S.mkt.idx[k].toFixed(1)}</h2><div class="card" style="margin:0">

  showSheet("Forward freight", "One lot = 30 days of index exposure", h);
}

function vYard(){
  if(!has2("sandp")) return lockView("🏗","S&P and Shipyard",
    `Buying and selling tonnage opens after ${CFG.UNLOCK2.sandp} voyages. Asset values already move with the cycle underneath — a 15-year Handysize is worth ${money(assetValue("handysize",15,MKT))} today against ${money(CLASSES.handysize.sh15)} at mid-cycle.`, CFG.UNLOCK2.sandp);
  const tabs = [["buy","Buy"],["sell","Sell"]];
  if(has2("newbuild")) tabs.splice(1,0,["nb","Order"]);
  let h = `<div class="seg">${tabs.map(([k,l])=>
    `<button aria-selected="${yardTab===k}" onclick="yardTab='${k}';dirty()">${l}</button>`).join("")}</div>`;

  if(yardTab === "sell"){
    h += `<h2 class="sect" style="margin-top:0">Your fleet</h2>`;
    for(const sh of S.ships){
      const bid = bidPrice(sh.cls, shipAge(sh), MKT, sh.hull), scr = scrapValue(sh.cls, MKT);
      h += `<div class="card tap" onclick="sheetSell(${sh.id})">
        <div class="between"><div class="grow trunc"><div class="b trunc">${esc(sh.name)}</div>
          <div class="xs mut2">${CLASSES[sh.cls].name} · ${shipAge(sh)}yr · hull ${pc(sh.hull)}</div></div>
        <div style="text-align:right"><div class="b">${money(bid)}</div>
          <div class="xs mut2">scrap ${money(scr)}</div></div></div></div>`;
    }
    return h;
  }
  if(yardTab === "nb"){
    h += `<div class="card"><div class="sm mut">A newbuild takes 24 to 36 months and 20% down on signing. You are buying into the market as it will be, not as it is — order at the bottom and the ship arrives into a recovery; order at the top and she arrives into a glut.</div></div>`;
    for(const [id,c] of Object.entries(CLASSES)){
      if(!segUnlocked(c.seg)) continue;
      h += `<div class="card tap" onclick="sheetNewbuild('${id}')">
        <div class="between"><div class="grow"><div class="b">${c.name}</div>
          <div class="xs mut2">${capLabel(c)} · ${c.designSpeed} kn · ${c.consLaden} mt/d</div></div>
        <div style="text-align:right"><div class="b">${money(c.nb)}</div>
          <div class="xs mut2">${money(c.nb*CFG.SNP.nbDeposit)} down</div></div></div></div>`;
    }
    return h;
  }
  h += `<div class="card"><div class="between"><div class="sm mut">Cycle position</div>
    <div class="b ${S.mkt.idx.handy<80?"pos":S.mkt.idx.handy>130?"neg":""}">${S.mkt.idx.handy<80?"Buyer's market":S.mkt.idx.handy>130?"Seller's market":"Mid-cycle"}</div></div>
    <div class="xs mut2" style="margin-top:5px">You buy above the mark and sell below it — a ${pc(CFG.SNP.spread*2)} round trip, plus ${pc(CFG.SNP.brokerage)} brokerage. Trading tonnage well beats trading freight well.</div></div>`;
  h += `<h2 class="sect">On the market</h2>`;
  for(const o of S.snp){
    const c = CLASSES[o.cls];
    h += `<div class="card tap" onclick="sheetBuy('${o.id}')">
      <div class="between"><div class="grow trunc"><div class="b trunc">${c.name}</div>
        <div class="xs mut2">${o.age}yr · ${capLabel(c)} · ${esc(PORTS[o.port].name)} · ${FLAGS[o.flag].name}</div></div>
      <div style="text-align:right"><div class="b">${money(o.ask)}</div>
        <div class="xs mut2">hull ${pc(o.cond)}</div></div></div>
      <div class="row" style="margin-top:8px;gap:5px;flex-wrap:wrap">
        ${o.scrubber?'<span class="pill on">Scrubber</span>':""}
        ${o.eco?'<span class="pill on">Eco</span>':""}
        <span class="pill">${CLASS_SOC[o.classSoc].name}</span>
        <span class="pill">${money0(opexDay(c,o.age))}/d opex</span></div></div>`;
  }
  return h;
}
let buyLtv = 0.5;
function sheetBuy(id){
  const o = S.snp.find(x=>x.id===id); if(!o) return;
  const c = CLASSES[o.cls];
  const debt = Math.min(buyLtv, CFG.FIN.maxLtv)*o.ask;
  const fees = o.ask*(CFG.SNP.brokerage+CFG.SNP.inspection);
  const cash = o.ask - debt + fees;
  const rate = loanRate();
  const svc = debt>0 ? debt*rate/365 + debt/(CFG.FIN.termYears*365) : 0;
  const tce = spotTce(o.cls, MKT);
  showSheet(c.name, `${o.age} years · ${esc(PORTS[o.port].name)}`,
    `<div class="card" style="margin:0 0 12px">
      ${kv("Asking price", money(o.ask))}
      ${kv("Mid-cycle value", money(c.sh15))}
      ${kv("Scrap floor", money(scrapValue(o.cls, MKT)))}
      ${kv("Hull condition", pc(o.cond), o.cond<0.7?"haz":"pos")}
      ${kv("Daily "+T("opex","OPEX"), money0(opexDay(c,o.age)))}
      ${kv("Spot market pays", money(tce)+"/day")}
     </div>
     <h2 class="sect" style="margin-top:0">Financing</h2><div class="card" style="margin:0">
      <div class="between"><div class="b">${pc(buyLtv)} ${T("ltv","LTV")}</div><div class="sm mut">${money(debt)} debt</div></div>
      <input type="range" min="0" max="${CFG.FIN.maxLtv}" step="0.05" value="${buyLtv}"
        oninput="buyLtv=+this.value;sheetBuy('${id}')">
      ${kv("Cash needed today", money(cash), cash>S.cash?"neg":"")}
      ${kv("Interest rate", pc(rate)+" (rating "+S.rating+")")}
      ${kv("Debt service", money0(svc)+"/day", "neg")}
      ${kvt("Indicative net", money0(tce - opexDay(c,o.age) - svc)+"/day", cls_pn(tce-opexDay(c,o.age)-svc))}
      <div class="xs mut2" style="margin-top:7px">Leverage magnifies both directions. A covenant breach above ${pc(CFG.FIN.covLtv)} ${T("covenant","LTV")} makes the loan repayable on demand, and in a downturn values fall faster than debt.</div>
     </div>`,
    `<button class="btn pri" ${cash>S.cash?"disabled":""} onclick="buyShip('${id}',${buyLtv})">
      ${cash>S.cash?"Not enough cash":"Buy for "+money(o.ask)}</button>`);
}
function sheetSell(shipId){
  const sh = S.ships.find(s=>s.id===shipId); if(!sh) return;
  const bid = bidPrice(sh.cls, shipAge(sh), MKT, sh.hull), scr = scrapValue(sh.cls, MKT);
  const debt = sh.debt?sh.debt.principal:0;
  showSheet("Sell "+esc(sh.name), CLASSES[sh.cls].name+" · "+shipAge(sh)+" years",
    `<div class="card" style="margin:0">
      ${kv("Best bid", money(bid))}
      ${kv("Brokerage", cost0(bid*CFG.SNP.brokerage), "neg")}
      ${debt?kv("Mortgage to repay", cost(debt), "neg"):""}
      ${kvt("Net proceeds", money(bid-bid*CFG.SNP.brokerage-debt), cls_pn(bid-bid*CFG.SNP.brokerage-debt))}
     </div>
     <div class="card" style="margin-top:12px">
      ${kv("Demolition instead", money(scr))}
      ${kv("Lightweight", CLASSES[sh.cls].ldt.toLocaleString()+" ldt @ $"+Math.round(scr/CLASSES[sh.cls].ldt)+"/ldt")}
      <div class="xs mut2" style="margin-top:6px">Scrap prices are cyclical too, and they set the floor under every old ship in the world.</div>
     </div>`,
    `<button class="btn pri" onclick="sellShip(${sh.id})">Sell for ${money(bid)}</button>
     <button class="btn dang" style="margin-top:8px" onclick="scrapShip(${sh.id})">Send to demolition — ${money(scr)}</button>`);
}
let nbOpt = { eco:false, dualFuel:null, scrubber:false };
function sheetNewbuild(clsId){
  const c = CLASSES[clsId];
  let price = c.nb;
  if(nbOpt.eco) price *= 1+CFG.SNP.nbPremiumEco;
  if(nbOpt.dualFuel) price *= 1+CFG.SNP.dualFuelPremium[nbOpt.dualFuel];
  showSheet("Order a "+c.name, "Delivery in 24–36 months",
    `<div class="card" style="margin:0">
      ${kv("Contract price", money(price))}
      ${kv("Deposit now", money(price*CFG.SNP.nbDeposit))}
      ${kv("Balance on delivery", money(price*(1-CFG.SNP.nbDeposit)))}
     </div>
     <h2 class="sect">Specification</h2><div class="card" style="margin:0">
      <div class="row" style="gap:6px;flex-wrap:wrap">
        <button class="btn sm" style="${nbOpt.eco?"border-color:var(--acc)":""}" onclick="nbOpt.eco=!nbOpt.eco;sheetNewbuild('${clsId}')">Eco design +${pc(CFG.SNP.nbPremiumEco)}</button>
        <button class="btn sm" style="${nbOpt.scrubber?"border-color:var(--acc)":""}" onclick="nbOpt.scrubber=!nbOpt.scrubber;sheetNewbuild('${clsId}')">Scrubber</button>
        <button class="btn sm" style="${nbOpt.dualFuel==="lng"?"border-color:var(--acc)":""}" onclick="nbOpt.dualFuel=nbOpt.dualFuel==='lng'?null:'lng';sheetNewbuild('${clsId}')">LNG dual fuel +${pc(CFG.SNP.dualFuelPremium.lng)}</button>
        <button class="btn sm" style="${nbOpt.dualFuel==="methanol"?"border-color:var(--acc)":""}" onclick="nbOpt.dualFuel=nbOpt.dualFuel==='methanol'?null:'methanol';sheetNewbuild('${clsId}')">Methanol +${pc(CFG.SNP.dualFuelPremium.methanol)}</button>
      </div>
      <div class="xs mut2" style="margin-top:8px">Eco design cuts consumption ${pc(CFG.SNP.nbEcoGain)} and helps your ${T("cii","CII")} for the ship's whole life. Dual fuel costs more up front and earns it back through ${T("fueleu","FuelEU")} and carbon.</div>
     </div>`,
    `<button class="btn pri" ${price*CFG.SNP.nbDeposit>S.cash?"disabled":""}
      onclick="orderNewbuild('${clsId}',${JSON.stringify(nbOpt).replace(/"/g,"&quot;")})">Sign for ${money(price)}</button>`);
}
function sheetRetro(shipId, kind){
  const sh = S.ships.find(s=>s.id===shipId); if(!sh) return;
  const cls = CLASSES[sh.cls];
  if(kind === "scrubber"){
    const cost = cls.gt*CFG.SNP.scrubberCost;
    const spread = (bunkerPrice(PORTS.singapore,"vlsfo",MKT)||0) - (bunkerPrice(PORTS.singapore,"hsfo",MKT)||0);
    const perDay = spread*burnAt(cls, cls.designSpeed-1.5, true);
    showSheet(T("scrubber","Fit a scrubber"), esc(sh.name),
      `<div class="card" style="margin:0">
        ${kv("Cost", money(cost))}
        ${kv("Off-hire", CFG.SNP.scrubberDays+" days")}
        ${kv("HSFO discount today", "$"+spread+"/mt")}
        ${kv("Saving at sea", money0(perDay)+"/day")}
        ${kvt("Payback", perDay>0?Math.round(cost/perDay)+" steaming days":"never at this spread")}
       </div>
       <div class="card" style="margin-top:12px"><div class="sm mut">A scrubber lets her burn cheap high-sulphur fuel legally. The whole case rests on the spread holding — it has been as wide as $200 and as narrow as $60.</div></div>`,
      `<button class="btn pri" ${cost>S.cash?"disabled":""} onclick="fitScrubber(${sh.id})">Fit for ${money(cost)}</button>`);
  } else {
    const cost = cls.gt*CFG.CII.retrofitPerGt;
    showSheet("Efficiency package", esc(sh.name),
      `<div class="card" style="margin:0">
        ${kv("Cost", money(cost))}
        ${kv("Off-hire", CFG.CII.retrofitDays+" days")}
        ${kv("Consumption", "−"+pc(CFG.CII.retrofitGain))}
        ${kv("Current "+T("cii","CII"), sh.ciiRating)}
       </div>
       <div class="card" style="margin-top:12px"><div class="sm mut">Shaft generator, propeller duct, low-friction coatings. Less fuel every day, a better ${T("cii","CII")} rating, and charterers pay more for a good one.</div></div>`,
      `<button class="btn pri" ${cost>S.cash?"disabled":""} onclick="fitEfficiency(${sh.id})">Fit for ${money(cost)}</button>`);
  }
}
function sheetFlag(shipId){
  const sh = S.ships.find(s=>s.id===shipId); if(!sh) return;
  const cls = CLASSES[sh.cls], base = opexDay(cls, shipAge(sh));
  showSheet(T("flag","Registry"), esc(sh.name),
    `<div class="card" style="margin:0 0 12px"><div class="sm mut">Your flag sets your manning bill, your tax, how often you are inspected and what charterers think of you. ${T("tonnagetax","Tonnage tax")} regimes tax the ship rather than the profit — worth more than any freight decision in a good year, and paid for with a dearer crew every day.</div></div>`
    + Object.entries(FLAGS).map(([id,f])=>{
      const mult = flagOpexMult(id);
      const cur = id === sh.flag;
      return `<div class="card" style="margin-bottom:8px;${cur?"border-color:var(--acc)":""}">
        <div class="between"><div class="b">${f.name}${cur?' <span class="pill on">Current</span>':""}</div>
          <div class="sm ${mult>1?"neg":"pos"}">${mult>1?"+":""}${Math.round((mult-1)*100)}% opex</div></div>
        <div class="xs mut" style="margin-top:4px">${f.note}</div>
        <div class="row xs mut2" style="margin-top:6px;gap:8px">
          <span>${money0(base*mult)}/day</span>
          <span>PSC ×${f.psc.toFixed(2)}</span>
          <span>${f.tonnageTax>0?"Tonnage tax":"Profits tax"}</span>
        </div>
        ${cur?"":`<button class="btn sm" style="width:100%;margin-top:9px" onclick="changeFlag(${sh.id},'${id}')">Reflag — ${money(cls.gt*1.2+45000)}</button>`}
      </div>`;
    }).join(""));
}

/* ==========================================================================
   COMPANY
   ========================================================================= */
function vCompany(){
  const L = S.ledger, debt = totalDebt(), assets = fleetValue(), eq = equity();
  const fleetDays = S.ships.reduce((a,s)=>a+s.lifeDays,0);
  const fleetGvp = S.ships.reduce((a,s)=>a+s.lifeGvp,0);
  const result = L.freight+L.hire+L.demurrage+L.liner
                -(L.bunkers+L.portDA+L.tolls+L.war+L.carbon+L.opex+(L.shore||0)+L.interest
                  +(L.fees||0)+(L.lease||0)+L.survey+L.psc+L.penalties+L.tax);

  let h = companySeg();
  if(S.cov) h += `<div class="card" style="border-color:var(--neg);background:rgba(224,82,82,.08)">
    <div class="b neg">${T("covenant","Covenant")} breach — ${Math.max(0,Math.ceil(S.cov.until-S.day))} days to cure</div>
    <div class="sm mut" style="margin-top:5px">Sell tonnage or raise cash. If the cure period expires the bank takes the fleet bar one ship and the run continues from there.</div></div>`;

  if(S.coSub === "bank") return h + vBank();

  h += `<h2 class="sect" ${S.cov?"":'style="margin-top:2px"'}>Balance sheet</h2><div class="card">
    ${kv("Cash", money(S.cash), cls_pn(S.cash))}
    ${kv("Fleet market value", money(assets))}
    ${S.orders.length?kv("Newbuild deposits paid", money(S.orders.reduce((a,o)=>a+o.paid,0))):""}
    ${kv("Debt", cost(debt), "neg")}
    ${kvt("Net equity", money(eq), cls_pn(eq))}
    ${debt>0?kv(T("ltv","LTV"), pc(debt/Math.max(1,assets)), debt/assets>0.7?"haz":"")+kv("Credit rating", S.rating):""}
    ${debt>0||S.ships.some(s=>s.lease)?`<div class="between" style="margin-top:9px;padding-top:9px;border-top:1px solid var(--line)">
      <span class="sm mut">Debt service ${money0(debtServiceDay()+leaseCostDay())}/day</span>
      <button class="btn sm" style="flex:none" onclick="coSub('bank')">Bank →</button></div>`:""}
  </div>`;

  // A line only appears once it has something on it. At the start of a run that
  // leaves an almost-empty statement, which is the truth — a wall of "$0" rows
  // is noise the player has to read past every time.
  const pnl = (lbl, v, c)=> Math.abs(v||0) > 0.5 ? kv(lbl, cost(v), c||"neg") : "";
  h += `<h2 class="sect">Profit &amp; loss — to date</h2><div class="card">
    ${L.freight?kv("Net freight", money(L.freight)):""}
    ${L.hire?kv("Charter hire", money(L.hire)):""}
    ${L.liner?kv("Liner services", money(L.liner), cls_pn(L.liner)):""}
    ${Math.abs(L.demurrage)>100?kv(T("demurrage","Demurrage")+" net", money(L.demurrage,L.demurrage>0), cls_pn(L.demurrage)):""}
    ${pnl(T("bunkers","Bunkers"), L.bunkers)}
    ${pnl(T("da","Port disbursements"), L.portDA)}
    ${pnl("Canal tolls", L.tolls)}
    ${pnl(T("warrisk","War risk"), L.war)}
    ${pnl("Carbon", L.carbon)}
    ${pnl(T("opex","OPEX")+" — at sea", L.opex)}
    ${pnl("Shore organisation", L.shore)}
    ${pnl("Surveys and drydock", L.survey)}
    ${pnl(T("psc","PSC")+" deficiencies", L.psc)}
    ${pnl("COA penalties", L.penalties)}
    ${pnl("Interest", L.interest)}
    ${pnl("Bank fees", L.fees)}
    ${pnl(T("leaseback","Bareboat hire in"), L.lease)}
    ${pnl("Tax", L.tax)}
    ${Math.abs(L.derivatives)>100?kv("Derivatives", money(-L.derivatives, -L.derivatives>0), cls_pn(-L.derivatives)):""}
    ${kvt("Result", money(result), cls_pn(result))}
    ${pnl("Principal repaid", L.principal, "mut")}
    ${Math.abs(result)<0.5?`<div class="xs mut2" style="margin-top:7px">Nothing has been earned or spent yet. Every line appears here as soon as it has something on it.</div>`:""}
  </div>`;

  h += `<h2 class="sect">Fleet KPIs</h2><div class="card">
    ${kv("Vessels", S.ships.length + (S.orders.length?` (+${S.orders.length} on order)`:""))}
    ${kv("Voyages completed", S.voyagesDone)}
    ${kv("Utilisation", pc(utilisation()))}
    ${fleetDays>0?kv("Fleet "+T("tce","TCE"), money(fleetGvp/fleetDays)+"/day"):""}
    ${kv("Average OPEX", money0(S.ships.reduce((a,s)=>a+opexDay(shipCls(s),shipAge(s))*(s.flagMult||1),0)/Math.max(1,S.ships.length))+"/day")}
    ${kv("Reputation", pc(S.rep), S.rep>0.6?"pos":S.rep<0.4?"neg":"")}
    ${kv("Shore cost per ship", money0(shorePerShipDay())+"/day")}
    ${S.office && S.office.mode==="inhouse"?kv("Office", totalHeads()+" people · "+shoreHealth().label,
        shoreHealth().worst>=1?"pos":shoreHealth().worst>=0.75?"haz":"neg"):kv("Office", "Third-party managed")}
    ${has("cii")?kv("Fleet "+T("cii","CII"), ciiSpread()):""}
    ${S.ships.some(s=>s.offHireDays>0.1)?kv(T("offhire","Off-hire to date"), days1(S.ships.reduce((a,s)=>a+s.offHireDays,0)), "neg"):""}
  </div>`;

  if(S.daily.length>4) h += `<h2 class="sect">Cash and equity</h2><div class="card">${cashChart()}</div>`;

  h += `<h2 class="sect">Reference</h2>
    <button class="btn" style="margin-bottom:8px" onclick="sheetGlossary()">Glossary — ${Object.keys(GLOSSARY).length} terms</button>
    <button class="btn" style="margin-bottom:8px" onclick="sheetSettings()">Settings &amp; save</button>`;
  h += `<div style="text-align:center;margin:22px 0 6px"><span id="ver">Kription v${CFG.VERSION}${S.debug?" · debug":""}</span></div>`;
  return h;
}
function ciiSpread(){
  const c = {}; for(const s of S.ships) c[s.ciiRating] = (c[s.ciiRating]||0)+1;
  return ["A","B","C","D","E"].filter(k=>c[k]).map(k=>`${c[k]}×${k}`).join(" ") || "—";
}

/* ==========================================================================
   EVENT DECISION
   ========================================================================= */
function sheetEvent(qid){
  const q = S.events.find(e=>e.id===qid); if(!q) return;
  const ev = EVENTS.find(e=>e.id===q.evId);
  const sh = S.ships.find(s=>s.id===q.shipId);
  if(!ev || !sh){ S.events = S.events.filter(e=>e.id!==qid); dirty(); return; }
  const ctx = eventCtx(q);
  showSheet(esc(ev.title), esc(sh.name),
    `<div class="card" style="margin:0 0 14px"><div class="sm">${ev.body(ctx)}</div></div>`
    + ev.opts.map((o,i)=>`<div class="card tap" style="margin-bottom:9px" onclick="resolveEvent('${qid}',${i})">
        <div class="b sm">${esc(o.t)}</div>
        <div class="xs mut" style="margin-top:3px">${esc(o.d)}</div>
        ${o.fx({...ctx}).gamble!==undefined?`<span class="pill warn" style="margin-top:7px">Risk</span>`:""}
      </div>`).join("")
    + `<div class="xs mut2" style="margin-top:4px">Unanswered after three days, the first option is taken for you.</div>`);
}

/* ==========================================================================
   UNLOCKS — layer the systems in, and say why each now matters
   ========================================================================= */
function onUnlockCheck(){
  const n = S.voyagesDone;
  const c = (k,t,b)=>{ if(n>=k) coach("u"+k+t.slice(0,4), t, b); };
  if(n>=CFG.UNLOCK.bunkers) coach("u_bunkers","Bunkers are yours to buy","Fuel is the biggest voyage cost you control. Prices differ by hundreds of dollars a tonne between ports — lift where it is cheap. Each idle ship has a <b>Bunker</b> button.");
  if(n>=CFG.UNLOCK.ballast) coach("u_ballast","Watch the empty leg","Getting to the cargo costs fuel and days and earns nothing. Cards now show the ballast leg and how much cargo is on offer where the voyage <i>ends</i>. Discharging into a dead end is how a good rate becomes a bad quarter.");
  if(n>=CFG.UNLOCK.eca) coach("u_eca","Emission control areas","Inside an ECA you must burn 0.1% sulphur MGO, about a third dearer than VLSFO. Short Baltic and North Sea trades burn it the whole way.");
  if(n>=CFG.UNLOCK.speed) coach("u_speed","Now choose your speed","Consumption rises with roughly the cube of speed, so two knots off can cut daily burn by a third — at the cost of days. Which way is right depends on the freight rate and the bunker price, and it moves.");
  if(n>=CFG.UNLOCK.market) coach("u_market","The market has a shape","The Market tab is open. Freight runs in cycles of four to five years and the segments do not move together. Knowing where you are in the cycle is what separates an owner from an operator.");
  if(n>=CFG.UNLOCK.demurrage) coach("u_dem","Laytime and demurrage","Charter parties allow a fixed time for cargo work. Beat it and the charterer pays you demurrage; run over and you hand back despatch.");
  if(n>=CFG.UNLOCK2.canal) coach("u_canal","Canal or the Cape","Suez and Panama save thousands of miles and charge for it on your tonnage. Every fixture now lets you choose, and for a big ship in a soft market the Cape is sometimes cheaper. Panama simply will not take a Capesize.");
  if(n>=CFG.UNLOCK2.timecharter) coach("u_tc","Charter her out","You can now fix a ship on time charter: a fixed rate per day, the charterer pays bunkers and port costs. Long charters price off where the market expects to be — above spot in a slump, below it in a boom. Certainty has a price.");
  if(n>=CFG.UNLOCK2.survey) coach("u_survey","Class is not optional","Intermediate surveys fall every two and a half years, special surveys every five. Weeks in drydock earning nothing, and a bill that grows with age and neglect. You can defer once. It costs you.");
  if(n>=CFG.UNLOCK2.psc) coach("u_psc","Port State Control","Inspectors board and check her against the conventions. A hard-run ship on a weak flag gets boarded more and detained more, and detention follows your name.");
