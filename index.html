<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0B1622">
<title>Kription — Shipping Tycoon</title>
<style>
/* ============================================================================
   PALETTE / RESET
   ========================================================================= */
:root{
  --bg:#0B1622; --surf:#132433; --surf2:#182E40; --line:#1E3648; --line2:#274A63;
  --txt:#E6EDF3; --mut:#7D96AC; --mut2:#5A748A;
  --pos:#3FB27F; --neg:#E05252; --haz:#F08A24; --acc:#4A9EDA;
  --sat:44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--txt);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ============================================================================
   PHONE FRAME — portrait first, centred column on desktop
   ========================================================================= */
#app{
  max-width:430px;margin:0 auto;min-height:100%;
  display:flex;flex-direction:column;position:relative;
  background:var(--bg);
}
@media(min-width:520px){
  body{background:#060D14}
  #app{border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh}
}

/* ---- top bar ---- */
#top{
  position:sticky;top:0;z-index:40;background:rgba(11,22,34,.94);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
}
#top .row{display:flex;align-items:center;gap:10px}
#top .kpi{flex:1;min-width:0}
#top .kpi .lbl{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut2);white-space:nowrap}
#top .kpi .val{font-size:16px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clockbtn{
  min-width:56px;height:var(--sat);padding:0 8px;border-radius:10px;
  background:var(--surf);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
#clockbtn .d{font-size:9.5px;color:var(--mut);letter-spacing:.02em}
#clockbtn .s{font-size:13px;font-weight:700;color:var(--acc)}
#clockbtn.paused .s{color:var(--haz)}
/* Auto-paused: the clock is the one thing the player needs to find. */
#clockbtn.autop{border-color:var(--haz);animation:pulseHaz 1.8s ease-in-out infinite}
@keyframes pulseHaz{0%,100%{box-shadow:0 0 0 0 rgba(240,138,36,.45)}50%{box-shadow:0 0 0 8px rgba(240,138,36,0)}}

#pausebar{
  display:none;align-items:center;gap:9px;margin-top:8px;padding:7px 9px 7px 11px;
  border-radius:10px;background:rgba(240,138,36,.13);
  border:1px solid rgba(240,138,36,.38);color:var(--haz);
}
#pausebar.on{display:flex}
#pausebar .r{flex:1;min-width:0;font-size:12px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pausebar button{
  flex:none;min-height:44px;padding:0 15px;border-radius:8px;font-size:12.5px;font-weight:700;
  background:var(--haz);color:#160A02;border:0;
}

/* ---- scroll region ---- */
#screen{
  flex:1;padding:12px 12px calc(env(safe-area-inset-bottom) + 78px);
  -webkit-overflow-scrolling:touch;
}

/* ---- bottom tabs ---- */
#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  max-width:430px;margin:0 auto;
  background:rgba(11,22,34,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
#tabs button{
  flex:1;min-height:var(--sat);padding:7px 2px 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--mut2);position:relative;
}
#tabs button .ic{width:22px;height:22px;display:block}
#tabs button .tl{font-size:10px;letter-spacing:.02em;font-weight:600}
#tabs button[aria-selected="true"]{color:var(--acc)}
#tabs button .dot{
  position:absolute;top:5px;right:calc(50% - 17px);width:7px;height:7px;border-radius:50%;
  background:var(--haz);border:1.5px solid var(--bg);
}

/* ============================================================================
   PRIMITIVES
   ========================================================================= */
h2.sect{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);
  margin:20px 2px 8px;font-weight:700}
h2.sect:first-child{margin-top:2px}

.card{
  background:var(--surf);border:1px solid var(--line);border-radius:14px;
  padding:13px;margin-bottom:10px;position:relative;
}
.card.tap{cursor:pointer;transition:background .12s}
.card.tap:active{background:var(--surf2)}

.btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  min-height:var(--sat);width:100%;border-radius:12px;font-weight:650;font-size:15px;
  background:var(--surf2);border:1px solid var(--line2);
}
.btn:active{filter:brightness(1.18)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#04121E}
.btn.pos{background:var(--pos);border-color:var(--pos);color:#04120C}
.btn.dang{background:transparent;border-color:var(--neg);color:var(--neg)}
/* Small buttons are still full-height targets — 44px is the floor everywhere a
   thumb has to land, which is the whole point of a one-handed game. */
.btn.sm{min-height:44px;font-size:13.5px;border-radius:10px;width:auto;padding:0 14px}
.btn:disabled{opacity:.4}
.btn.pulse{animation:pulse 1.9s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(74,158,218,.42)}50%{box-shadow:0 0 0 9px rgba(74,158,218,0)}}

.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mut{color:var(--mut)}.mut2{color:var(--mut2)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.haz{color:var(--haz)}.acc{color:var(--acc)}
.xs{font-size:11px}.sm{font-size:12.5px}.lg{font-size:19px}.xl{font-size:27px}
.b{font-weight:650}.bb{font-weight:750}
.mono{font-variant-numeric:tabular-nums}

.pill{
  display:inline-flex;align-items:center;gap:4px;padding:2.5px 8px;border-radius:20px;
  font-size:10.5px;font-weight:700;letter-spacing:.03em;
  background:var(--surf2);color:var(--mut);border:1px solid var(--line);
}
.pill.on{background:rgba(63,178,127,.14);color:var(--pos);border-color:rgba(63,178,127,.32)}
.pill.warn{background:rgba(240,138,36,.14);color:var(--haz);border-color:rgba(240,138,36,.32)}
.pill.bad{background:rgba(224,82,82,.14);color:var(--neg);border-color:rgba(224,82,82,.32)}
.pill.idle{background:rgba(74,158,218,.12);color:var(--acc);border-color:rgba(74,158,218,.3)}

.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .3s}
.bar.pos i{background:var(--pos)} .bar.warn i{background:var(--haz)} .bar.bad i{background:var(--neg)}

.seg{display:flex;gap:4px;background:var(--surf);border:1px solid var(--line);
  border-radius:11px;padding:3px;margin-bottom:12px}
.seg button{flex:1;min-height:44px;border-radius:8px;font-size:13px;font-weight:650;color:var(--mut)}
.seg button[aria-selected="true"]{background:var(--surf2);color:var(--txt)}
/* A segmented control listing something open-ended — the idle ships, say —
   scrolls sideways instead of squeezing every option to nothing. */
.seg.scroll{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.seg.scroll::-webkit-scrollbar{display:none}
.seg.scroll button{flex:0 0 auto;padding:0 15px}

.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
  border-bottom:1px solid rgba(30,54,72,.6);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--mut);min-width:0}
.kv .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.kv.tot{border-top:1px solid var(--line2);border-bottom:0;margin-top:4px;padding-top:9px;font-size:14.5px}
.kv.tot .k{color:var(--txt);font-weight:650}
.kv.stack{display:block}
.kv.stack .v{display:block;text-align:left;white-space:normal;margin-top:3px;font-weight:600}

/* term — inline glossary affordance */
.term{border-bottom:1px dotted var(--mut2);cursor:pointer}
.term::after{content:"\00a0ⓘ";font-size:.78em;color:var(--mut2);border:0}
.term.fresh{color:var(--acc);border-bottom-color:var(--acc)}
.term.fresh::after{color:var(--acc)}

.empty{text-align:center;padding:38px 20px;color:var(--mut2)}
.empty .big{font-size:34px;margin-bottom:10px;opacity:.5}

.lock{text-align:center;padding:46px 22px;color:var(--mut2)}
.lock .big{font-size:32px;opacity:.4;margin-bottom:12px}
.lock .t{color:var(--mut);font-weight:650;font-size:15px;margin-bottom:6px}

/* ============================================================================
   BOTTOM SHEET
   ========================================================================= */
#scrim{
  position:fixed;inset:0;z-index:60;background:rgba(4,10,16,.66);
  opacity:0;pointer-events:none;transition:opacity .22s;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:430px;margin:0 auto;
  background:var(--surf);border:1px solid var(--line);border-bottom:0;
  border-radius:20px 20px 0 0;max-height:88vh;display:flex;flex-direction:column;
  transform:translateY(102%);transition:transform .27s cubic-bezier(.2,.8,.2,1);
}
#sheet.on{transform:translateY(0)}
#sheet .grab{padding:9px 0 3px;display:flex;justify-content:center;flex:none}
#sheet .grab i{width:38px;height:4px;border-radius:2px;background:var(--line2);display:block}
#sheet .shead{padding:2px 16px 10px;flex:none;border-bottom:1px solid var(--line)}
#sheet .shead .t{font-size:17px;font-weight:700;letter-spacing:-.01em}
#sheet .shead .s{font-size:12.5px;color:var(--mut);margin-top:2px}
#sheet .sbody{
  padding:12px 16px calc(env(safe-area-inset-bottom) + 16px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;
}
#sheet .sfoot{
  padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);
  border-top:1px solid var(--line);flex:none;background:var(--surf);
}

/* ============================================================================
   COACH (onboarding callout)
   ========================================================================= */
#coach{
  position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 84px);
  z-index:55;max-width:406px;margin:0 auto;
  background:var(--acc);color:#04121E;border-radius:14px;padding:13px 14px;
  box-shadow:0 12px 32px rgba(0,0,0,.5);
  transform:translateY(14px);opacity:0;pointer-events:none;transition:all .25s;
}
#coach.on{transform:translateY(0);opacity:1;pointer-events:auto}
#coach .ct{font-weight:750;font-size:14px;margin-bottom:3px}
#coach .cb{font-size:13.5px;line-height:1.42;opacity:.86}
#coach button{margin-top:10px;background:rgba(4,18,30,.14);border-radius:9px;
  min-height:44px;padding:0 18px;font-weight:750;font-size:13px;float:right}

/* ============================================================================
   TOAST
   ========================================================================= */
#toasts{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 62px);
  z-index:70;max-width:406px;margin:0 auto;pointer-events:none}
.toast{
  background:var(--surf2);border:1px solid var(--line2);border-radius:12px;
  padding:10px 13px;margin-bottom:7px;font-size:13.5px;
  box-shadow:0 8px 24px rgba(0,0,0,.44);
  animation:tin .28s ease both;
}
.toast.good{border-color:rgba(63,178,127,.5)}
.toast.bad{border-color:rgba(224,82,82,.5)}
.toast.warn{border-color:rgba(240,138,36,.5)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}

/* ============================================================================
   CHART
   ========================================================================= */
svg.spark{display:block;width:100%;height:38px;overflow:visible}
svg.chart{display:block;width:100%;height:150px;overflow:visible}
svg .gl{stroke:var(--line);stroke-width:1}
svg .ax{fill:var(--mut2);font-size:9px}

input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:var(--sat);background:transparent;
}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--acc);
  margin-top:-10px;border:3px solid var(--surf);box-shadow:0 1px 5px rgba(0,0,0,.5);
}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:3px solid var(--surf);
  border-radius:50%;background:var(--acc)}

#banner{
  background:rgba(240,138,36,.15);border:1px solid rgba(240,138,36,.4);color:var(--haz);
  border-radius:11px;padding:9px 12px;font-size:12.5px;margin-bottom:11px;display:none;
}
#ver{display:inline-block;padding:6px 2px;color:var(--mut2);font-size:11px;user-select:none}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="row">
      <div class="kpi"><div class="lbl">Cash</div><div class="val tnum" id="k-cash">—</div></div>
      <div class="kpi"><div class="lbl">Net / day</div><div class="val tnum" id="k-net">—</div></div>
      <div class="kpi" style="flex:.72"><div class="lbl">Util</div><div class="val tnum" id="k-util">—</div></div>
      <button id="clockbtn" aria-label="Game speed"><span class="d" id="k-date">—</span><span class="s" id="k-spd">1×</span></button>
    </div>
    <div id="pausebar"><span class="r" id="pb-r"></span><button id="pb-go">Resume</button></div>
  </div>
  <div id="screen"></div>
</div>
<nav id="tabs" role="tablist"></nav>
<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true">
  <div class="grab"><i></i></div>
  <div class="shead"><div class="t" id="sh-t"></div><div class="s" id="sh-s"></div></div>
  <div class="sbody" id="sh-b"></div>
  <div class="sfoot" id="sh-f" style="display:none"></div>
</div>
<div id="coach"><div class="ct" id="co-t"></div><div class="cb" id="co-b"></div><button id="co-ok">Got it</button><div style="clear:both"></div></div>
<div id="toasts"></div>
<script>
"use strict";
/* ############################################################################
   §CONSTANTS — every tunable lives here. Nothing below this block invents a
   number. Sources are contemporary (2025/26) market conditions; each entry
   carries the range I'd expect it to move within so it can be retuned without
   reading a line of UI code.
   ######################################################################### */

const CFG = {
  VERSION: "0.1.0-p1",
  SAVE_KEY: "kription.save.v1",

  /* --- time -------------------------------------------------------------- */
  SEC_PER_DAY: 5,          // 1 game day = 5 real seconds at 1x
  SPEEDS: [1, 2, 4, 24],
  START_EPOCH: Date.UTC(2026, 0, 6),   // Tue 6 Jan 2026
  MAX_STEP_DAYS: 0.5,      // sim integration granularity

  /* --- offline ----------------------------------------------------------- */
  // Ships complete the voyage they are on and then go IDLE — decisions are
  // deferred, never auto-resolved. That bounds offline gain naturally; the cap
  // below exists so OPEX/market don't run away over a long absence.
  OFFLINE_CAP_DAYS: 90,
  AUTOSAVE_MS: 10000,

  /* --- opening position -------------------------------------------------- */
  START_CASH: 4000000,
  START_SHIP: { cls: "handysize", name: "Kription Trader", built: 2004, port: "riga",
                ltv: 0.60, rate: 0.070, termYears: 12 },

  /* --- finance ----------------------------------------------------------- */
  // Voyage charterparties pay the bulk of the freight against the bill of lading
  // — i.e. once cargo is loaded — with the balance on right and true delivery.
  // Crediting it all on discharge made the player fund an entire long voyage out
  // of pocket, which bankrupted profitable fixtures before they ever paid.
  FREIGHT_ON_BL: 0.95,
  COMM_ADDRESS: 0.025,     // address commission to charterer, 2.5% typical
  COMM_BROKER:  0.0125,    // brokerage 1.25%
  OPEX_AGE_SLOPE: 0.012,   // +1.2%/yr of OPEX per year over 10; older = dearer

  /* --- bunkers ----------------------------------------------------------- */
  // Base prices $/mt at the reference hub; per-port offsets in PORTS.bunker.
  // 2025 ranges: VLSFO 480-620, MGO 660-820, HSFO 400-500.
  FUEL: {
    vlsfo: { name: "VLSFO", base: 515, co2: 3.151, ghg: 91.6, eca: false },
    mgo:   { name: "MGO",   base: 690, co2: 3.206, ghg: 90.8, eca: true  },
    hsfo:  { name: "HSFO",  base: 425, co2: 3.114, ghg: 91.7, eca: false, scrubber: true },
  },
  EMERGENCY_LIFT_PREMIUM: 0.08,   // bunkering in a hurry costs more

  /* --- carbon ------------------------------------------------------------ */
  ETS_PHASE: 1.00,         // 2026 onward: 100% of the chargeable share
  EUA_EUR: 72,             // €/t CO2
  EUR_USD: 1.08,
  FUELEU_TARGET: 89.34,    // gCO2e/MJ, 2025-2029 (-2% on the 91.16 baseline)
  FUELEU_PENALTY_EUR: 2400,// € per tonne VLSFO-equivalent energy deficit
  MJ_PER_MT: 41000,

  /* --- freight market --------------------------------------------------- */
  // Index 100 == mid-cycle. Amplitude 0.55 gives a 45..155 band, which is a
  // fair likeness of how far dry bulk actually travels peak-to-trough.
  MKT: {
    cycleDays: 1650,       // ~4.5yr wave — the long shipping cycle
    // A single sine is a script, not a cycle: it puts the peak and the crash on
    // the same day of every run. A second, shorter wave at an unrelated period
    // breaks the pattern up, and both waves start at a phase drawn per run.
    cycleDays2: 610,       // ~20mo secondary swing
    longShare: 0.72,       // weight of the long wave in the combined swing
    // Where a run joins the long cycle, in radians. Bounded so the opening is
    // never a depression — the first voyages were calibrated around mid-cycle —
    // but wide enough that the peak lands anywhere from day 85 to day 480 and
    // the trough from roughly day 900 to day 1300.
    phaseRange: [-0.25, 1.25],
    amp: 0.55,
    // A sine spends as long at its extremes as anywhere else. Freight markets do
    // not: they sit near normal and lurch, which is why "mid-cycle" is a useful
    // word. Raising the swing to a power above 1 keeps the peak and the trough
    // exactly as deep while cutting the time spent down there — the share of the
    // cycle below index 70 falls from about 37% to 28%, and the deep-bust share
    // from 20% to 13%. The bust still arrives and still hurts; it stops being
    // six hundred days of the same answer.
    shape: 1.35,
    ar: 0.965,             // AR(1) persistence of the noise term
    shock: 0.030,          // daily innovation sd
    min: 32, max: 260,
    startIndex: 112,       // opening market: a shade above mid-cycle
    histEvery: 5,          // sample the index every N days for charts
    histMax: 400,
  },
  FIXTURE_REFRESH_DAYS: 4, // the board turns over about twice a week
  FIXTURE_MAX_AGE: 12,     // an offer stays on the board this long before it lapses
  FIXTURE_NOISE: 0.10,     // ±10% dispersion between competing brokers

  /* --- progressive disclosure -------------------------------------------- */
  // Nothing appears before the player has a reason to care about it (§6).
  UNLOCK: {
    bunkers:  3,   // lift quantity + port price differentials
    ballast:  4,   // the empty leg becomes visible and costed
    eca:      5,   // fuel switching inside emission control areas
    speed:    6,   // the speed/consumption trade-off
    market:   8,   // index history, bunker prices by port
    demurrage:10,  // laytime, demurrage and despatch
  },
};

/* ----------------------------------------------------------------------------
   VESSEL CLASSES
   consLaden is TOTAL mt/day at designSpeed. The model splits it into a fixed
   auxiliary load (auxSea) plus a propulsion term that scales with the cube of
   speed — real curves flatten at low speed because hotel/aux load does not
   scale, and pure-cube would flatter slow steaming.
   tpc = tonnes per cm immersion (stored, not derived — the usual formulae are
   badly wrong across this size range).
   grainCubic m3 with the cargo stowage factor is what actually limits light
   cargoes; ore is deadweight-limited. Both constraints are live.
------------------------------------------------------------------------------- */
const CLASSES = {
  handysize:   { name:"Handysize",    seg:"dry", idx:"handy", dwt:28200,  gt:20000,  tpc:38,
                 grainCubic:37000,  designSpeed:14.0, consLaden:24, auxSea:2.0, auxPort:3.0,
                 minSpeed:9, maxSpeed:15, draft:10.2, beam:23.0, loa:180, geared:true, swl:30,
                 fuelCap:1200, ldt:6800,  nb:27e6,  sh15:8.0e6,  opexBase:4300, life:25 },
  handymax:    { name:"Handymax",     seg:"dry", idx:"handy", dwt:47000,  gt:27000,  tpc:50,
                 grainCubic:60000,  designSpeed:14.0, consLaden:27, auxSea:2.2, auxPort:3.2,
                 minSpeed:9, maxSpeed:15, draft:11.7, beam:30.0, loa:190, geared:true, swl:30,
                 fuelCap:1600, ldt:9200,  nb:31e6,  sh15:12e6,   opexBase:4700, life:25 },
  supramax:    { name:"Supramax",     seg:"dry", idx:"handy", dwt:58000,  gt:33000,  tpc:58,
                 grainCubic:72000,  designSpeed:14.0, consLaden:30, auxSea:2.4, auxPort:3.4,

const GLOSSARY = {
  tce:      ["TCE", "Time Charter Equivalent — voyage profit divided by total voyage days, ballast and port time included. The one number the whole industry is judged on."],
  ballast:  ["Ballast leg", "Sailing empty to reach your next cargo. You burn fuel and spend days earning nothing, so where a voyage ends matters as much as what it pays."],
  laden:    ["Laden leg", "Sailing with cargo aboard — the only part of a voyage that earns freight."],
  opex:     ["OPEX", "Daily running cost whatever the ship is doing: crew, stores, lubricants, insurance, maintenance and management fee."],
  da:       ["Port disbursements", "The bill for calling at a port: dues, pilotage in and out, towage, agency, linesmen. Set by the port, not by you."],
  bunkers:  ["Bunkers", "Marine fuel. The largest voyage cost you actually control, through speed and where you buy it."],
  vlsfo:    ["VLSFO", "Very Low Sulphur Fuel Oil, 0.5% sulphur. The standard fuel outside emission control areas."],
  mgo:      ["MGO", "Marine Gas Oil, 0.1% sulphur. Mandatory inside emission control areas and roughly 35% dearer than VLSFO."],
  hsfo:     ["HSFO", "High Sulphur Fuel Oil. Cheapest fuel, but only legal if the ship has a scrubber fitted."],
  eca:      ["ECA", "Emission Control Area — North Sea, Baltic, North America, Caribbean and the Mediterranean. Inside one you must burn 0.1% sulphur fuel, which costs more."],
  dwt:      ["DWT", "Deadweight tonnes: cargo, bunkers, stores and fresh water the ship can carry. The headline measure of a bulk carrier's size."],
  fiost:    ["FIOST", "Free In and Out, Stowed and Trimmed — the charterer pays for loading and discharging. The usual terms in dry bulk."],
  laytime:  ["Laytime", "The time the charterer is allowed for loading and discharging. Run over it and they owe you demurrage; finish early and you may owe them despatch."],
  demurrage:["Demurrage", "Compensation the charterer pays you, per day, for port time beyond the agreed laytime."],
  despatch: ["Despatch", "A rebate you pay the charterer for finishing cargo operations early. Usually half the demurrage rate."],
  geared:   ["Geared", "The ship has her own cranes, so she can work at ports with no shore cranes. Gearless ships are cheaper to run but shut out of those berths."],
  stowage:  ["Stowage factor", "Cubic metres a tonne of cargo occupies. Light cargoes fill the holds before they fill the deadweight; ore does the opposite."],
  draft:    ["Draft", "How deep the ship sits. If a port is shallower than your loaded draft you must sail part-empty, and you carry less cargo for the same voyage cost."],
  ets:      ["EU ETS", "The EU carbon market. Shipping pays for CO2 on EU voyages — all of it inside the EU, half on voyages in or out."],
  fueleu:   ["FuelEU", "An EU limit on the greenhouse-gas intensity of the fuel you burn. Miss the target and you pay a penalty per tonne of shortfall."],
  index:    ["Freight index", "A market-wide measure of what ships of a given size are earning. 100 is mid-cycle; the market genuinely goes to 40 and to 250."],
  liquidity:["Market liquidity", "How much cargo is on offer out of a port. Discharging somewhere thin means a long empty leg to your next fixture."],
  addcomm:  ["Address commission", "A discount, typically 2.5%, that the charterer deducts from the freight. Brokerage is another 1.25% on top."],
  ltv:      ["LTV", "Loan to value — debt as a share of the ship's market value. Banks set a ceiling, and if values fall through it you must repay or post cash."],
  wcap:     ["Working capital", "The cash you must find to fund a voyage before the freight advance arrives — bunkers, port dues, running costs and debt service. A voyage can be profitable and still be one you cannot afford."],
  blading:  ["Bill of lading", "The receipt for cargo loaded. Voyage charters pay most of the freight against it, so the money arrives once she is loaded rather than when she discharges."],
  slowsteam:["Slow steaming", "Cutting speed to save fuel. Consumption falls with roughly the cube of speed, so a small speed cut saves a lot of fuel — at the cost of days."],
};

/* ############################################################################
   §MODEL — pure functions. No state, no DOM. Everything here can be lifted out
   and unit-tested; the UI only ever reads what these return.
   ######################################################################### */

const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp  = (a,b,t)=>a+(b-a)*t;

/* --- deterministic PRNG so a seeded run reproduces exactly ---------------- */
function mulberry(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Box-Muller, cached
let _g2 = null;
function gauss(rnd){
  if(_g2 !== null){ const v=_g2; _g2=null; return v; }
  let u=0,v=0; while(u===0) u=rnd(); while(v===0) v=rnd();
  const r=Math.sqrt(-2*Math.log(u)), th=2*Math.PI*v;
  _g2 = r*Math.sin(th); return r*Math.cos(th);
}

/* ==========================================================================
   ROUTING — Dijkstra over the port/hub sea graph, with canal awareness.
   Returns { nm, ecaNm, canals, path }. Canal edges are tagged in the graph, so
   Suez-versus-Cape is a consequence of the network and the ship's dimensions,
   never a scripted special case. `avoid` removes canals from the graph, which is
   how the player buys the long way round.
   ========================================================================= */
const _graph = (function build(){
  const g = {};
  const add = (a,b,nm,eca,canal)=>{
    (g[a] ||= []).push({ to:b, nm, eca, canal });
    (g[b] ||= []).push({ to:a, nm, eca, canal });
  };
  for(const e of HUB_EDGES) add("#"+e[0], "#"+e[1], e[2], e[3], e[4]);
  for(const [id,p] of Object.entries(PORTS))
    for(const [h,nm] of Object.entries(p.hub)) add(id, "#"+h, nm, p.eca ? 1.0 : 0.0);
  return g;
})();

const _routeCache = new Map();
function seaRoute(from, to, avoid){
  if(from === to) return { nm:0, ecaNm:0, canals:{}, path:[from] };
  const key = from+">"+to+"|"+(avoid ? [...avoid].sort().join(",") : "");
  const hit = _routeCache.get(key); if(hit) return hit;

  const dist = { [from]:0 }, eca = { [from]:0 }, prev = {}, canals = { [from]:{} };
  const done = new Set();
  // ~90 nodes; a linear scan beats a heap here and keeps the code honest.
  for(;;){
    let cur=null, best=Infinity;
    for(const n in dist) if(!done.has(n) && dist[n]<best){ best=dist[n]; cur=n; }
    if(cur===null || cur===to) break;
    done.add(cur);
    for(const e of (_graph[cur]||[])){
      if(e.canal && avoid && avoid.has(e.canal)) continue;
      const nd = best + e.nm;
      if(nd < (dist[e.to] ?? Infinity)){
        dist[e.to] = nd;
        eca[e.to]  = eca[cur] + e.nm * e.eca;
        prev[e.to] = cur;
        canals[e.to] = e.canal ? Object.assign({}, canals[cur], {[e.canal]:1}) : canals[cur];
      }
    }
  }
  const path = [];
  if(dist[to] !== undefined){ let n = to; while(n !== undefined){ path.unshift(n); n = prev[n]; } }
  const out = { nm: Math.round(dist[to] ?? 0), ecaNm: Math.round(eca[to] ?? 0),
                canals: canals[to] || {}, path };
  _routeCache.set(key, out);
  return out;
}

/* Which canals can this ship physically use today? Panama excludes anything
   over 51.25 m in the beam, which is every Capesize ever built. */
function canalsAllowed(cls, drought){
  const out = new Set();
  const S_ = CFG.CANAL.suez, P_ = CFG.CANAL.panama;
  if(cls.draft <= S_.maxDraft && cls.beam <= S_.maxBeam) out.add("suez");
  const pDraft = drought ? CFG.PANAMA_DROUGHT.draft : P_.maxDraft;
  if(cls.draft <= pDraft && cls.beam <= P_.maxBeam && (cls.loa||0) <= P_.maxLoa) out.add("panama");
  return out;
}

/* Route a specific ship, honouring her dimensions and the player's preference. */
function routeFor(cls, from, to, opts){
  opts = opts || {};
  const allowed = canalsAllowed(cls, opts.drought);
  const avoid = new Set();
  for(const c of ["suez","panama"]) if(!allowed.has(c)) avoid.add(c);
  if(opts.avoidCanals) for(const c of opts.avoidCanals) avoid.add(c);
  // The Northern Sea Route is shut unless it is the season, the ship is ice
  // classed, and the player has actually chosen to use it.
  if(!(opts.nsr && (cls.ice||0) >= 2 && NSR_MONTHS[opts.month|0])) avoid.add("nsr");
  const r = seaRoute(from, to, avoid.size ? avoid : null);
  // The alternative with every shortcut shut, so the player can see the trade.
  const alt = seaRoute(from, to, new Set(["suez","panama","nsr"]));
  return { nm:r.nm, ecaNm:r.ecaNm, canals:r.canals, path:r.path,
           altNm:alt.nm, altEcaNm:alt.ecaNm, blocked:[...avoid] };
}

/* Canal toll on regressive tonnage tiers; ballast discounted. */
function canalToll(cls, canal, laden, drought){
  const C = CFG.CANAL[canal]; if(!C) return 0;
  let rate = C.tiers[C.tiers.length-1][1];
  for(const [cap, r] of C.tiers) if(cls.dwt <= cap){ rate = r; break; }
  let toll = cls.teu ? cls.teu * C.teu : cls.dwt * rate;
  if(!laden) toll *= C.ballast;
  if(canal === "panama"){
    toll += C.slotFee * (drought ? lerp(CFG.PANAMA_DROUGHT.slotMult[0], CFG.PANAMA_DROUGHT.slotMult[1], 0.5) : 1);
  }
  return Math.round(toll);
}

/* Weather: average speed loss over a path, by basin and month. Not a forecast
   model — a seasonal distribution, which produces the same behaviour. */
function weatherLoss(path, month){
  let worst = 0, hits = 0;
  for(const node of path){
    if(node[0] !== "#") continue;
    const hub = node.slice(1);
    for(const w of Object.values(CFG.WEATHER))
      if(w.hubs.includes(hub)){ worst = Math.max(worst, w.loss[month]); hits++; }
  }
  return hits ? worst : 0;
}

/* Ice: Baltic and Arctic ports in winter. Without matching ice class you wait. */
function iceDelay(port, month, cls, rnd){
  if(!port.ice || !CFG.ICE.months[month]) return 0;
  const need = port.ice, have = cls.ice || 0;
  const band = have >= need ? CFG.ICE.classDelay : CFG.ICE.noClassDelay;
  return lerp(band[0], band[1], rnd ? rnd() : 0.5) * (have >= need ? 1 : need);
}

/* War risk: premium on hull value per transit, plus a crew bonus. */
function warRisk(path, shipValue){
  const out = [];
  for(const node of path){
    if(node[0] !== "#") continue;
    const hub = node.slice(1);
    for(const [id,z] of Object.entries(CFG.WARRISK))
      if(z.hubs.includes(hub) && !out.find(o=>o.id===id))
        out.push({ id, name:z.name, cost: shipValue*z.prem + z.crew, guards:z.guards, guardCut:z.guardCut });
  }
  return out;
}

/* ==========================================================================
   VESSEL PHYSICS
   ========================================================================= */

/* Daily fuel burn at a given speed.
   Fixed auxiliary load + propulsion term scaling with the cube of speed.
   Ballast propulsion is ~87% of laden at the same speed (less displacement,
   worse propeller immersion partly offsets the lighter hull). */
function burnAt(cls, speed, laden){
  const propRef = cls.consLaden - cls.auxSea;
  const prop = (laden ? propRef : propRef*0.87) * Math.pow(speed/cls.designSpeed, 3);
  return cls.auxSea + prop;
}

/* How much cargo actually goes aboard.
   min( deadweight less bunkers/stores/constants,
        deadweight the port's draft allows,
        hold cubic divided by the cargo's stowage factor ) */
function cargoIntake(cls, cargo, loadPort, dischPort, robMt){
  const constants = cls.dwt * 0.022;                       // stores, FW, constants
  const dwtAvail  = cls.dwt - constants - Math.max(robMt, cls.fuelCap*0.12);
  const limitDraft = (port)=>{
    const short = cls.draft - Math.min(port.maxDraft, cls.draft);
    return cls.dwt - short*100*cls.tpc;                    // tpc is tonnes per cm
  };
  const draftLim = Math.min(limitDraft(loadPort), limitDraft(dischPort));
  const holdCbm  = cls.grainCubic || cls.cargoCbm || cls.dwt*1.25;
  const cubeLim  = holdCbm / cargo.sf;
  return Math.max(0, Math.floor(Math.min(dwtAvail, draftLim, cubeLim)));
}

/* Cargo operation days at a port, from the terminal's real productivity. */
function portDays(cargo, port, qty, loading){
  const rate = (loading ? cargo.load : cargo.disch) * port.rateFactor;
  return qty / rate + 0.5;                                 // +0.5d berthing/survey/documents
}

/* Port disbursements, scaled off the port's Handysize-reference figure. */
function portDA(port, cls){
  return Math.round(port.da * Math.pow(cls.gt/20000, 0.55) * shoreFx("portDaMult"));
}

/* Bunker price $/mt for a grade at a port; null if not available there. */
function bunkerPrice(port, grade, mkt){
  const off = port.bunker && port.bunker[grade];
  if(off === undefined || off === null) return null;
  return Math.round((CFG.FUEL[grade].base * (mkt ? mkt.oil : 1) + off) * shoreFx("bunkerMult"));
}

/* Daily OPEX — older tonnage costs more to keep in class. */
function opexDay(cls, ageYears){
  return Math.round(cls.opexBase * (1 + CFG.OPEX_AGE_SLOPE * Math.max(0, ageYears-10)));
}

/* The hull condition a ship of this age would normally be in. */
function expectedHull(ageYears){
  return clamp(1 - Math.max(0, ageYears-8)*0.012, 0.55, 1);
}

/* OPEX as actually charged: age, flag and CONDITION.
   The condition penalty is for neglect, not for age. opexDay already prices age
   in, and hull condition starts degraded because of age — multiplying by raw
   hull charged the owner twice for the same grey hair. Only the shortfall
   against an age-appropriate hull is a penalty. */
function opexDayFull(cls, ageYears, ship){
  const neglect = ship ? clamp(expectedHull(ageYears) - (ship.hull ?? 1), 0, 1) : 0;
  // The management fee is carved OUT of the vessel and spent ashore instead (§SHORE),
  // so this is not a cost cut — it is the same money, moved somewhere you control.
  const exMgmt = 1 - (CFG.MGMT_FEE_SHARE || 0);
  // Crew is roughly half of OPEX, so a stretched crewing department lands at half rate.
  const crew = 1 + (shoreFx("crewCostMult") - 1)*0.5;
  return opexDay(cls, ageYears) * exMgmt * crew
       * ((ship && ship.flagMult) || 1) * (1 + neglect*0.6);
}

/* ==========================================================================
   CARBON
   ========================================================================= */
/* EU ETS: 100% of emissions on intra-EU voyages, 50% in or out, times the
   phase-in share. EU/EEA berth calls also count in full. */
function etsCost(fuelByGrade, scope){
  let co2 = 0;
  for(const [g,mt] of Object.entries(fuelByGrade)) co2 += mt * CFG.FUEL[g].co2;
  const chargeable = co2 * scope * CFG.ETS_PHASE;
  return { co2, chargeable, cost: chargeable * CFG.EUA_EUR * CFG.EUR_USD };
}

/* FuelEU Maritime: penalty on the GHG-intensity shortfall against the target. */
function fuelEuCost(fuelByGrade, scope){
  let mj = 0, wsum = 0;
  for(const [g,mt] of Object.entries(fuelByGrade)){
    const e = mt * CFG.MJ_PER_MT; mj += e; wsum += e * CFG.FUEL[g].ghg;
  }
  if(mj <= 0) return { intensity:0, cost:0 };
  const intensity = wsum / mj;
  const gap = intensity - CFG.FUELEU_TARGET;
  if(gap <= 0) return { intensity, cost:0 };
  const deficitG = gap * mj * scope;                        // gCO2e
  const eur = (deficitG / (intensity * CFG.MJ_PER_MT)) * CFG.FUELEU_PENALTY_EUR;
  return { intensity, cost: eur * CFG.EUR_USD };
}

/* EU carbon scope for a voyage: 1.0 intra-EU, 0.5 one end in the EU, else 0. */
const EU_CC = new Set(["NL","BE","DE","FR","GB","LV","EE","LT","PL","FI","SE","ES","IT","RO","GR","PT","DK","IE","BG","HR","SI","MT","CY"]);
// GB is post-Brexit outside EU ETS but inside the UK scheme at a similar price;
// treating it as in-scope keeps the North Sea trades honest without a second market.
function euScope(loadPort, dischPort){
  const a = EU_CC.has(loadPort.cc), b = EU_CC.has(dischPort.cc);
  return a && b ? 1.0 : (a || b) ? 0.5 : 0.0;
}

/* ==========================================================================
   FREIGHT MARKET
   Long cycle wave + AR(1) noise + seasonality, per segment, with the segments
   sharing part of their innovation so they move together without moving in
   lockstep. Phase 3 replaces the wave with an explicit supply/demand balance
   (orderbook, deliveries, scrapping, congestion); the interface stays the same.
   ========================================================================= */
function newMarket(seed){
  const rnd = mulberry(seed);
  const m = { rnd, oil:1.0, oilNoise:0, idx:{}, hist:{}, lastHist:0 };
  // WHERE THIS RUN JOINS THE CYCLE. Drawn once, from the seed, and shared by
  // every segment so they stay correlated. IDX_PHASE0 then offsets each segment
  // against that common starting point — Capesize turns before Handysize, boxes
  // swing on their own schedule — which is the part that is genuinely structural
  // and so is genuinely constant.
  const [lo, hi] = CFG.MKT.phaseRange;
  const p0 = lo + rnd()*(hi - lo);
  const q0 = rnd()*2*Math.PI;
  // Every index needs a phase and an amplitude; IDX_PHASE0/IDX_AMP cover all of
  // them, and the fallbacks make a newly added segment safe by construction.
  for(const k of Object.keys(INDEX_META)){
    const off = IDX_PHASE0[k] ?? 0;
    m.idx[k] = { v:CFG.MKT.startIndex, phase:p0 + off, phase2:q0 + off*1.7, noise:0,
                 amp:(IDX_AMP[k] ?? 1) * CFG.MKT.amp };
    m.hist[k] = [];
  }
  return m;
}

function stepMarket(m, dt, day){
  const K = CFG.MKT;
  // Bunker prices ride a slow random walk on crude; ±35% is a normal year.
  m.oilNoise = m.oilNoise*0.995 + gauss(m.rnd)*0.010*Math.sqrt(dt);
  m.oil = clamp(1 + m.oilNoise, 0.62, 1.55);

  const common = gauss(m.rnd) * K.shock * Math.sqrt(dt);
  const month = Math.floor((day % 365) / 30.42) % 12;

  for(const k of Object.keys(m.idx)){
    const s = m.idx[k];
    if(s.phase2 === undefined) s.phase2 = 0;      // markets saved before the second wave
    s.phase  += (2*Math.PI/K.cycleDays)  * dt;
    s.phase2 += (2*Math.PI/K.cycleDays2) * dt;
    // Two waves of unrelated period. Same peak-to-trough range as one sine, but
    // the path between them is irregular, so a falling market is not a straight
    // line down for six hundred days and a recovery can start early.
    const raw = K.longShare*Math.sin(s.phase) + (1-K.longShare)*Math.sin(s.phase2);
    const swing = Math.sign(raw) * Math.pow(Math.abs(raw), K.shape || 1);
    const wave = 1 + (s.amp ?? K.amp) * swing;
    // 55% shared innovation, 45% idiosyncratic — segments correlate, not couple.
    const inno = common*0.55 + gauss(m.rnd)*K.shock*Math.sqrt(dt)*0.45;
    s.noise = s.noise*Math.pow(K.ar, dt) + inno;
    const season = (SEASON[k] || SEASON.handy)[month];
    s.v = clamp(100 * wave * season * (1 + s.noise), K.min, K.max);
  }

  if(day - m.lastHist >= K.histEvery){
    m.lastHist = day;
    for(const k of Object.keys(m.idx)){
      const h = m.hist[k];
      h.push(Math.round(m.idx[k].v * 10) / 10);
      if(h.length > K.histMax) h.shift();
    }
  }
}

/* Freight $/mt for a route at today's market, with per-fixture dispersion. */
function routeRate(route, m, jitter){
  const seg = ROUTES_SEG(route);
  return route.rate * (m.idx[seg].v / 100) * (1 + jitter*CFG.FIXTURE_NOISE);
}
/* Which index prices a route — decided by the size band it invites. */
function ROUTES_SEG(route){
  const mid = (route.dwt[0]+route.dwt[1])/2;
  return mid >= 120000 ? "cape" : mid >= 70000 ? "pmx" : "handy";
}
/* ############################################################################
   §MODEL II — the full voyage estimate, plus compliance, employment pricing,
   asset trading, derivatives and liner economics. Still pure functions.
   ######################################################################### */

/* Which measure prices this cargo, and how much of it goes aboard. */
function intakeFor(cls, cargo, lp, dp, robMt){
  // Gas and car carriers trade on volume and units, not tonnes.
  if(cargo.gas)  return { qty: cls.cbm || 0,  unit:"m³" };
  if(cargo.ceu)  return { qty: cls.ceu || 0,  unit:"CEU" };
  if(cargo.reef) return { qty: Math.floor((cls.cuft||0)/35.31/cargo.sf), unit:"mt" };
  if(cargo.wet){
    // Tank capacity or deadweight, whichever bites, with draft on top.
    const byCbm = (cls.cargoCbm||cls.dwt) / cargo.sf;
    const q = Math.min(cargoIntake(cls, cargo, lp, dp, robMt), byCbm);
    return { qty: Math.max(0, Math.floor(q)), unit:"mt" };
  }
  return { qty: cargoIntake(cls, cargo, lp, dp, robMt), unit:"mt" };
}

/* ==========================================================================
   VOYAGE ESTIMATE — the one calculation everything settles against.
   Handles ballast positioning, weather, ice, ECA fuel switching, canal tolls and
   routing choice, war risk, carbon, laytime, and the four employment types.
   ========================================================================= */
function voyageEstimate(ship, fx, speed, mkt, opts){
  opts = opts || {};
  const cls   = CLASSES[ship.cls];
  const cargo = CARGOES[fx.cargo];
  const lp = PORTS[fx.load], dp = PORTS[fx.disch];
  const month = opts.month ?? 0;
  const hireMode = fx.hire ? fx.hire : null;      // time charter / COA hire basis

  // --- routing, with the ship's own dimensions deciding the canals -------
  const ropts = { month, drought: opts.drought, nsr: fx.nsr, avoidCanals: fx.avoidCanals };
  const bal = routeFor(cls, ship.port, fx.load, ropts);
  const lad = routeFor(cls, fx.load, fx.disch, ropts);

  // --- speed, degraded by the weather actually on the track -------------
  const sp0 = clamp(speed, cls.minSpeed, opts.speedCap ?? cls.maxSpeed);
  const wBal = weatherLoss(bal.path, month), wLad = weatherLoss(lad.path, month);
  const spBal = sp0 * (1 - wBal), spLad = sp0 * (1 - wLad);
  const balDays = spBal > 0 ? bal.nm/spBal/24 : 0;
  const ladDays = spLad > 0 ? lad.nm/spLad/24 : 0;
  const canalDays = Object.keys(bal.canals).concat(Object.keys(lad.canals))
                      .reduce((a,c)=>a+(CFG.CANAL[c] ? CFG.CANAL[c].days : 0), 0);

  // --- cargo and port time ---------------------------------------------
  const intake = intakeFor(cls, cargo, lp, dp, robTot(ship));
  const qty = Math.min(fx.qty || Infinity, intake.qty);
  // LNG boils off in transit; that is cargo you loaded and cannot discharge.
  const boilLoss = cls.boilOff ? qty * cls.boilOff * (balDays+ladDays) : 0;
  const qtyOut = Math.max(0, qty - boilLoss);

  const rateMult = opts.portRateMult || 1;
  const loadDays  = portDays(cargo, lp, qty, true)  / rateMult;
  const dischDays = portDays(cargo, dp, qtyOut, false) / rateMult;
  const ice = iceDelay(lp, month, cls, null) + iceDelay(dp, month, cls, null);
  // Product tankers changing between clean and dirty must clean tanks first.
  const cleanDays = (cargo.wet && ship.lastGrade && cargo.grade && ship.lastGrade !== cargo.grade) ? 1.6 : 0;
  const portTime = loadDays + dischDays + ice + cleanDays;
  const days = balDays + ladDays + portTime + canalDays + (opts.extraDelay || 0);

  // --- fuel -------------------------------------------------------------
  const burnBal = burnAt(cls, spBal, false), burnLad = burnAt(cls, spLad, true);
  const ecaBalD = bal.nm>0 ? balDays * (bal.ecaNm/bal.nm) : 0;
  const ecaLadD = lad.nm>0 ? ladDays * (lad.ecaNm/lad.nm) : 0;
  const seaMgo  = ecaBalD*burnBal + ecaLadD*burnLad;
  const seaMain = (balDays-ecaBalD)*burnBal + (ladDays-ecaLadD)*burnLad + canalDays*cls.auxPort;
  const portAll = loadDays + dischDays + ice + cleanDays;
  const portMgo  = (lp.eca ? loadDays+ice/2 : 0)*cls.auxPort + (dp.eca ? dischDays+ice/2 : 0)*cls.auxPort;
  const portMain = Math.max(0, portAll*cls.auxPort - portMgo);

  const mainGrade = ship.scrubber ? "hsfo" : "vlsfo";
  const eff = 1 - (ship.eco ? CFG.SNP.nbEcoGain : 0) - (ship.retrofit ? CFG.CII.retrofitGain : 0);
  const fuel = {};
  const mainMt = (seaMain + portMain) * eff, mgoMt = (seaMgo + portMgo) * eff;
  if(mainMt > 0.01) fuel[mainGrade] = mainMt;
  if(mgoMt  > 0.01) fuel.mgo = mgoMt;

  // Gas carriers burn their own boil-off, so much of the bill disappears.
  const fuelDiscount = cls.dualFuel === "lng" ? 0.55 : 1;

  let bunkerCost = 0, stemCost = 0; const bunkerLines = [];
  for(const [g,mt] of Object.entries(fuel)){
    const have = Math.min(mt, (ship.rob && ship.rob[g]) || 0);
    const buy  = mt - have;
    const pxHere = bunkerPrice(lp, g, mkt);
    const pxHave = (ship.robCost && ship.robCost[g]) || pxHere || CFG.FUEL[g].base;
    const pxBuy  = pxHere ?? Math.round(CFG.FUEL[g].base*(mkt?mkt.oil:1)*(1+CFG.EMERGENCY_LIFT_PREMIUM)+120);
    const c = (have*pxHave + buy*pxBuy) * fuelDiscount;
    bunkerCost += c;
    stemCost += buy*pxBuy*fuelDiscount;   // the part that is an actual purchase
    bunkerLines.push({ grade:g, mt, have, buy, px:Math.round(pxBuy), cost:c });
  }

  // --- canal tolls and war risk ----------------------------------------
  const shipVal = opts.shipValue || 20e6;
  const tolls = [];
  for(const [leg, r, laden] of [["ballast",bal,false],["laden",lad,true]])
    for(const c of Object.keys(r.canals))
      tolls.push({ canal:c, leg, laden, cost: canalToll(cls, c, laden, opts.drought) });
  const tollCost = tolls.reduce((a,t)=>a+t.cost, 0);

  const zones = warRisk(bal.path, shipVal).concat(warRisk(lad.path, shipVal));
  const seen = new Set(); const warZones = zones.filter(z=>!seen.has(z.id) && seen.add(z.id));
  let warCost = warZones.reduce((a,z)=>a+z.cost, 0);
  if(fx.guards) warCost = warZones.reduce((a,z)=>a + z.cost*(1-z.guardCut) + z.guards, 0);

  // --- revenue ----------------------------------------------------------
  // Spot: freight per unit, all voyage costs yours. Time charter: hire per day,
  // and bunkers, port costs and tolls are all on the charterer's account.
  let gross, comm, net, hireDays = 0;
  if(hireMode){
    hireDays = days;
    gross = hireMode.rate * days;
    comm  = gross * CFG.TC.addComm;
    net   = gross - comm;
  } else {
    gross = qtyOut * fx.rate;
    comm  = gross * (CFG.COMM_ADDRESS + CFG.COMM_BROKER);
    net   = gross - comm;
  }

  // --- other voyage costs ----------------------------------------------
  const daLoad = portDA(lp, cls), daDisch = portDA(dp, cls);
  const scope = euScope(lp, dp);
  const ets = etsCost(fuel, scope), feu = fuelEuCost(fuel, scope);

  // --- laytime ----------------------------------------------------------
  const laytime = fx.laytime ?? (loadDays + dischDays)*0.94;
  const overrun = (loadDays + dischDays + ice) - laytime;
  const demRate = fx.demRate ?? Math.round(cls.dwt*0.30);
  const demurrage = hireMode ? 0 : (overrun > 0 ? overrun*demRate : overrun*demRate*0.5);

  // On hire, the charterer pays the voyage bill — that is the whole point of a
  // time charter, and why its TCE is simply the hire less your own commission.
  const ownCosts = hireMode
    ? (ets.cost + feu.cost)*0        // emissions surrendered by the charterer too
    : bunkerCost + daLoad + daDisch + tollCost + warCost + ets.cost + feu.cost;
  const gvp = net - ownCosts + demurrage;
  const tce = days > 0 ? gvp/days : 0;

  const age = opts.year ? opts.year - ship.built : (ship.age ?? 15);
  // Same figure the ship is actually charged, so the estimate cannot flatter.
  const opexDaily = ship.emp && ship.emp.type === "bb" ? 0 : opexDayFull(cls, age, ship);
  const opex = opexDaily * days;

  // Working capital: everything you must fund out of your own pocket before the
  // freight advance lands on completion of loading. This is the number that
  // actually decides whether you can afford a voyage, and it is not the same
  // question as whether the voyage is profitable.
  const fixedDaily = opexDaily + (opts.debtDaily || 0);
  const preDays = balDays + loadDays;
  const advance = hireMode ? 0 : net * CFG.FREIGHT_ON_BL;
  const wcap = bunkerCost*(preDays/Math.max(days, 0.01)) + daLoad + tollCost + warCost
             + fixedDaily*preDays;

  return {
    qty, qtyOut, boilLoss, unit:intake.unit, speed:sp0, spBal, spLad, wBal, wLad,
    days, balDays, ladDays, loadDays, dischDays, portTime, canalDays, iceDays:ice, cleanDays,
    balNm:bal.nm, ladNm:lad.nm, ecaNm:bal.ecaNm+lad.ecaNm,
    altNm:bal.altNm+lad.altNm, canals:Object.assign({}, bal.canals, lad.canals),
    blocked:lad.blocked, path:lad.path,
    gross, comm, net, hireMode, hireDays,
    fuel, bunkerCost, bunkerLines, fuelDiscount, stemCost,
    daLoad, daDisch, tolls, tollCost, warZones, warCost,
    ets, feu, euScope:scope,
    laytime, overrun, demRate, demurrage,
    costs: ownCosts, gvp, tce, opex, opexDaily, netCash: gvp - opex,
    advance, wcap, preDays,
    cargoName: cargo.name, loadName: lp.name, dischName: dp.name,
  };
}

/* Best speed for a fixture. TCE is not monotonic in speed — port time does not
   shrink and the cubic term bites hard — so sweep it rather than differentiate. */
function optimalSpeed(ship, fx, mkt, opts){
  const cls = CLASSES[ship.cls];
  let best = null, bestSp = cls.designSpeed;
  for(let s = cls.minSpeed; s <= cls.maxSpeed + 1e-9; s += 0.25){
    const e = voyageEstimate(ship, fx, s, mkt, opts);
    if(best === null || e.tce > best){ best = e.tce; bestSp = s; }
  }
  return { speed: Math.round(bestSp*4)/4, tce: best };
}

/* ==========================================================================
   CII / AER — the rating that decides what charterers will pay you.
   AER = CO2 / (DWT x distance). Idle time is punished because you emit at berth
   and cover no distance, which is exactly how the real measure behaves.
   ========================================================================= */
function ciiRef(cls){
  const key = CFG.CII.ref[cls.seg] ? cls.seg : "other";
  const [a,c] = CFG.CII.ref[key];
  return a * Math.pow(cls.dwt, -c);
}
function ciiRating(ship, yr){
  const cls = CLASSES[ship.cls];
  const acc = ship.cii || { co2:0, nm:0 };
  if(acc.nm < 500) return { rating:"C", ratio:1, aer:0, required:0, thin:true };
  const aer = (acc.co2 * 1e6) / (cls.dwt * acc.nm);     // g CO2 per dwt-nm
  const red = CFG.CII.reduction[yr] ?? 0.40;
  const required = ciiRef(cls) * (1 - red);
  const ratio = aer / required;
  const b = CFG.CII.bands;
  const rating = ratio < b[0] ? "A" : ratio < b[1] ? "B" : ratio < b[2] ? "C" : ratio < b[3] ? "D" : "E";
  return { rating, ratio, aer, required };
}

/* ==========================================================================
   SURVEYS — intermediate every 2.5 years, special every 5. Not optional.
   ========================================================================= */
function nextSurvey(ship){
  const sinceSS = ship.lastSS ?? 0, sinceIS = ship.lastIS ?? 0;
  const dueSS = sinceSS + CFG.SURVEY.intervalSS;
  const dueIS = Math.max(sinceIS, sinceSS) + CFG.SURVEY.intervalIS;
  return dueSS <= dueIS ? { type:"SS", due:dueSS } : { type:"IS", due:dueIS };
}
function surveyCost(ship, type){
  const cls = CLASSES[ship.cls], age = (ship.age ?? 15);
  const k = type === "SS" ? CFG.SURVEY.costSSK : CFG.SURVEY.costISK;
  const cs = CLASS_SOC[ship.classSoc || "bv"];
  let c = k * Math.pow(cls.gt, CFG.SURVEY.gtExp)
          * (1 + CFG.SURVEY.ageCostSlope*Math.max(0, age-10)) * (cs?cs.cost:1);
  // Deferred maintenance and a hard-run hull both show up in the drydock bill.
  c *= 1 + (1 - (ship.hull ?? 1))*0.9 + (ship.deferrals||0)*CFG.SURVEY.deferPenalty;
  return Math.round(c);
}
function surveyDays(ship, type){
  const base = type === "SS" ? CFG.SURVEY.daysSS : CFG.SURVEY.daysIS;
  return base * (1 + (1-(ship.hull??1))*0.6);
}

/* ==========================================================================
   PORT STATE CONTROL — frequency and severity from flag, class, age, condition.
   ========================================================================= */
function pscRisk(ship){
  const flag = FLAGS[ship.flag || "panama"], cs = CLASS_SOC[ship.classSoc || "bv"];
  const age = ship.age ?? 15;
  const cond = 1 + (1 - (ship.hull ?? 1))*1.8;
  return CFG.PSC.baseAnnual * flag.psc * cs.psc * cond
         * (1 + Math.max(0, age-12)*0.035) * (1 + (ship.pscBump||0));
}
function pscInspect(ship, rnd){
  const flag = FLAGS[ship.flag || "panama"], cs = CLASS_SOC[ship.classSoc || "bv"];
  const cond = (1 - (ship.hull ?? 1));
  const lambda = (1.1 + cond*7 + Math.max(0, (ship.age??15)-15)*0.14
                 + (flag.psc-1)*2.2 + (cs.psc-1)*2.0) * shoreFx("pscDefMult");
  // Poisson draw on deficiencies
  let k = 0, p = Math.exp(-lambda), cum = p;
  const u = rnd();
  while(u > cum && k < 30){ k++; p *= lambda/k; cum += p; }
  const detained = k >= CFG.PSC.detainAt;
  return { deficiencies:k, detained,
           days: detained ? lerp(CFG.PSC.detainDays[0], CFG.PSC.detainDays[1], rnd()) : 0,
           cost: k*CFG.PSC.costPerDeficiency + (detained ? 65000 : 0) };
}

/* ==========================================================================
   EMPLOYMENT PRICING
   ========================================================================= */
/* Spot TCE the market is currently paying a class — the reference every other
   employment type is priced off. */
function spotTce(clsId, mkt){
  const cls = CLASSES[clsId];
  const bench = { handy:12090, pmx:15010, cape:22241, prod:24000, dirty:33000,
                  box:26000, gas:78000, pctc:52000, reefer:21000,
                  offshore:26000, aqua:35000 }[cls.idx] || 15000;
  return bench * (mkt.idx[cls.idx].v/100);
}
/* Time charter hire. Long charters price off forward expectations, so they pull
   toward mid-cycle: below spot in a boom, above it in a slump. That is what
   makes fixing at the top a real decision rather than free money. */
function tcHire(clsId, mkt, days, ship){
  const cls = CLASSES[clsId];
  const spot = spotTce(clsId, mkt);
  const mid  = spot / (mkt.idx[cls.idx].v/100);
  const i = CFG.TC.durations.findIndex(d=>d>=days);
  const prem = CFG.TC.premium[i < 0 ? CFG.TC.premium.length-1 : i];
  const pull = CFG.TC.meanRevert * Math.min(1, days/1095);
  let rate = (spot*(1-pull) + mid*pull) * prem;
  if(ship){
    const cii = ship.ciiRating || "C";
    rate *= 1 + (CFG.CII.hirePenalty[cii] || 0);
    rate *= 1 + (FLAGS[ship.flag||"panama"].rep + (CLASS_SOC[ship.classSoc||"bv"].rep||0))*0.5;
    rate *= 1 + clamp((ship.hull??1)-1, -0.25, 0)*0.5;
  }
  return Math.round(rate);
}
function bbHire(clsId, mkt){ return Math.round(spotTce(clsId, mkt)*CFG.BAREBOAT.factor); }

/* ==========================================================================
   VETTING — oil majors inspect before they load. Fail and the best crude and
   product cargoes are simply shut to you.
   ========================================================================= */
function vettingScore(ship){
  const cs = CLASS_SOC[ship.classSoc||"bv"], flag = FLAGS[ship.flag||"panama"];
  let s = CFG.VET.baseScore;
  s += (ship.hull ?? 1)*CFG.VET.hullWeight - CFG.VET.hullWeight*0.55;
  s -= Math.max(0, (ship.age??15)-12)*CFG.VET.ageDrag;
  s += (cs.rep + flag.rep)*90;
  s -= (ship.deficiencies||0)*1.6;
  s += (ship.vetPasses||0)*2.2;
  s += shoreFx("vettingBonus", 0);
  return clamp(Math.round(s), 0, 100);
}

/* ==========================================================================
   ASSET MARKET — you buy above the mark and sell below it.
   ========================================================================= */
function askPrice(clsId, age, mkt, cond){
  return Math.round(assetValue(clsId, age, mkt) * (1+CFG.SNP.spread) * (0.82 + 0.18*(cond??1)));
}
function bidPrice(clsId, age, mkt, cond){
  return Math.round(assetValue(clsId, age, mkt) * (1-CFG.SNP.spread) * (0.82 + 0.18*(cond??1)));
}
function scrapValue(clsId, mkt){
  const c = CLASSES[clsId];
  const cyc = 1 + CFG.SNP.scrapCyc*((mkt.idx[c.idx].v/100)-1);
  return Math.round(c.ldt * CFG.SNP.scrapPerLdt * clamp(cyc, 0.6, 1.5));
}

/* ==========================================================================
   DERIVATIVES — FFAs on the freight index, swaps on bunkers. Cash settled.
   ========================================================================= */
/* The forward curve pulls toward mid-cycle, so you cannot simply sell the top
   at the top: the market already expects reversion and prices it. */
function ffaPrice(idxKey, mkt, tenorDays){
  const spot = mkt.idx[idxKey].v;
  const pull = clamp(tenorDays/730, 0, 0.8) * 0.75;
  return Math.round((spot*(1-pull) + 100*pull) * 10)/10;
}
function ffaNotional(idxKey, lots){
  const bench = { handy:12090, pmx:15010, cape:22241, prod:24000, dirty:33000,
                  box:26000, gas:78000, pctc:52000, reefer:21000,
                  offshore:26000, aqua:35000 }[idxKey] || 15000;
  return bench * CFG.FFA.lotDays * lots / 100;   // $ per index point per lot-set
}
function bunkerFwd(mkt, tenorDays){
  const pull = clamp(tenorDays/730, 0, 0.8)*0.6;
  return Math.round(CFG.FUEL.vlsfo.base * (mkt.oil*(1-pull) + 1*pull));
}

/* ==========================================================================
   LINER ECONOMICS
   The central relationship: string size = ceil(round voyage / frequency) + buffer.
   Slowing the service needs MORE ships to hold the frequency but burns far less
   fuel in total. That is arithmetic, not a designed mechanic, and it is why the
   industry slow-steamed its way through 2009.
   ========================================================================= */
function linerRotation(lane, cls, speed, month, opts){
  let nm = 0, ecaNm = 0, canalDays = 0, thc = 0, calls = 0;
  const canals = {};
  const ropts = { month, drought:opts&&opts.drought, avoidCanals: opts&&opts.avoidCanals };
  for(let i=0;i<lane.ports.length-1;i++){
    const r = routeFor(cls, lane.ports[i], lane.ports[i+1], ropts);
    nm += r.nm; ecaNm += r.ecaNm;
    for(const c of Object.keys(r.canals)){ canals[c] = (canals[c]||0)+1; canalDays += CFG.CANAL[c].days; }
  }
  // Port time: each call works a share of the ship's slots in both directions.
  const uniq = [...new Set(lane.ports)];
  let portDays = 0;
  for(const pid of uniq){
    const p = PORTS[pid]; if(!p) continue;
    calls++;
    const moves  = cls.teu * 0.42;              // in + out on a typical call
    const cranes = p.rateFactor * 2.6;          // gangs working the ship
    const hrs    = moves / (cranes * 26);       // ~26 moves per crane-hour
    thc += moves * CFG.LINER.thcPerMove[p.thc || "mid"] * (lane.thcShare ?? 1);
    portDays += hrs/24 + 0.35;                  // plus pilotage, shifting, waiting
  }
  const wl = 0.04;                                       // service-average weather margin
  const seaDays = nm / (speed*(1-wl)) / 24;
  return { nm, ecaNm, seaDays, portDays, canalDays, canals, thc, calls,
           roundDays: seaDays + portDays + canalDays };
}

function linerPlan(lane, clsId, speed, freq, buffer, mkt, month, opts){
  const cls = CLASSES[clsId];
  const rot = linerRotation(lane, cls, speed, month, opts);
  const ships = Math.ceil(rot.roundDays / freq) + (buffer||0);
  const sailings = 365 / freq;                            // per year

  // --- capacity and fill ------------------------------------------------
  const idx = mkt.idx.box.v/100;
  const hhRate = lane.baseTeuRate * idx;
  const bhRate = hhRate * CFG.LINER.backhaulRate;
  const hhFill = lerp(CFG.LINER.headhaulFill[0], CFG.LINER.headhaulFill[1], lane.hh);
  const bhFill = lerp(CFG.LINER.backhaulFill[0], CFG.LINER.backhaulFill[1], lane.hh);
  const slots  = cls.teu;
  const hhTeu = slots*hhFill, bhTeu = slots*bhFill;
  const reeferTeu = Math.min(cls.reefer||0, hhTeu*0.10);

  const freightPerSailing = hhTeu*hhRate + bhTeu*bhRate
                          + reeferTeu*hhRate*(CFG.LINER.reeferUplift-1);
  // The imbalance leaves boxes at the wrong end. You move them or you run short.
  const emptyTeu = Math.max(0, hhTeu - bhTeu);
  const emptyCost = emptyTeu * CFG.LINER.emptyPerTeu * (lane.emptyShare ?? 1);

  // --- costs per sailing ------------------------------------------------
  const burn = burnAt(cls, speed, true);
  const mgoD = rot.nm>0 ? rot.seaDays*(rot.ecaNm/rot.nm) : 0;
  const mainD = rot.seaDays - mgoD;
  const pxMain = CFG.FUEL.vlsfo.base*mkt.oil + 30, pxMgo = CFG.FUEL.mgo.base*mkt.oil + 30;
  const bunkerCost = mainD*burn*pxMain + mgoD*burn*pxMgo + rot.portDays*cls.auxPort*pxMgo;
  const daCost = lane.ports.slice(0,-1).reduce((a,p)=>a+portDA(PORTS[p]||PORTS.rotterdam, cls), 0);
  const tolls = Object.keys(rot.canals).reduce((a,c)=>a+canalToll(cls,c,true,opts&&opts.drought)*rot.canals[c], 0);

  const fuelMt = mainD*burn + mgoD*burn + rot.portDays*cls.auxPort;
  const co2 = fuelMt*CFG.FUEL.vlsfo.co2;
  // Roughly half a rotation's emissions fall inside the EU scope on a lane with
  // a European end; wholly inside it on an intra-European loop.
  const euShare = lane.region === "europe" ? 1.0 : (lane.region === "eastwest" || lane.region === "atlantic") ? 0.5 : 0;
  const carbon = co2*euShare*CFG.ETS_PHASE*CFG.EUA_EUR*CFG.EUR_USD;

  // Everything beyond the ship: boxes, inland legs, the commercial network.
  const teuMoved = hhTeu + bhTeu;
  const deep = ["eastwest","transpac","atlantic","southsouth"].includes(lane.region);
  const equip   = cls.teu * CFG.LINER.boxesPerSlot * CFG.LINER.equipPerTeuYear * ships / sailings;
  const inland  = teuMoved * (deep ? CFG.LINER.inlandPerTeuDeep : 0.05) * CFG.LINER.inlandPerTeu;
  const commission = freightPerSailing * CFG.LINER.commission;
  const admin   = teuMoved * CFG.LINER.adminPerTeu;
  const sga     = freightPerSailing * CFG.LINER.sgaShare;
  const boxOps  = teuMoved * CFG.LINER.boxOpsPerTeu;
  const overhead = equip + inland + commission + admin + sga + boxOps;

  const costPerSailing = bunkerCost + daCost + tolls + rot.thc + emptyCost + carbon + overhead;

  const revYear  = freightPerSailing * sailings;
  const costYear = costPerSailing * sailings;
  const opexYear = opexDay(cls, 10) * 365 * ships;
  const ebitYear = revYear - costYear - opexYear;

  return {
    lane, cls: clsId, speed, freq, buffer, ships, rot, sailings,
    hhRate, bhRate, hhFill, bhFill, hhTeu, bhTeu, reeferTeu, emptyTeu,
    freightPerSailing, bunkerCost, daCost, tolls, thc: rot.thc, emptyCost, carbon,
    equip, inland, commission, admin, sga, boxOps, overhead, teuMoved,
    costPerSailing, revYear, costYear, opexYear, ebitYear,
    fleetBurnPerDay: burn*ships, perShipBurn: burn,
    revPerDay: revYear/365, costPerDay: (costYear+opexYear)/365,
    ebitPerDay: ebitYear/365, ebitPerShipDay: ebitYear/365/Math.max(1,ships),
  };
}
/* ############################################################################
   §STATE — the whole game is this object. It serialises to JSON verbatim, so
   save/load/export are the same code path and there is nothing to keep in sync.
   ######################################################################### */

let S = null;               // the live game state
let MKT = null;             // market (holds a PRNG closure, rebuilt on load)
let hasStorage = true;      // false => in-memory only, banner shown

const year   = (s)=> 2026 + Math.floor((s||S).day/365);
const gDate  = (s)=> new Date(CFG.START_EPOCH + (s||S).day*86400000);
const robTot = (sh)=> Object.values(sh.rob).reduce((a,b)=>a+b,0);
const shipAge= (sh)=> year() - sh.built;
const shipCls= (sh)=> CLASSES[sh.cls];

/* Secondhand value: newbuild parity discounted for age, scaled by where the
   cycle sits, floored at scrap. The floor is why old tonnage stops falling in
   a crash — a real and load-bearing feature of the asset market. */
function assetValue(clsId, age, m){
  const c = CLASSES[clsId];
  const idxNow = m ? m.idx[c.idx].v : 100;
  // Age curve anchored on the two points we have data for: newbuild and 15yr.
  const t = clamp(age/15, 0, 2.2);
  const base = age <= 15 ? lerp(c.nb, c.sh15, t) : c.sh15 * Math.pow(0.86, age-15);
  const cyc  = 0.55 + 0.45*(idxNow/100);          // values move less than rates
  const scrap= c.ldt * 520 * (0.75 + 0.25*(idxNow/100));
  return Math.max(scrap, base*cyc);
}

/* Unlock gate — systems appear only once the player has a reason to care. */
const has = (k)=> S.voyagesDone >= (CFG.UNLOCK[k] ?? CFG.UNLOCK2[k] ?? 0) || S.debug;

/* Cheap market snapshot for the UI so render never touches the PRNG. */
function snapshotMarket(){
  S.mkt = {
    oil: MKT.oil,
    idx: Object.fromEntries(Object.entries(MKT.idx).map(([k,v])=>[k, Math.round(v.v*10)/10])),
    hist: Object.fromEntries(Object.entries(MKT.hist).map(([k,v])=>[k, v.slice()])),
  };
}

/* ==========================================================================
   SAVE / LOAD
   The market PRNG cannot be serialised as a closure, so we persist the seed and
   the step count and replay the market deterministically on load. That keeps
   saves small and guarantees a loaded game continues the exact same market.
   ========================================================================= */
function serialise(){
  S.lastWall = Date.now();
  return JSON.stringify({
    v:1, s:S,
    mkt:{ seed:MKT.seed ?? S.seed, oil:MKT.oil, oilNoise:MKT.oilNoise,
          idx:MKT.idx, hist:MKT.hist, lastHist:MKT.lastHist,
          rndState:MKT.rndCount|0 },
  });
}

function save(){
  if(!hasStorage) return;
  try { localStorage.setItem(CFG.SAVE_KEY, serialise()); }
  catch(e){ hasStorage = false; showBanner("Browser storage unavailable — this session is memory-only. Use Export Save in Company to keep your run."); }
}

function load(raw){
  const d = JSON.parse(raw);
  if(!d || !d.s) throw new Error("not a Kription save");
  S = d.s;
  if(S.autoPause === undefined) S.autoPause = true;   // saves from before the setting
  if(!S.office) S.office = defaultOffice();           // saves from before the shore org
  if(S.ledger && S.ledger.shore === undefined) S.ledger.shore = 0;
  if(S.ledger && S.ledger.fees  === undefined) S.ledger.fees  = 0;
  if(S.ledger && S.ledger.lease === undefined) S.ledger.lease = 0;
  if(S.autoDraft === undefined) S.autoDraft = true;
  // Saves from before the bank carried debt on the ship. Lift each vessel's
  // mortgage into the loan book, keeping the balance, rate and remaining term.
  if(!S.loans){
    S.loans = []; S.loanSeq = 0; S.lenderSeq = 0;
    for(const sh of S.ships){
      const d = sh.debt; if(!d || !(d.principal > 0)) continue;
      const amortDay = d.orig/Math.max(1, d.termDays);
      S.loans.push({
        id:"L"+(++S.loanSeq), kind:"mortgage", shipId:sh.id,
        lender:"Nordvest Maritime Bank",
        principal:d.principal, orig:d.orig, rate:d.rate,
        drawDay:S.day - (d.orig-d.principal)/Math.max(1e-9, amortDay),
        termDays:d.termDays, amort:amortDay*CFG.BANK.period,
        nextDue:S.day + CFG.BANK.period, limit:0,
        paidP:d.paidP||0, paidI:d.paidI||0, arrears:0, arrearsDays:0,
      });
    }
  }
  syncAllDebt();
  // Rebuild the market: same seed, then restore the evolved values directly.
  MKT = newMarket(d.mkt.seed);
  MKT.oil = d.mkt.oil; MKT.oilNoise = d.mkt.oilNoise;
  MKT.idx = d.mkt.idx; MKT.hist = d.mkt.hist; MKT.lastHist = d.mkt.lastHist;
  MKT.seed = d.mkt.seed;
  // Markets saved before the second cycle wave existed carry no phase2, and an
  // undefined phase would turn every index into NaN on the first tick.
  for(const k of Object.keys(MKT.idx)) if(MKT.idx[k].phase2 === undefined)
    MKT.idx[k].phase2 = (IDX_PHASE0[k] ?? 0) * 1.7;
  // Advance the PRNG so subsequent draws are not a replay of the first ones.
  for(let i=0;i<((S.day|0)*3);i++) MKT.rnd();
  snapshotMarket();
  return S;
}

function tryLoad(){
  if(!hasStorage) return false;
  let raw = null;
  try { raw = localStorage.getItem(CFG.SAVE_KEY); }
  catch(e){ hasStorage = false; return false; }
  if(!raw) return false;
  try { load(raw); return true; }
  catch(e){ console.warn("save rejected:", e); return false; }
}

/* ==========================================================================
   OFFLINE PROGRESS
   Ships finish the voyage they are on and then go IDLE. Decisions are deferred,
   never auto-resolved, so returning to the game never means finding that it
   played itself. The day cap exists so OPEX and the market don't run away.
   ========================================================================= */
/* ############################################################################
   §SIM — the tick. Integrates in steps of at most MAX_STEP_DAYS so a long
   catch-up produces the same result as playing it through.
   ######################################################################### */

function simDays(days, quiet){
  let left = days, guard = 0;
  while(left > 1e-6 && guard++ < 20000){
    const dt = Math.min(left, CFG.MAX_STEP_DAYS);
    stepSim(dt, quiet);
    left -= dt;
  }
}

/* ==========================================================================
   VOYAGE LIFECYCLE
   The plan is computed once at fixing. Actuals accrue phase by phase as the
   voyage runs, so bunkers really leave the tanks and port bills really land on
   the day of the call. Settlement at the end compares the two.
   ========================================================================= */
/* Which phase is the ship in, and how far through it. */
function phaseOf(v){
  const p = v.plan, e = v.elapsed;
  let t = 0;
  if(e < (t += p.balDays))   return { name:"ballast",     into:e,               len:p.balDays };
  if(e < (t += p.loadDays))  return { name:"loading",     into:e-p.balDays,     len:p.loadDays };
  if(e < (t += p.ladDays))   return { name:"laden",       into:e-p.balDays-p.loadDays, len:p.ladDays };
  return { name:"discharging", into:e-p.balDays-p.loadDays-p.ladDays, len:p.dischDays };
}

/* Consume bunkers, switching grade inside an ECA.
   CASH moves when you BUY fuel — a lift, the voyage stem, or an emergency
   purchase at sea. Drawing on fuel already in the tanks is not a cash movement;
   it is inventory you have already paid for. It is still charged to the voyage
   P&L at what it cost, which is what keeps TCE honest.
   Charging cash on both the lift and the burn made fuel cost double. */
function burnFuel(sh, mt, inEca, atPort, onHire){
  if(mt <= 0) return;
  const grade = inEca ? "mgo" : (sh.scrubber ? "hsfo" : "vlsfo");
  const v = sh.voyage;
  let need = mt;
  const have = sh.rob[grade] || 0;
  const use = Math.min(have, need);
  if(use > 0){
    sh.rob[grade] = have - use; need -= use;
    const c = use * (sh.robCost[grade] ?? CFG.FUEL[grade].base);
    // Voyage P&L only — the cash left when this fuel was bought.
    if(!onHire) v.act.bunkerCost += c;
    v.act.bunkerMt[grade] = (v.act.bunkerMt[grade]||0) + use;
  }
  if(need > 0.0001){
    // Emergency stem. Priced at the nearest port that actually sells it.
    const port = atPort || PORTS[sh.port] || PORTS.rotterdam;
    const px = (bunkerPrice(port, grade, MKT) ?? CFG.FUEL[grade].base*1.25)
               * (1 + CFG.EMERGENCY_LIFT_PREMIUM);
    // Tanks dry at sea: a real purchase, so real cash.
    const c = need * px;
    if(!onHire){ v.act.bunkerCost += c; S.cash -= c; S.ledger.bunkers += c;
                 v.act.emergency = (v.act.emergency||0) + need; }
    v.act.bunkerMt[grade] = (v.act.bunkerMt[grade]||0) + need;
    sh.robCost[grade] = px;
    if(onHire) sh.rob[grade] = Math.max(sh.rob[grade]||0, need);
  }
}

/* --- number formatting ---------------------------------------------------- */
function money(n, sign){
  const a = Math.abs(n);
  let s;
  if(a >= 1e9)      s = "$"+(a/1e9).toFixed(2)+"bn";
  else if(a >= 1e6) s = "$"+(a/1e6).toFixed(a<1e7?2:1)+"M";
  else if(a >= 1e4) s = "$"+Math.round(a/1e3)+"k";
  else              s = "$"+Math.round(a).toLocaleString("en-US");
  if(n < 0) s = "−"+s;
  else if(sign) s = "+"+s;
  return s;
}
const money0 = (n)=> (n<0?"−":"")+"$"+Math.round(Math.abs(n)).toLocaleString("en-US");
/* A cost line. Zero renders as "$0", never "−$0" — a minus sign in front of
   nothing reads as a rendering fault, and early in a run there are plenty of
   cost lines still sitting at zero. */
const cost  = (n)=> n > 0.5 ? "−"+money(n)  : "$0";
const cost0 = (n)=> n > 0.5 ? "−"+money0(n) : "$0";
const perDay = (n)=> money(n, n>0) + "/d";
const days1  = (n)=> (Math.round(n*10)/10).toFixed(1)+"d";
/* Speeds come off a 0.25-knot slider, so two decimals are sometimes needed and
   usually not. Trailing zeros make a steady 13 knots look like a measurement. */
const kn = (v)=> String(+(+v).toFixed(2)) + " kn";
const pc     = (n)=> Math.round(n*100)+"%";
const nm0    = (n)=> Math.round(n).toLocaleString("en-US")+" nm";
const cls_pn = (n)=> n>=0 ? "pos" : "neg";
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dateStr(){ const d=gDate(); return d.getUTCDate()+" "+MONTHS[d.getUTCMonth()]; }
function dateFull(day){ const d=new Date(CFG.START_EPOCH+day*86400000);
  return d.getUTCDate()+" "+MONTHS[d.getUTCMonth()]+" "+d.getUTCFullYear(); }

/* Auto-pause. An idle ship is charged OPEX and debt service every day whether
   you are reading a result screen or choosing her next cargo, so the clock stops
   whenever the game interrupts you. It does NOT restart when you dismiss the
   sheet — deciding what to do next is exactly when you least want time running. */
function autoPause(reason){
  if(!S.autoPause || S.bust) return;
  S.paused = true; S.pauseReason = reason;
  dirty();
}
function resumeClock(){
  S.paused = false; S.pauseReason = null;
  dirty();
}

/* What the company costs to exist, per day. Vessel OPEX and registry fees,
   bareboat hire on tonnage leased in, the shore organisation, and debt service.
   None of it stops when a ship is idle, which is the single most important
   thing about this business to understand — so it gets its own number.

   Two exemptions, both because the cost sits somewhere else: a ship chartered
   out on bareboat is the charterer's to run, and a ship in a liner string has
   her OPEX inside the service's own economics.

   Debt service is drafted monthly but counted here as its daily equivalent, so
   the instalment that leaves the account on the 30th is never a surprise. */
function costBaseDay(){
  let c = 0;
  for(const sh of S.ships){
    const emp = sh.emp || { type:"spot" };
    if(emp.type !== "bb" && emp.type !== "liner"){
      const laid = sh.layup && sh.layup.state === "laid";
      c += opexDayFull(shipCls(sh), shipAge(sh), sh) * (laid ? CFG.LAYUP.opexShare : 1);
      if(laid) c += CLASSES[sh.cls].gt * CFG.LAYUP.berthPerGtDay;
    }
    c += CLASSES[sh.cls].gt * FLAGS[sh.flag||"marshall"].feePerGt / 365;
    if(sh.lease) c += sh.lease.daily;
  }
  return c + shoreCostDay() + debtServiceDay();
}

/* And what it earns. TCE for ships at sea, hire for ships on charter out, and
   the modelled contribution of each liner string. All three are struck before
   OPEX, which is why OPEX sits wholly on the cost side above. */
function earnDay(){
  let e = 0;
  for(const sh of S.ships){
    const emp = sh.emp || { type:"spot" };
    const offHire = !!sh.dd || sh.status === "detained";
    if(sh.voyage) e += sh.voyage.plan.tce;
    else if((emp.type === "tc" || emp.type === "bb" || emp.type === "dayrate") && !offHire)
      e += emp.rate * (1 - CFG.TC.addComm);
  }
  for(const svc of S.services) if(svc.plan) e += svc.plan.ebitPerDay;
  return e;
}
const netPerDay = ()=> earnDay() - costBaseDay();
/* Utilisation is the share of the fleet actually earning. Laid-up tonnage counts
   against you — it is idle by choice, but it is still idle. */
function utilisation(){
  if(!S.ships.length) return 0;
  return S.ships.filter(s=>s.status!=="idle" && !s.layup).length / S.ships.length;
}

  const b = $("banner"); if(!b) return;

const TOAST_MAX = 4;
function toast(msg, kind){
  const box = $("toasts");
  const el = document.createElement("div");
  el.className = "toast " + (kind||"");
  el.innerHTML = msg;
  box.appendChild(el);
  // Never more than a handful on screen; a fleet-wide event burst would
  // otherwise cover the whole interface.
  while(box.children.length > TOAST_MAX) box.firstChild.remove();
  setTimeout(()=>{ el.style.transition="opacity .3s,transform .3s";
    el.style.opacity=0; el.style.transform="translateY(-8px)";
    setTimeout(()=>el.remove(),320); }, 3000);
}

   ========================================================================= */
let coachQueue = [];
function coach(id, title, body){
  if(S.coached[id]) return;
  S.coached[id] = 1;
  coachQueue.push({ title, body });
  if(coachQueue.length === 1) showNextCoach();
}
function showNextCoach(){
  const c = coachQueue[0];
  if(!c){ $("coach").classList.remove("on"); return; }
  $("co-t").textContent = c.title; $("co-b").innerHTML = c.body;
  $("coach").classList.add("on");
}
$("co-ok").onclick = ()=>{ coachQueue.shift(); $("coach").classList.remove("on");
  if(coachQueue.length) setTimeout(showNextCoach, 220); };

function voyageBreakdown(e){
  const ship = S.ships.find(s=>s.id===e.shipId);
  const cls = ship ? shipCls(ship) : CLASSES.handysize;
  let h = `<h2 class="sect" style="margin-top:0">Days</h2><div class="card" style="margin:0">
    ${e.balDays>0.05 ? kv((has("ballast") ? T("ballast","Ballast") : "Sailing to load port")+" "+nm0(e.balNm),
