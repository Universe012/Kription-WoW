/* ==========================================================================
   §SHORE MODEL — pure functions
   ========================================================================= */
function defaultOffice(){
  return { mode:"managed", premises:"none",
           staff:{ crewing:0, technical:0, hseq:0, ops:0, chartering:0, finance:0 },
           spent:0 };
}

/* Span of control improves with scale — a large office specialises, a small one
   has everyone doing three jobs. This is what makes in-house worth doing at size
   and not worth doing at three ships. */
function scaleFactor(ships){
  return 0.55 + 0.45*Math.exp(-(Math.max(1, ships)-1)/18);
}
function deptNeed(key){
  const ships = Math.max(1, S.ships.length);
  return ships * DEPTS[key].ratio * scaleFactor(ships);
}
/* Roughly where running your own office starts to beat paying a manager. Must
   mirror the REAL calculation — you cannot hire a third of a superintendent, and
   that rounding is exactly what makes a small office expensive per ship. */
function inhouseBreakEven(){
  for(let n=4; n<=80; n++){
    const sf = scaleFactor(n);
    let heads = 0, sal = 0;
    for(const [k,d] of Object.entries(DEPTS)){
      const c = Math.max(k==="hseq"?1:0, Math.round(n*d.ratio*sf));
      heads += c; sal += c*d.salary;
    }
    const prem = heads<=4?"none":heads<=10?"small":heads<=28?"office":"hq";
    const inh = (sal + heads*CFG.OFFICE.perHeadOverhead + CFG.OFFICE.premises[prem].fixed)/365;
    const mgd = n * 4919 * 0.99 * CFG.MGMT_FEE_SHARE;   // a Handysize-equivalent fleet
    if(inh <= mgd) return n;
  }
  return 80;
}

/* Adequacy: staff held against the staff this fleet needs. 1.0 is properly run.
   Returns 1.0 in managed mode — a third-party manager is, by construction,
   averagely competent at everything. That is what you are buying. */
function deptAdequacy(key){
  const o = S.office || defaultOffice();
  if(o.mode !== "inhouse") return 1;
  return clamp((o.staff[key] || 0) / Math.max(deptNeed(key), 0.0001), 0, 2);
}
const totalHeads = ()=> Object.values((S.office||defaultOffice()).staff).reduce((a,b)=>a+b, 0);
const premisesCap = ()=> CFG.OFFICE.premises[(S.office||defaultOffice()).premises].cap;

/* What the shore organisation costs per day. */
function shoreCostDay(){
  const o = S.office || defaultOffice();
  if(o.mode !== "inhouse"){
    // The management fee carved out of every ship's OPEX, paid to the manager.
    return S.ships.reduce((a,s)=>
      a + opexDay(CLASSES[s.cls], shipAge(s)) * (s.flagMult||1) * CFG.MGMT_FEE_SHARE, 0);
  }
  let salaries = 0;
  for(const [k,d] of Object.entries(DEPTS)) salaries += (o.staff[k]||0) * d.salary;
  const overhead = totalHeads() * CFG.OFFICE.perHeadOverhead;
  const premises = CFG.OFFICE.premises[o.premises].fixed;
  return (salaries + overhead + premises) / 365;
}
function shorePerShipDay(){
  return shoreCostDay() / Math.max(1, S.ships.length);
}
/* The fee a third-party manager would charge for this fleet, for comparison. */
function managedCostDay(){
  return S.ships.reduce((a,s)=>
    a + opexDay(CLASSES[s.cls], shipAge(s)) * (s.flagMult||1) * CFG.MGMT_FEE_SHARE, 0);
}

/* --- the effect hooks the rest of the game reads ------------------------- */
const SHORE = {
  crewCostMult:   ()=> 1 + (1 - deptAdequacy("crewing"))*0.10,
  crewCrisisMult: ()=> clamp(2 - deptAdequacy("crewing"), 0.55, 2),
  hullDecayMult:  ()=> clamp(2 - deptAdequacy("technical"), 0.6, 2),
  drydockCostMult:()=> 1 + (1 - deptAdequacy("technical"))*0.25,
  breakdownMult:  ()=> clamp(2 - deptAdequacy("technical"), 0.55, 2),
  pscDefMult:     ()=> clamp(1.6 - 0.6*deptAdequacy("hseq"), 0.55, 1.6),
  vettingBonus:   ()=> (deptAdequacy("hseq") - 1)*10,
  demurrageRate:  ()=> 0.55 + 0.45*Math.min(deptAdequacy("ops"), 1),
  portDaMult:     ()=> 1 + (1 - deptAdequacy("ops"))*0.06,
  bunkerMult:     ()=> 1 - Math.max(0, deptAdequacy("ops") - 1)*0.02,
  boardMult:      ()=> 0.72 + 0.28*Math.min(deptAdequacy("chartering"), 2),
  freightMult:    ()=> 1 + (deptAdequacy("chartering") - 1)*0.03,
  loanMarginAdj:  ()=> -(deptAdequacy("finance") - 1)*0.004,
  insuranceMult:  ()=> 1 - (deptAdequacy("finance") - 1)*0.08,
  // A missing DPA is a compliance failure, not a tuning knob.
  noDpa: ()=> (S.office||{}).mode === "inhouse" && (S.office.staff.hseq||0) < 1 && S.ships.length >= 1,
};

/* Lazy accessor. §MODEL loads before this section, but only ever calls these at
   runtime, by which point the shore organisation exists. Falls back to neutral. */
function shoreFx(key, dflt){
  try { return SHORE[key](); } catch(e){ return dflt === undefined ? 1 : dflt; }
}

/* Every department at or above establishment? Used for the summary line. */
function shoreHealth(){
  const keys = Object.keys(DEPTS);
  const worst = keys.reduce((w,k)=> Math.min(w, deptAdequacy(k)), 9);
  const avg = keys.reduce((a,k)=>a+deptAdequacy(k),0)/keys.length;
  return { worst, avg,
    label: worst>=0.92 ? "Properly run" : worst>=0.75 ? "Stretched" : worst>=0.45 ? "Under-staffed" : "Skeleton" };
}

/* ==========================================================================
   §SHORE SIM
   ========================================================================= */
function accrueShore(dt){
  const c = shoreCostDay()*dt;
  S.cash -= c; S.ledger.shore = (S.ledger.shore||0) + c;
  if(S.office) S.office.spent = (S.office.spent||0) + c;
}
function officeUnlocked(){
  return S.debug || (S.ships.length >= CFG.OFFICE.minShipsInhouse && S.voyagesDone >= CFG.OFFICE.unlockVoyages);
}
function goInhouse(){
  if(!officeUnlocked()) return;
  const o = S.office;
  o.mode = "inhouse";
  // Start from the establishment a fleet this size actually needs, so the player
  // begins from a working organisation rather than an empty building.
  for(const [k,d] of Object.entries(DEPTS))
    o.staff[k] = Math.max(k==="hseq"?1:0, Math.round(deptNeed(k)));
  o.premises = totalHeads() <= 4 ? "none" : totalHeads() <= 10 ? "small" : totalHeads() <= 28 ? "office" : "hq";
  const setup = totalHeads()*DEPTS.crewing.salary*0; // no charge for the initial transfer
  hideSheet(); dirty();
  queueNote("Management taken in-house",
    `You have ${totalHeads()} people ashore across six departments, costing ${money(shoreCostDay())} a day against ${money(managedCostDay())} for third-party management.
     Departments are staffed to the nearest whole person, so one or two may still read short — the Office screen colours anything below establishment. Cut heads to save money and take the consequences, or add them where it pays.`, "good", true);
}
function goManaged(){
  const o = S.office;
  const cost = Object.entries(DEPTS).reduce((a,[k,d])=>a + (o.staff[k]||0)*d.salary*CFG.OFFICE.severance, 0);
  if(cost > S.cash){ toast("Not enough cash for the severance.", "bad"); return; }
  S.cash -= cost; S.ledger.shore = (S.ledger.shore||0)+cost;
  o.mode = "managed";
  for(const k of Object.keys(DEPTS)) o.staff[k] = 0;
  o.premises = "none";
  hideSheet(); dirty();
  toast(`Management handed to a third party. Severance ${money(cost)}.`, "warn");
}
function hire(key, n){
  const o = S.office; if(o.mode !== "inhouse") return;
  if(n > 0){
    if(totalHeads() + n > premisesCap()){
      toast(`${CFG.OFFICE.premises[o.premises].name} holds ${premisesCap()} people. Take more space first.`, "bad");
      return;
    }
    const cost = DEPTS[key].salary*CFG.OFFICE.hireCost*n;
    if(cost > S.cash){ toast("Not enough cash for recruitment.", "bad"); return; }
    S.cash -= cost; S.ledger.shore = (S.ledger.shore||0)+cost;
    o.staff[key] = (o.staff[key]||0) + n;
  } else {
    const cut = Math.min(-n, o.staff[key]||0);
    if(cut <= 0) return;
    const cost = DEPTS[key].salary*CFG.OFFICE.severance*cut;
    if(cost > S.cash){ toast("Not enough cash for the severance.", "bad"); return; }
    S.cash -= cost; S.ledger.shore = (S.ledger.shore||0)+cost;
    o.staff[key] -= cut;
  }
  dirty();
}
function setPremises(k){
  const o = S.office;
  if(totalHeads() > CFG.OFFICE.premises[k].cap){
    toast(`You have ${totalHeads()} people and that space holds ${CFG.OFFICE.premises[k].cap}.`, "bad"); return;
  }
  o.premises = k; dirty();
}

/* Send a superintendent to attend a drydock — the classic technical decision.
   Costs travel and ties one up, and pays for itself in cost and days. */
function attendDrydock(shipId){
  const sh = S.ships.find(s=>s.id===shipId); if(!sh || !sh.dd || sh.dd.attended) return;
  if((S.office||{}).mode !== "inhouse" || (S.office.staff.technical||0) < 1){
    toast("You have no superintendent of your own to send.", "bad"); return;
  }
  const cost = 24000;
  if(cost > S.cash){ toast("Not enough cash.", "bad"); return; }
  S.cash -= cost; S.ledger.shore = (S.ledger.shore||0)+cost;
  sh.dd.attended = true;
  sh.dd.left *= 0.85;
  sh.dd.bonus = 0.08;
  hideSheet(); dirty();
  toast(`Superintendent attending <b>${esc(sh.name)}</b> — ${pc(0.15)} off the time in dock and a better job done.`, "good");
}

function estimateInhouse(){
  let salaries = 0, heads = 0;
  for(const [k,d] of Object.entries(DEPTS)){

  return { heads, cost:(salaries + heads*CFG.OFFICE.perHeadOverhead + CFG.OFFICE.premises[prem].fixed)/365 };
}

/* ############################################################################
   §BANK — ship finance.

   Shipping is a capital business before it is a transport business. A ship is
   a ten-to-a-hundred-million-dollar asset earning a five-figure daily margin,
   so almost nobody buys one out of cash. What the owner actually manages is a
   balance sheet: how much debt, secured on what, at what margin, amortising
   how fast, and whether there is a working-capital line to cover the month a
   voyage pays late.

   Everything the game owes anyone lives in S.loans. Each vessel keeps a
   `sh.debt` MIRROR of the loans secured on her, rebuilt by syncShipDebt(), so
   the vessel sheet, the sale sheet and the voyage estimate can keep asking
   "what does this ship owe" without knowing the bank exists.

   Instalments are drafted MONTHLY, not daily — that is how a loan agreement
   actually works, and it is why a facility matters. The HUD still shows debt
   service as a daily-equivalent figure so the monthly draft is never a
   surprise.

   TUNING: everything below CFG.BANK. Rates are quoted as spreads over the
   company's own borrowing rate (loanRate()), which is base plus a margin set
   by the credit rating — so a wrecked balance sheet costs more to fund, which
   is the whole point.
   ######################################################################### */

Object.assign(CFG, {
  BANK: {
    period: 30.44,            // one drafting month, in days (365/12)
    graceDays: 45,            // arrears tolerated before it is an event of default
    defaultSpread: 0.035,     // penalty interest charged on overdue amounts
    arrangement: 0.0085,      // arrangement fee, share of the facility, paid on drawdown
    breakage: 0.015,          // early repayment fee on the amount prepaid
    refiFee: 0.010,           // refinancing a mortgage costs a fresh arrangement fee
    minLoan: 250000,          // below this nobody will do the paperwork
    groupCap: 0.72,           // no lender takes total debt above this share of fleet value

    // --- products ---------------------------------------------------------
    // Ship mortgage: secured on a named vessel, the cheapest money in shipping.
    mortgage: { terms: [5, 8, 12], spread: 0 },
    // Revolving credit facility: corporate, interest-only, draw and repay at
    // will. You pay a commitment fee on the part you are NOT using — that is
    // what an undrawn line costs, and it is cheap insurance against a late
    // freight payment.
    rcf: { spread: 0.012, commitment: 0.0035, ofEquity: 0.40, ofFleet: 0.18,
           gateVoyages: 6 },
    // Unsecured corporate loan: no ship behind it, so the margin is brutal and
    // the term is short. This is expensive money and should feel like it.
    corp: { spread: 0.040, terms: [6, 9, 12], ofEquity: 0.22, cap: 15000000,
            gateVoyages: 12 },
    // Sale and leaseback: sell the ship to a leasing house and bareboat her
    // back. Turns an asset into cash at the price of a daily hire you owe
    // whatever the market does — the classic way owners over-extend.
    lease: { price: 0.92, rate: 0.112, years: 7, option: 0.28, gateVoyages: 20,
             gateShips: 3 },
  },
});

Object.assign(GLOSSARY, {
  mortgage:  ["Ship mortgage", "A loan secured on a named vessel. The bank registers a mortgage against her at the flag registry; sell her and the loan is repaid out of the proceeds first."],
  rcf:       ["Revolving credit facility", "A committed line you can draw and repay at will, interest only on what you have drawn and a small fee on what you have not. Working capital for the months a voyage pays late."],
  amort:     ["Amortisation", "Repaying principal in instalments over the life of the loan, rather than all at the end. A twelve-year ship mortgage repays about a twelfth of itself each year."],
  arrears:   ["Arrears", "An instalment you did not pay when it fell due. It carries penalty interest and, left long enough, is an event of default that makes the whole loan repayable on demand."],
  leaseback: ["Sale and leaseback", "Sell the ship to a leasing house and charter her straight back on bareboat terms. You get the cash today and owe a fixed daily hire for years — cheap when rates are good, ruinous when they are not."],
  bareboatin:["Bareboat in", "Chartering a ship without crew: you man her, maintain her, insure her and pay a daily hire. Commercially she is yours; legally she is not."],
  unsecured: ["Unsecured loan", "Money lent against the company rather than against a ship. Nothing is pledged, so the lender prices the risk into the margin."],
});

/* Lenders and lessors, so the debt has faces attached to it. */
const LENDERS = ["Nordvest Maritime Bank", "Hansa Ship Finance", "Meridian Marine Capital",
                 "Aegean Vessel Credit", "Kvarven Kredittbank"];
const LESSORS = ["Pearl River Leasing", "Zhoushan Tonnage Partners", "Cyan Maritime Leasing"];
function nextLender(pool){
  const p = pool || LENDERS;
  S.lenderSeq = ((S.lenderSeq || 0) + 1) % 9973;
  return p[S.lenderSeq % p.length];
}

/* ==========================================================================
   THE LOAN BOOK
   ========================================================================= */
const bankLoans   = ()=> (S.loans || (S.loans = []));
const loansForShip= (id)=> bankLoans().filter(l=>l.shipId === id);
const corpLoans   = ()=> bankLoans().filter(l=>!l.shipId);
const rcfLoan     = ()=> bankLoans().find(l=>l.kind === "rcf") || null;

/* What falls due on this loan at the next drafting date.
   Interest is on the outstanding balance for the period. Principal is level —
   the same slice of the original amount every month — which is how ship
   mortgages are actually written. The RCF pays a commitment fee on the
   undrawn part instead of amortising. */
function loanDue(l){
  const P = CFG.BANK.period;
  const interest  = l.principal * l.rate * P / 365;
  const principal = Math.min(l.principal, l.amort || 0);
  const fee = l.kind === "rcf"
    ? Math.max(0, (l.limit || 0) - l.principal) * CFG.BANK.rcf.commitment * P / 365 : 0;
  return { interest, principal, fee, total: interest + principal + fee };
}
/* Daily-equivalent service, for the HUD and the voyage estimate. The money
   leaves monthly; the cost is incurred every day, and the player is shown the
   daily figure so the monthly draft is never news. */
const loanServiceDay   = (l)=> loanDue(l).total / CFG.BANK.period;
const shipDebtServiceDay=(sh)=> loansForShip(sh.id).reduce((a,l)=>a+loanServiceDay(l), 0);
const debtServiceDay   = ()=> bankLoans().reduce((a,l)=>a+loanServiceDay(l), 0);
const leaseCostDay     = ()=> S.ships.reduce((a,s)=>a+(s.lease ? s.lease.daily : 0), 0);
const totalArrears     = ()=> bankLoans().reduce((a,l)=>a+(l.arrears||0), 0);

/* The mirror. Everything outside this file reads sh.debt and never touches
   S.loans, so adding a product here needs no changes anywhere else. termDays
   is chosen so that orig/termDays equals the real daily principal repayment,
   which is the form the older readers expect. */
function syncShipDebt(sh){
  if(!sh) return;
  const ls = loansForShip(sh.id).filter(l=>l.principal > 0.01);
  if(!ls.length){ sh.debt = null; return; }
  const principal = ls.reduce((a,l)=>a+l.principal, 0);
  const orig      = ls.reduce((a,l)=>a+l.orig, 0);
  const intDay    = ls.reduce((a,l)=>a+l.principal*l.rate/365, 0);
  const amortDay  = ls.reduce((a,l)=>a+(l.amort||0)/CFG.BANK.period, 0);
  sh.debt = {
    mirror: true, principal, orig,
    rate: principal > 0 ? intDay*365/principal : 0,
    termDays: amortDay > 1e-9 ? orig/amortDay : 1e9,
    paidP: ls.reduce((a,l)=>a+l.paidP, 0),
    paidI: ls.reduce((a,l)=>a+l.paidI, 0),
  };
}
function syncAllDebt(){ if(S && S.ships) for(const sh of S.ships) syncShipDebt(sh); }

/* Write a new facility. */
function bankOriginate(o){
  const P = CFG.BANK.period;
  const termDays = o.termDays || (o.termYears || CFG.FIN.termYears)*365;
  const l = {
    id: "L" + (S.loanSeq = (S.loanSeq || 0) + 1),
    kind: o.kind, shipId: o.shipId || null,
    lender: o.lender || nextLender(),
    principal: o.principal || 0, orig: o.principal || 0,
    rate: o.rate, drawDay: S.day, termDays,
    amort: o.interestOnly ? 0 : (o.principal || 0) / (termDays/P),
    nextDue: S.day + P,
    limit: o.limit || 0,
    paidP: 0, paidI: 0, arrears: 0, arrearsDays: 0,
  };
  bankLoans().push(l);
  if(l.shipId) syncShipDebt(S.ships.find(s=>s.id === l.shipId));
  return l;
}
function closeLoan(l){
  S.loans = bankLoans().filter(x=>x !== l);
  if(l.shipId) syncShipDebt(S.ships.find(s=>s.id === l.shipId));
}
/* Called when a ship leaves the fleet: her mortgages are repaid out of the
   proceeds before anything reaches the owner. Returns what the bank took. */
function bankCloseForShip(shipId){
  const ls = loansForShip(shipId);
  const owed = ls.reduce((a,l)=>a+l.principal+(l.arrears||0), 0);
  S.loans = bankLoans().filter(l=>l.shipId !== shipId);
  return owed;
}

/* Headroom. A lender looks at the ship, then at the group. */
function maxMortgage(sh){
  if(!sh || sh.lease) return 0;
  const val = assetValue(sh.cls, shipAge(sh), MKT);
  const already = loansForShip(sh.id).reduce((a,l)=>a+l.principal, 0);
  const onShip = Math.max(0, val*CFG.FIN.maxLtv - already);
  return Math.min(onShip, groupHeadroom());
}
function groupHeadroom(){
  return Math.max(0, fleetValue()*CFG.BANK.groupCap - totalDebt());
}
function rcfLimit(){
  const raw = Math.min(equity()*CFG.BANK.rcf.ofEquity, fleetValue()*CFG.BANK.rcf.ofFleet);
  return Math.max(0, Math.floor(raw/100000)*100000);
}
function maxCorp(){
  const c = CFG.BANK.corp;
  return Math.max(0, Math.min(equity()*c.ofEquity, c.cap, groupHeadroom()));
}
function bankGate(k){
  const b = CFG.BANK;
  if(S.debug) return true;
  if(k === "rcf")   return S.voyagesDone >= b.rcf.gateVoyages;
  if(k === "corp")  return S.voyagesDone >= b.corp.gateVoyages;
  if(k === "lease") return S.voyagesDone >= b.lease.gateVoyages && S.ships.length >= b.lease.gateShips;
  return true;
}

/* ==========================================================================
   THE MONTHLY DRAFT
   Every loan has its own date, set a month after drawdown, so a facility taken
   mid-month is not billed a fortnight later. Cash is applied oldest-first:
   arrears, then this period's fees and interest, then principal.

   If the account is short, the shortfall in INTEREST becomes arrears and
   carries penalty interest. Unpaid PRINCIPAL is simply not repaid — the loan
   runs longer. That is both how it works and how it avoids counting the same
   dollar as debt twice.
   ========================================================================= */
function bankNewDay(d, quiet){
  const auto = S.autoDraft !== false;
  let drafted = 0, shortfall = 0, defaulted = false;

  for(const l of bankLoans().slice()){
    // Overdue money is expensive money, every day it stands out.
    if(l.arrears > 0.5){
      l.arrears *= 1 + (l.rate + CFG.BANK.defaultSpread)/365;
      l.arrearsDays += 1;
      if(l.arrearsDays > CFG.BANK.graceDays) defaulted = true;
    }
    if(d < l.nextDue) continue;
    l.nextDue += CFG.BANK.period;

    const due = loanDue(l);
    const owed = l.arrears + due.total;
    if(owed < 0.5){
      if(l.principal <= 0.01 && l.kind !== "rcf"){ retireLoan(l, quiet); }
      continue;
    }
    let left = auto ? clamp(S.cash, 0, owed) : 0;
    const pay = left;
    S.cash -= pay; drafted += pay;
    const take = (x)=>{ const t = Math.min(left, Math.max(0,x)); left -= t; return t; };
    const arrPaid = take(l.arrears);
    const feePaid = take(due.fee);
    const iPaid   = take(due.interest);
    const pPaid   = take(due.principal);

    l.arrears = (l.arrears - arrPaid) + (due.fee - feePaid) + (due.interest - iPaid);
    l.principal = Math.max(0, l.principal - pPaid);
    l.paidP += pPaid; l.paidI += iPaid + feePaid;
    S.ledger.interest += iPaid; S.ledger.fees = (S.ledger.fees||0) + feePaid;
    S.ledger.principal += pPaid;

    if(l.arrears > 0.5){ shortfall += l.arrears; if(!l.arrearsDays) l.arrearsDays = 1; }
    else { l.arrears = 0; l.arrearsDays = 0; }

    if(l.principal <= 0.01 && l.arrears <= 0.5 && l.kind !== "rcf") retireLoan(l, quiet);
    else if(l.shipId) syncShipDebt(S.ships.find(s=>s.id === l.shipId));
  }

  bankLeaseDay(d, quiet);

  if(drafted > 0 && !quiet)
    toast(`Bank instalments drafted — ${money(drafted)}.`, shortfall > 0 ? "warn" : "");
  if(shortfall > 0 && !quiet)
    queueNote("Instalment unpaid",
      `There was not enough in the account to meet ${money(shortfall)} of what fell due. It now sits in ${T("arrears","arrears")} and carries penalty interest at ${pc(CFG.BANK.defaultSpread)} over the loan rate.
       Clear it within ${CFG.BANK.graceDays} days — fix a cargo, draw on a facility, or sell something — or the lender is entitled to call the whole book.`, "bad");
  if(defaulted) checkCovenants(quiet);
}
function retireLoan(l, quiet){
  closeLoan(l);
  if(!quiet) toast(`<b>${esc(l.lender)}</b> — ${loanLabel(l)} repaid in full.`, "good");
}
/* A payment default is a covenant breach by another name; it feeds the same
   cure period and the same enforcement. */
const bankInDefault = ()=> bankLoans().some(l=>(l.arrearsDays||0) > CFG.BANK.graceDays);

/* ==========================================================================
   BORROWING
   ========================================================================= */
function takeMortgage(shipId, amount, years){
  const sh = S.ships.find(s=>s.id === shipId); if(!sh) return;
  const cap = maxMortgage(sh);
  const amt = Math.min(amount, cap);
  if(amt < CFG.BANK.minLoan){ toast("Too small for a bank to write.", "bad"); return; }
  const fee = amt*CFG.BANK.arrangement;
  const rate = loanRate(CFG.BANK.mortgage.spread);
  bankOriginate({ kind:"mortgage", shipId, principal:amt, rate, termYears:years });
  S.cash += amt - fee; S.ledger.fees = (S.ledger.fees||0) + fee;
  hideSheet(); dirty(); checkCovenants(false);
  toast(`${money(amt)} raised against <b>${esc(sh.name)}</b> at ${pc(rate)} over ${years} years. Arrangement fee ${money0(fee)}.`, "good");
}
function refinance(loanId, amount, years){
  const l = bankLoans().find(x=>x.id === loanId); if(!l || l.kind !== "mortgage") return;
  const sh = S.ships.find(s=>s.id === l.shipId); if(!sh) return;
  const val = assetValue(sh.cls, shipAge(sh), MKT);
  const others = loansForShip(sh.id).filter(x=>x !== l).reduce((a,x)=>a+x.principal, 0);
  const cap = Math.max(0, Math.min(val*CFG.FIN.maxLtv - others, groupHeadroom() + l.principal));
  const amt = Math.min(amount, cap);
  if(amt < CFG.BANK.minLoan){ toast("Too small to refinance.", "bad"); return; }
  const fee = amt*CFG.BANK.refiFee;
  const owed = l.principal + (l.arrears||0);
  const net = amt - owed - fee;
  if(net < 0 && -net > S.cash){ toast("Not enough cash to repay the difference.", "bad"); return; }
  const rate = loanRate(CFG.BANK.mortgage.spread);
  closeLoan(l);
  bankOriginate({ kind:"mortgage", shipId:sh.id, principal:amt, rate, termYears:years });
  S.cash += net; S.ledger.fees = (S.ledger.fees||0) + fee;
  hideSheet(); dirty(); checkCovenants(false);
  toast(`Refinanced <b>${esc(sh.name)}</b> at ${pc(rate)} over ${years} years — ${net>=0?money(net)+" released":money(-net)+" injected"}.`, "good");
}
function openRcf(){
  if(rcfLoan()){ toast("You already have a facility.", "bad"); return; }
  const lim = rcfLimit();
  if(lim < CFG.BANK.minLoan){ toast("Your balance sheet does not support a facility yet.", "bad"); return; }
  const fee = lim*CFG.BANK.arrangement;
  if(fee > S.cash){ toast("Not enough cash for the arrangement fee.", "bad"); return; }
  S.cash -= fee; S.ledger.fees = (S.ledger.fees||0) + fee;
  const l = bankOriginate({ kind:"rcf", principal:0, limit:lim,
                            rate:loanRate(CFG.BANK.rcf.spread), termYears:5, interestOnly:true });
  hideSheet(); dirty();
  toast(`${money(lim)} facility agreed with <b>${esc(l.lender)}</b>. Arrangement fee ${money0(fee)}.`, "good");
}
function drawRcf(amount){
  const l = rcfLoan(); if(!l) return;
  const amt = Math.min(amount, Math.max(0, l.limit - l.principal), groupHeadroom());
  if(amt < 1000){ toast("Nothing left to draw.", "bad"); return; }
  l.principal += amt; l.orig += amt;
  S.cash += amt;
  hideSheet(); dirty(); checkCovenants(false);
  toast(`Drew ${money(amt)} on the facility. ${money(l.limit-l.principal)} still available.`, "good");
}
function repayRcf(amount){
  const l = rcfLoan(); if(!l) return;
  const amt = Math.min(amount, l.principal, S.cash);
  if(amt < 1000) return;
  l.principal -= amt; l.paidP += amt;
  S.cash -= amt; S.ledger.principal += amt;
  hideSheet(); dirty(); checkCovenants(false);
  toast(`Repaid ${money(amt)} — the facility is available again.`, "good");
}
function closeRcf(){
  const l = rcfLoan(); if(!l) return;
  if(l.principal > 0.5 || l.arrears > 0.5){ toast("Repay the drawn balance first.", "bad"); return; }
  closeLoan(l); hideSheet(); dirty();
  toast("Facility cancelled. No more commitment fee.", "");
}
function takeCorp(amount, months){
  const amt = Math.min(amount, maxCorp());
  if(amt < CFG.BANK.minLoan){ toast("Too small, or no headroom left.", "bad"); return; }
  const fee = amt*CFG.BANK.arrangement;
  const rate = loanRate(CFG.BANK.corp.spread);
  bankOriginate({ kind:"corp", principal:amt, rate, termDays:months*CFG.BANK.period });
  S.cash += amt - fee; S.ledger.fees = (S.ledger.fees||0) + fee;
  hideSheet(); dirty(); checkCovenants(false);
  toast(`${money(amt)} unsecured at ${pc(rate)} over ${months} months. This is expensive money — repay it early if you can.`, "warn");
}
/* Prepayment. Term loans carry a breakage fee because the lender priced the
   whole term; the revolver does not, which is exactly what you pay the
   commitment fee for. */
function prepay(loanId, amount){
  const l = bankLoans().find(x=>x.id === loanId); if(!l) return;
  if(l.kind === "rcf") return repayRcf(amount);
  const arr = Math.min(l.arrears, amount);
  const principal = Math.min(l.principal, amount - arr);
  const fee = (arr + principal)*CFG.BANK.breakage;   // fee on what is actually repaid
  const total = arr + principal + fee;
  if(total > S.cash){ toast("Not enough cash.", "bad"); return; }
  S.cash -= total;
  l.arrears -= arr; if(l.arrears <= 0.5){ l.arrears = 0; l.arrearsDays = 0; }
  l.principal -= principal; l.paidP += principal;
  S.ledger.principal += principal; S.ledger.fees = (S.ledger.fees||0) + fee;
  if(l.shipId) syncShipDebt(S.ships.find(s=>s.id === l.shipId));
  const gone = l.principal <= 0.01 && l.arrears <= 0.5;
  if(gone) closeLoan(l);
  hideSheet(); dirty(); checkCovenants(false);
  toast(gone ? `${loanLabel(l)} cleared in full — ${money0(fee)} breakage.`
             : `${money(principal+arr)} repaid, ${money(l.principal)} outstanding.`, "good");
}

/* ==========================================================================
   SALE AND LEASEBACK
   The ship leaves your balance sheet and comes straight back on bareboat
   terms. You keep operating her — crew, maintenance, insurance, voyages, all
   unchanged — but you owe a fixed daily hire for years whether she earns or
   not, and at the end she is only yours again if you exercise the option.
   ========================================================================= */
function leasebackQuote(sh){
  const c = CFG.BANK.lease;
  const val = assetValue(sh.cls, shipAge(sh), MKT);
  const price = val*c.price;
  const owed = loansForShip(sh.id).reduce((a,l)=>a+l.principal+(l.arrears||0), 0);
  return { val, price, owed, net: price - owed,
           daily: price*c.rate/365, years: c.years, option: price*c.option };
}
function doLeaseback(shipId){
  const sh = S.ships.find(s=>s.id === shipId); if(!sh) return;
  if(sh.lease){ toast("She is already on lease.", "bad"); return; }
  const q = leasebackQuote(sh);
  if(q.net < 0 && -q.net > S.cash){ toast("The sale does not cover her mortgage.", "bad"); return; }
  bankCloseForShip(shipId);
  syncShipDebt(sh);
  S.cash += q.net;
  sh.lease = { lessor: nextLender(LESSORS), price: q.price, daily: q.daily,
               startDay: S.day, endDay: S.day + q.years*365, option: q.option,
               exercise: true, paid: 0 };
  hideSheet(); dirty(); checkCovenants(false);
  toast(`<b>${esc(sh.name)}</b> sold to ${esc(sh.lease.lessor)} for ${money(q.price)} and chartered back at ${money0(q.daily)}/day for ${q.years} years. ${money(q.net)} released.`, "good");
}
/* Expiry: exercise the option and she is yours again, or she is redelivered
   and you are a ship short. Told well in advance, both times. */
function bankLeaseDay(d, quiet){
  for(const sh of S.ships.slice()){
    const L = sh.lease; if(!L) continue;
    const left = L.endDay - d;
    if(left <= 60 && !L.warned60){
      L.warned60 = true;
      if(!quiet) queueNote("Lease expiring",
        `The bareboat charter of <b>${esc(sh.name)}</b> from ${esc(L.lessor)} ends in ${Math.round(left)} days.
         The purchase option is ${money(L.option)}. Exercise it and she is yours outright; let it lapse and she goes back to the lessor.`, "warn");
    }
    if(d < L.endDay) continue;
    if(L.exercise && S.cash >= L.option){
      S.cash -= L.option; S.ledger.snp += L.option;
      sh.lease = null;
      if(!quiet) queueNote("Option exercised",
        `<b>${esc(sh.name)}</b> is yours again — ${money(L.option)} paid to ${esc(L.lessor)}. No hire, no mortgage, free and clear.`, "good");
    } else {
      if(typeof releaseFromService === "function") releaseFromService(sh);
      S.ships = S.ships.filter(s=>s !== sh);
      if(!quiet) queueNote("Redelivered",
        `<b>${esc(sh.name)}</b> has gone back to ${esc(L.lessor)} at the end of her bareboat charter.
         ${L.exercise ? `The option was ${money(L.option)} and there was not enough in the account to take it.` : "The option was not exercised."}
         Seven years of hire bought seven years of trading, and nothing else.`, "bad");
    }
  }
}

/* ==========================================================================
   §UI — the bank lives on a segmented control inside Company, so the tab bar
   stays at six.
   ========================================================================= */
function loanLabel(l){
  if(l.kind === "rcf") return "Revolving facility";
  if(l.kind === "corp") return "Unsecured loan";
  const sh = S.ships.find(s=>s.id === l.shipId);
  return sh ? "Mortgage · " + sh.name : "Ship mortgage";
}
function nextDraftDay(){
  const ls = bankLoans(); if(!ls.length) return null;
  return ls.reduce((a,l)=>Math.min(a, l.nextDue), Infinity);
}
function nextDraftAmount(){
  const day = nextDraftDay(); if(day === null) return 0;
  // Everything falling due within the same week reads as one bill to the player.
  return bankLoans().filter(l=>l.nextDue <= day + 7)
                    .reduce((a,l)=>a+loanDue(l).total+(l.arrears||0), 0);
}

function vBank(){
  const loans = bankLoans(), debt = totalDebt(), assets = fleetValue();
  const arr = totalArrears(), svc = debtServiceDay(), lse = leaseCostDay();
  let h = "";

  if(arr > 0.5){
    const worst = Math.max(...loans.map(l=>l.arrearsDays||0));
    h += `<div class="card" style="border-color:var(--neg);background:rgba(224,82,82,.08)">
      <div class="b neg">${money(arr)} in ${T("arrears","arrears")} — ${Math.max(0,CFG.BANK.graceDays-worst)} days to clear</div>
      <div class="sm mut" style="margin-top:5px">Penalty interest is running at ${pc(CFG.BANK.defaultSpread)} over the loan rate. Past ${CFG.BANK.graceDays} days it is an event of default and the whole book becomes repayable on demand.</div></div>`;
  }

  h += `<div class="card" style="padding:14px">
    <div class="between">
      <div><div class="xs mut2">Total borrowings</div><div class="lg b">${money(debt)}</div></div>
      <div style="text-align:right"><div class="xs mut2">${T("ltv","LTV")}</div>
        <div class="lg b ${debt/Math.max(1,assets)>0.7?"neg":debt/Math.max(1,assets)>0.55?"haz":""}">${assets>0?pc(debt/assets):"—"}</div></div>
    </div>
    <div class="row xs mut2" style="margin-top:8px;gap:10px;flex-wrap:wrap">
      <span>Rating ${S.rating}</span>
      <span>Your rate ${pc(loanRate())}</span>
      <span>Service ${money0(svc)}/day</span>
      ${lse>0?`<span>Bareboat hire ${money0(lse)}/day</span>`:""}
    </div>
  </div>`;

  if(loans.length){
    const d = nextDraftDay();
    h += `<div class="card">
      ${kv("Next instalment", money(nextDraftAmount()) + " on " + dateFull(Math.ceil(d)))}
      ${kv("Monthly, all facilities", money(bankLoans().reduce((a,l)=>a+loanDue(l).total,0)))}
      <div class="between" style="margin-top:9px;padding-top:9px;border-top:1px solid var(--line)">
        <div class="grow"><div class="b sm">Auto-draft instalments</div>
          <div class="xs mut" style="margin-top:3px">${S.autoDraft!==false
            ? "Each facility is drafted from the account on its own monthly date. Short of cash and the shortfall becomes arrears."
            : '<span class="haz">Off — nothing is paid unless you pay it. Every instalment falls straight into arrears with penalty interest.</span>'}</div></div>
        <button class="btn sm" style="flex:none" onclick="S.autoDraft=!(S.autoDraft!==false);dirty()">${S.autoDraft!==false?"On":"Off"}</button>
      </div></div>`;
  }

  // --- facilities ---------------------------------------------------------
  const rcf = rcfLoan();
  if(rcf){
    const used = rcf.principal/Math.max(1, rcf.limit);
    h += `<h2 class="sect">${T("rcf","Revolving facility")}</h2>
      <div class="card tap" onclick="sheetLoan('${rcf.id}')">
        <div class="between"><div><div class="b">${esc(rcf.lender)}</div>
          <div class="xs mut2">${money(rcf.principal)} drawn of ${money(rcf.limit)} · ${pc(rcf.rate)} on drawn</div></div>
          <div style="text-align:right"><div class="b ${used>0.85?"neg":""}">${pc(used)}</div>
            <div class="xs mut2">used</div></div></div>
        <div class="bar ${used>0.85?"bad":used>0.6?"warn":""}" style="margin-top:9px"><i style="width:${pc(clamp(used,0,1))}"></i></div>
      </div>
      <div class="row" style="gap:8px">
        <button class="btn sm grow" onclick="sheetDraw()" ${rcf.principal>=rcf.limit-1000?"disabled":""}>Draw</button>
        <button class="btn sm grow" onclick="sheetRepayRcf()" ${rcf.principal<1000?"disabled":""}>Repay</button>
      </div>`;
  }

  const term = loans.filter(l=>l.kind !== "rcf");
  if(term.length){
    h += `<h2 class="sect">Term loans</h2>`;
    for(const l of term) h += loanCard(l);
  }

  const leased = S.ships.filter(s=>s.lease);
  if(leased.length){
    h += `<h2 class="sect">${T("leaseback","On bareboat charter")}</h2>`;
    for(const sh of leased){
      const L = sh.lease, left = Math.max(0, L.endDay - S.day);
      h += `<div class="card tap" onclick="sheetLease(${sh.id})">
        <div class="between"><div><div class="b">${esc(sh.name)}</div>
          <div class="xs mut2">${esc(L.lessor)} · ${(left/365).toFixed(1)} years left</div></div>
        <div style="text-align:right"><div class="b neg">−${money0(L.daily)}</div>
          <div class="xs mut2">per day</div></div></div></div>`;
    }
  }

  if(!loans.length && !leased.length)
    h += `<div class="card"><div class="sm mut">No borrowings. Debt-free is safe and slow — a ship bought with cash earns the same as a ship bought with 60% debt, on three times the capital.</div></div>`;

  // --- borrow -------------------------------------------------------------
  h += `<h2 class="sect">Raise money</h2>`;
  const mortgageable = S.ships.filter(s=>!s.lease && maxMortgage(s) >= CFG.BANK.minLoan);
  h += bankProduct("🚢", T("mortgage","Ship mortgage"),
    `Secured on one vessel, up to ${pc(CFG.FIN.maxLtv)} of her value. The cheapest money in shipping because the bank can take the ship.`,
    mortgageable.length ? `Up to ${money(Math.max(...mortgageable.map(maxMortgage)))} · from ${pc(loanRate())}` : "No unencumbered value to lend against",
    mortgageable.length ? "sheetMortgagePick()" : null);

  if(bankGate("rcf") && !rcf)
    h += bankProduct("🔄", T("rcf","Revolving credit facility"),
      `A committed line you draw and repay as you please. Interest only on what you use, ${(CFG.BANK.rcf.commitment*10000).toFixed(0)}bps a year on what you do not. This is what stops a late freight payment becoming a crisis.`,
      rcfLimit() >= CFG.BANK.minLoan ? `Limit ${money(rcfLimit())} · ${pc(loanRate(CFG.BANK.rcf.spread))}` : "Balance sheet too small",
      rcfLimit() >= CFG.BANK.minLoan ? "sheetRcf()" : null);
  else if(!bankGate("rcf"))
    h += bankProduct("🔄", "Revolving credit facility", "Working-capital line, drawn and repaid at will.",
      `Opens at ${CFG.BANK.rcf.gateVoyages} voyages · ${S.voyagesDone}/${CFG.BANK.rcf.gateVoyages}`, null);

  if(bankGate("corp"))
    h += bankProduct("📄", T("unsecured","Unsecured corporate loan"),
      `Nothing pledged, so the margin is ${(CFG.BANK.corp.spread*10000).toFixed(0)}bps over your secured rate and the term is months, not years. Fast, flexible, and dear.`,
      maxCorp() >= CFG.BANK.minLoan ? `Up to ${money(maxCorp())} · ${pc(loanRate(CFG.BANK.corp.spread))}` : "No headroom",
      maxCorp() >= CFG.BANK.minLoan ? "sheetCorp()" : null);

  if(bankGate("lease")){
    const cands = S.ships.filter(s=>!s.lease && !s.voyage);
    h += bankProduct("🏦", T("leaseback","Sale and leaseback"),
      `Sell a ship to a leasing house and charter her straight back. All the cash today, a fixed daily hire for ${CFG.BANK.lease.years} years, and she is only yours again if you take the option.`,
      cands.length ? `About ${pc(CFG.BANK.lease.price)} of market value` : "No idle ship to sell",
      cands.length ? "sheetLeasebackPick()" : null);
  }

  h += `<div class="xs mut2" style="margin:14px 2px 0">Leverage cuts both ways. Debt is repaid out of a margin that moves with the freight market, and in a downturn asset values fall faster than the loan does — that is what a ${T("covenant","covenant")} breach is, and it is how most owners who fail, fail.</div>`;
  return h;
}
function bankProduct(icon, title, blurb, foot, onclick){
  return `<div class="card${onclick?" tap":""}" ${onclick?`onclick="${onclick}"`:'style="opacity:.55"'}>
    <div class="row" style="gap:11px;align-items:flex-start">
      <div style="font-size:22px;line-height:1">${icon}</div>
      <div class="grow"><div class="b sm">${title}</div>
        <div class="xs mut" style="margin-top:3px">${blurb}</div>
        <div class="xs ${onclick?"acc":"mut2"}" style="margin-top:5px">${foot}</div></div>
    </div></div>`;
}
function loanCard(l){
  const due = loanDue(l), sh = S.ships.find(s=>s.id === l.shipId);
  const paidShare = l.orig > 0 ? clamp(l.paidP/l.orig, 0, 1) : 0;
  return `<div class="card tap" onclick="sheetLoan('${l.id}')">
    <div class="between"><div class="grow trunc">
      <div class="b trunc">${esc(loanLabel(l))}</div>
      <div class="xs mut2">${esc(l.lender)} · ${pc(l.rate)} · ${Math.max(0,Math.round((l.drawDay+l.termDays-S.day)/30.44))} months left</div></div>
      <div style="text-align:right"><div class="b">${money(l.principal)}</div>
        <div class="xs mut2">${money0(due.total)}/mo</div></div></div>
    ${l.arrears>0.5?`<div class="xs neg" style="margin-top:6px">${money(l.arrears)} overdue · ${l.arrearsDays} days</div>`:""}
    <div class="bar" style="margin-top:9px"><i style="width:${pc(paidShare)}"></i></div>
    ${sh?`<div class="xs mut2" style="margin-top:5px">${pc(l.principal/Math.max(1,assetValue(sh.cls,shipAge(sh),MKT)))} of her value</div>`:""}
  </div>`;
}

/* --- amount picker -------------------------------------------------------
   One slider, one live readout, and the derived figures update as you drag
   without rebuilding the sheet under your thumb. */
let bankAmt = 0;
function amountSlider(max, id, onchange){
  const step = Math.max(50000, Math.round(max/40/50000)*50000);
  return `<input type="range" min="0" max="${Math.round(max)}" step="${step}" value="${Math.round(bankAmt)}"
    oninput="bankAmt=+this.value;${id}()" onchange="${onchange||""}">`;
}
const bkSet = (id, txt)=>{ const e = $(id); if(e) e.innerHTML = txt; };

function sheetMortgagePick(){
  const cands = S.ships.filter(s=>!s.lease && maxMortgage(s) >= CFG.BANK.minLoan);
  showSheet("Mortgage a ship", "Which vessel",
    cands.map(sh=>{
      const val = assetValue(sh.cls, shipAge(sh), MKT), cap = maxMortgage(sh);
      const owed = loansForShip(sh.id).reduce((a,l)=>a+l.principal, 0);
      return `<div class="card tap" style="margin:0 0 9px" onclick="sheetMortgage(${sh.id})">
        <div class="between"><div><div class="b">${esc(sh.name)}</div>
          <div class="xs mut2">${CLASSES[sh.cls].name} · ${shipAge(sh)} years · worth ${money(val)}</div>
          ${owed>0?`<div class="xs mut2">${money(owed)} already secured on her</div>`:""}</div>
          <div style="text-align:right"><div class="b pos">${money(cap)}</div>
            <div class="xs mut2">available</div></div></div></div>`;
    }).join(""));
}
let mortTerm = 12, mortShip = null;
function sheetMortgage(shipId){
  const sh = S.ships.find(s=>s.id === shipId); if(!sh) return;
  mortShip = shipId;
  bankAmt = Math.round(maxMortgage(sh)/50000)*50000;
  renderMortgage(shipId);
}
function renderMortgage(shipId){
  const sh = S.ships.find(s=>s.id === shipId);
  const val = assetValue(sh.cls, shipAge(sh), MKT), cap = maxMortgage(sh);
  bankAmt = clamp(bankAmt, 0, cap);
  const rate = loanRate(CFG.BANK.mortgage.spread);
  showSheet("Mortgage " + esc(sh.name), CLASSES[sh.cls].name + " · worth " + money(val),
    `<div class="card" style="margin:0 0 12px;text-align:center;padding:15px">
      <div class="xs mut2">Raise</div>
      <div class="xl b" id="mg-amt">${money(bankAmt)}</div>
      <div class="xs mut2" id="mg-ltv">${mgLtvLine(sh, val)}</div>
     </div>
     <div class="card" style="margin:0 0 12px">
      ${amountSlider(cap, "mgTick", `renderMortgage(${shipId})`)}
      <div class="row xs mut2"><span>$0</span><span style="margin-left:auto">${money(cap)} max</span></div>
      <div class="row" style="gap:6px;margin-top:9px">
        ${[0.25,0.5,0.75,1].map(f=>`<button class="btn sm grow" onclick="bankAmt=${Math.round(cap*f)};renderMortgage(${shipId})">${pc(f)}</button>`).join("")}
      </div>
     </div>
     <h2 class="sect" style="margin-top:0">Term</h2><div class="card" style="margin:0 0 12px">
      <div class="row" style="gap:6px">${CFG.BANK.mortgage.terms.map(t=>
        `<button class="btn sm grow" ${mortTerm===t?'style="border-color:var(--acc);color:var(--acc)"':""}
          onclick="mortTerm=${t};renderMortgage(${shipId})">${t} yr</button>`).join("")}</div>
      <div class="xs mut2" style="margin-top:8px">A shorter term repays faster and costs less interest in total, but the monthly instalment is bigger and it is the instalment that sinks people.</div>
     </div>
     <h2 class="sect">Terms</h2><div class="card" style="margin:0">
      ${kvs("Rate", pc(rate) + " — base " + pc(CFG.FIN.rateBase) + " plus " + pc(rate-CFG.FIN.rateBase) + " margin at rating " + S.rating)}
      ${kv("Arrangement fee", cost0(bankAmt*CFG.BANK.arrangement), "neg")}
      ${kvt("Cash to you", money(bankAmt*(1-CFG.BANK.arrangement)), "pos")}
      <div style="height:9px"></div>
      ${kv("Monthly instalment", money0(mortInstal(bankAmt, rate, mortTerm)), "neg")}
      ${kv("Of which interest", money0(bankAmt*rate*CFG.BANK.period/365))}
      ${kv("Total interest over the term", money(bankAmt*rate*mortTerm/2*1.02))}
      ${kv("Group "+T("ltv","LTV")+" after", pc((totalDebt()+bankAmt)/Math.max(1,fleetValue())),
           (totalDebt()+bankAmt)/Math.max(1,fleetValue())>0.65?"haz":"")}
     </div>
     <div class="xs mut2" style="margin-top:10px">The bank registers a mortgage against her at the ${esc(FLAGS[sh.flag||"marshall"].name)} registry. Sell her and this is repaid out of the proceeds before anything reaches you.</div>`,
    `<button class="btn pri" ${bankAmt<CFG.BANK.minLoan?"disabled":""} onclick="takeMortgage(${shipId},${bankAmt},${mortTerm})">
      ${bankAmt<CFG.BANK.minLoan?"Too small":"Draw "+money(bankAmt)}</button>`);
}
/* When she already carries a mortgage, the LTV that matters is the total on
   her — say so, rather than letting the player read the new slice as the whole. */
function mgLtvLine(sh, val){
  const already = loansForShip(sh.id).reduce((a,l)=>a+l.principal, 0);
  const tot = bankAmt + already;
  return already > 0
    ? `${money(tot)} secured on her in total — ${pc(tot/val)} of her value`
    : `${pc(tot/val)} of her value`;
}
function mgTick(){
  bkSet("mg-amt", money(bankAmt));
  const sh = S.ships.find(s=>s.id === mortShip); if(!sh) return;
  bkSet("mg-ltv", mgLtvLine(sh, assetValue(sh.cls, shipAge(sh), MKT)));
}
function mortInstal(amt, rate, years){
  return amt*rate*CFG.BANK.period/365 + amt/(years*365/CFG.BANK.period);
}

function sheetRcf(){
  const lim = rcfLimit(), rate = loanRate(CFG.BANK.rcf.spread), fee = lim*CFG.BANK.arrangement;
  showSheet(T("rcf","Revolving credit facility"), "Working capital",
    `<div class="card" style="margin:0 0 12px;text-align:center;padding:15px">
      <div class="xs mut2">Committed limit</div><div class="xl b">${money(lim)}</div>
      <div class="xs mut2">sized on ${pc(CFG.BANK.rcf.ofEquity)} of equity and ${pc(CFG.BANK.rcf.ofFleet)} of fleet value</div>
     </div>
     <div class="card" style="margin:0 0 12px">
      <div class="sm mut">A revolver is not a loan you take, it is a loan you are allowed to take. Draw what you need on the day you need it, repay it the day the freight lands, and pay a small fee for the privilege of it being there.</div>
     </div>
     <div class="card" style="margin:0">
      ${kv("Interest on drawn", pc(rate))}
      ${kv("Commitment fee on undrawn", (CFG.BANK.rcf.commitment*100).toFixed(2)+"% a year")}
      ${kv("If you never draw it", money0(lim*CFG.BANK.rcf.commitment/365)+"/day")}
      ${kv("If fully drawn", money0(lim*rate/365)+"/day")}
      ${kv("Arrangement fee now", cost0(fee), "neg")}
      ${kvs("Repayment", "Interest only — the principal sits there until you repay it")}
     </div>
     <div class="xs mut2" style="margin-top:10px">The limit is reviewed against your balance sheet, so it grows with the fleet and shrinks in a downturn — precisely when you would want it most. That is not a bug in the design of shipping finance, it is the design.</div>`,
    `<button class="btn pri" ${fee>S.cash||lim<CFG.BANK.minLoan?"disabled":""} onclick="openRcf()">
      ${fee>S.cash?"Not enough cash for the fee":"Agree the facility"}</button>`);
}
function sheetDraw(){
  const l = rcfLoan(); if(!l) return;
  const avail = Math.min(l.limit - l.principal, groupHeadroom());
  bankAmt = clamp(bankAmt || avail, 0, avail);
  renderDraw();
}
function renderDraw(){
  const l = rcfLoan(); if(!l) return;
  const avail = Math.min(l.limit - l.principal, groupHeadroom());
  bankAmt = clamp(bankAmt, 0, avail);
  showSheet("Draw on the facility", esc(l.lender),
    `<div class="card" style="margin:0 0 12px;text-align:center;padding:15px">
      <div class="xs mut2">Draw</div><div class="xl b" id="dr-amt">${money(bankAmt)}</div>
      <div class="xs mut2">${money(avail-bankAmt)} would remain available</div></div>
     <div class="card" style="margin:0 0 12px">
      ${amountSlider(avail, "drTick", "renderDraw()")}
      <div class="row" style="gap:6px;margin-top:9px">
        ${[0.25,0.5,1].map(f=>`<button class="btn sm grow" onclick="bankAmt=${Math.round(avail*f)};renderDraw()">${pc(f)}</button>`).join("")}
      </div></div>
     <div class="card" style="margin:0">
      ${kv("Interest while drawn", money0(bankAmt*l.rate/365)+"/day")}
      ${kv("Commitment fee saved", money0(bankAmt*CFG.BANK.rcf.commitment/365)+"/day", "pos")}
      ${kv("Net cost of drawing", money0(bankAmt*(l.rate-CFG.BANK.rcf.commitment)/365)+"/day", "neg")}
      ${kv("Repayable", "Whenever you like, no fee")}
     </div>`,
    `<button class="btn pri" ${bankAmt<1000?"disabled":""} onclick="drawRcf(${bankAmt})">Draw ${money(bankAmt)}</button>`);
}
function drTick(){ bkSet("dr-amt", money(bankAmt)); }
function sheetRepayRcf(){
  const l = rcfLoan(); if(!l) return;
  const max = Math.min(l.principal, S.cash);
  bankAmt = clamp(bankAmt || max, 0, max);

}

  const max = Math.min(l.principal, S.cash);

  showSheet("Repay the facility", esc(l.lender),
    `<div class="card" style="margin:0 0 12px;text-align:center;padding:15px">
      <div class="xs mut2">Repay</div><div class="xl b" id="rr-amt">${money(bankAmt)}</div>
      <div class="xs mut2">${money(l.principal-bankAmt)} would remain drawn</div></div>
     <div class="card" style="margin:0 0 12px">
      ${amountSlider(max, "rrTick", "renderRepayRcf()")}
      <div class="row" style="gap:6px;margin-top:9px">
        ${[0.5,1].map(f=>`<button class="btn sm grow" onclick="bankAmt=${Math.round(max*f)};renderRepayRcf()">${f===1?"All":pc(f)}</button>`).join("")}
      </div></div>
     <div class="card" style="margin:0">
      ${kv("Interest saved", money0(bankAmt*l.rate/365)+"/day", "pos")}

function forceMkt(v){
  for(const k of Object.keys(MKT.idx)){
    const s = MKT.idx[k];

    const want = clamp((v/100 - 1)/CFG.MKT.amp, -1, 1);

  snapshotMarket(); dirty(); toast("Market forced to "+v, "warn");

let lastT = 0, acc = 0;
function frame(t){
  if(!lastT) lastT = t;
  const dtMs = Math.min(t - lastT, 250);   // a backgrounded tab must not lurch
  lastT = t;

  if(!S.paused && !S.bust){
    acc += dtMs;
    const step = 40;                        // sim at 25 Hz, render on demand
    while(acc >= step){
      simDays((step/1000)/CFG.SEC_PER_DAY * S.speed, false);
      acc -= step;
    }
  }

  if(!S.paused && S.events.length) autoResolveStale();

  // The top bar is cheap and always live; the screen only redraws when dirty.
  renderTop();
  if(_dirty || !sheetOpen && S.tab === "fleet"){
    if(_dirty){ snapshotMarket(); render(); _dirty = false; }
    else updateFleetProgress();
  }
  requestAnimationFrame(frame);
}

/* Cheap in-place progress update so the Fleet tab animates without a full
   re-render — a 40-ship fleet is 40 style writes, not 40 DOM rebuilds. */
function updateFleetProgress(){
  const cards = $("screen").querySelectorAll(".card .bar.pos > i");
  let i = 0;
  for(const sh of S.ships){
    if(!sh.voyage) continue;
    const el = cards[i++]; if(!el) break;
    el.style.width = pc(clamp(sh.voyage.elapsed/sh.voyage.plan.days, 0, 1));
  }
}

/* --- persistence hooks --------------------------------------------------- */
setInterval(()=>{ if(!S.bust) save(); }, CFG.AUTOSAVE_MS);
// Non-Fleet tabs hold live numbers (board, indices, P&L) but don't animate;
// a slow repaint keeps them current without rebuilding the DOM every frame.
setInterval(()=>{ if(!S.paused && !sheetOpen && S.tab !== "fleet") dirty(); }, 700);
window.addEventListener("pagehide", save);
window.addEventListener("visibilitychange", ()=>{ if(document.hidden) save(); });

/* --- start --------------------------------------------------------------- */
(function boot(){
  // storage probe
  try { localStorage.setItem("__k","1"); localStorage.removeItem("__k"); }
  catch(e){ hasStorage = false; }

  const resumed = tryLoad();
  if(!resumed) newGame();

  let off = null;
  if(resumed) off = applyOffline();

  snapshotMarket();
  render();
  requestAnimationFrame(frame);

  if(off && off.completed >= 0 && off.days >= 0.5){
    sheetAway(off);
    if(S.ships.some(s=>s.status === "idle" && (!s.emp || s.emp.type === "spot")))
      autoPause("Ships idle since you were away");
  }
  else if(!resumed){
    coach("welcome", "One ship, and a mortgage",
      `You own <b>${esc(S.ships[0].name)}</b> — a ${shipAge(S.ships[0])}-year-old Handysize bulker lying at Riga, and ${money(S.cash)} in the bank. Running costs are charged every day whether she is working or not. Find her a cargo.`);
  }
  if(!hasStorage) showBanner("Browser storage unavailable — this session is memory-only. Use Export Save in Company to keep your run.");
})();

function sheetAway(off){
  const rows = off.voyages.length
    ? off.voyages.map(e=>`<div class="card" style="margin-bottom:8px;padding:11px 13px">
        <div class="between"><div class="grow trunc">
          <div class="sm b trunc">${esc(e.loadName)} → ${esc(e.dischName)}</div>
          <div class="xs mut2">${esc(e.shipName)} · ${days1(e.days)}</div>
        </div><div style="text-align:right">
          <div class="b ${cls_pn(e.gvp)}">${money(e.gvp,e.gvp>0)}</div>
          <div class="xs mut2 mono">${money(e.tce)}/d</div>
        </div></div></div>`).join("")
    : `<div class="mut sm">No voyages completed — nothing was due to finish.</div>`;

  const idle = S.ships.filter(s=>s.status==="idle").length;
  showSheet("While you were away",
    `${days1(off.days)} elapsed${off.capped?` — capped from ${days1(off.wantedDays)}`:""}`,
    `<div class="card" style="margin:0 0 12px;text-align:center;padding:14px">
      <div class="xs mut2">Cash movement</div>
      <div class="xl bb ${cls_pn(off.cashDelta)}">${money(off.cashDelta, off.cashDelta>0)}</div>
      <div class="sm mut">after running costs and debt service</div>
    </div>
    <h2 class="sect" style="margin-top:0">Voyages completed</h2>${rows}
    ${idle?`<div class="card" style="margin-top:12px">
      <div class="sm">${idle} ship${idle===1?" is":"s are"} now idle and earning nothing. The game never fixes cargo for you — that decision is always yours.</div></div>`:""}`,
    `<button class="btn pri" onclick="hideSheet()">Continue</button>`);
}
</script>
</body>
</html>
